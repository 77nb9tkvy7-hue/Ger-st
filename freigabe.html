<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerüst-Freigabe</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
  /* Öffentliche Freigabe-Seite (QR-Code am Gerüst). Zeigt NUR BV-Nummer,
     Status und Datum – keine Namen, keine Adressen. Keine Anmeldung nötig. */
  :root{ --bg:#F2F4F6; --card:#FFFFFF; --ink:#17242D; --muted:#4B5B6B; --frei:#15803D; --gesperrt:#B91C1C; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0C161F; --card:#122130; --ink:#EAF1F6; --muted:#A9B8C4; } }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .card{background:var(--card);border-radius:20px;border-top:6px solid #FFEE00;max-width:440px;width:100%;padding:28px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.12);}
  img{width:96px;border-radius:10px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:14px 0 6px 0;}
  .status{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;margin:16px 0 8px 0;line-height:1.15;}
  .status.frei{color:var(--frei);} .status.gesperrt{color:var(--gesperrt);}
  .datum{font-size:17px;}
  .muted{color:var(--muted);font-size:14px;margin-top:14px;}
</style>
</head>
<body>
<div class="card">
  <img src="logo.png" alt="SGM">
  <h1 id="bv">Gerüst</h1>
  <div id="status" class="status">…</div>
  <div id="datum" class="datum"></div>
  <div class="muted" id="hinweis">Stahlrohrgerüstbau München</div>
</div>
<script>
// Gleiche öffentlichen Werte wie in der App (Anon-Key ist öffentlich).
const SUPABASE_URL = 'https://ruywnvsefvaxxfkoteuv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1eXdudnNlZnZheHhma290ZXV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MzMyMDIsImV4cCI6MjEwMTAwOTIwMn0.zWtis4RfHnN3jrouwSNRuwFwnDVhu0uPv58ECScnzos';
const token = new URLSearchParams(location.search).get('t') || '';
function fmt(iso){ const [y,m,d] = String(iso||'').split('-'); return d ? `${d}.${m}.${y}` : ''; }
function show(info){
  const st = document.getElementById('status');
  if(!info || !info.bv){ st.textContent = 'Kein Eintrag gefunden'; document.getElementById('hinweis').textContent = 'Bitte beim Bauleiter nachfragen.'; return; }
  document.getElementById('bv').textContent = 'Gerüst BV ' + info.bv;
  if(info.ergebnis === 'frei'){ st.className = 'status frei'; st.textContent = 'Freigegeben'; document.getElementById('datum').textContent = 'geprüft und freigegeben am ' + fmt(info.datum); }
  else { st.className = 'status gesperrt'; st.textContent = 'Gesperrt – nicht betreten'; document.getElementById('datum').textContent = 'seit ' + fmt(info.datum); }
}
// Nur für Links aus der Demo (demo.html setzt &demo=1): Daten aus dem Demo-Speicher
// im selben Browser. Echte QR-Codes fragen immer den Server.
function fromDemo(){
  if(new URLSearchParams(location.search).get('demo') !== '1') return null;
  try{
    const v = JSON.parse(localStorage.getItem('demo-state') || 'null'); if(!v) return null;
    const p = (v.projects||[]).find(x=>x.freigabeToken===token); if(!p) return null;
    const lp = (p.pruefungen||[]).slice(-1)[0]; if(!lp) return null;
    return {bv: p.id, ergebnis: lp.ergebnis, datum: lp.datum};
  }catch(e){ return null; }
}
(async ()=>{
  const demo = fromDemo();
  if(demo) return show(demo);
  if(!token) return show(null);
  try{
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/freigabe_info', {method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({p_token: token})});
    show(r.ok ? await r.json() : null);
  }catch(e){ document.getElementById('status').textContent = 'Kein Netz'; }
})();
</script>
</body>
</html>
