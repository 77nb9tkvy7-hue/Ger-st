<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerüst-Bestellung – DEMO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0069B3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gerüst-Bestellung">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Bewegungs-Kurven (Feinschliff): kräftiges ease-out für Rückmeldungen,
       iOS-artige Kurve für Fenster, die von unten hereingleiten. */
    --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
    --bg:#F2F4F6; --card:#FFFFFF; --ink:#17242D; --muted:#4B5B6B; --line:#E2E8F0; --line-strong:#CBD5E1;
    --accent:#0069B3; --accent-dark:#00538D; --accent-soft:#E1F0FA;
    /* Feste Marken-Füllfarbe für Knöpfe mit weißer Schrift -- bleibt in
       beiden Modi kräftig genug, damit der Text lesbar bleibt (--accent
       wird im Dunkelmodus bewusst heller, siehe unten). */
    --accent-solid:#0069B3;
    --surface-2:#F1F4F6; --icon-tile:#FFF9C4; --zebra:#F6F8FA;
    --disabled-bg:#CBD5E1; --disabled-fg:#F8FAFC;
    --amber:#F59E0B; --blue:#2563EB; --green:#16A34A; --red:#DC2626;
    --shadow:0 6px 18px rgba(23,36,45,0.07);
    /* Alias-Namen aus früheren Design-Ständen, die noch in Inline-Styles
       vorkommen -- zeigen bewusst auf die Grundfarben, damit sie sich im
       Dunkelmodus automatisch mit anpassen. */
    --steel:var(--muted); --concrete:var(--line); --concrete-2:var(--line-strong);
    --orange:var(--accent); --orange-dark:var(--accent-dark); --yellow:#F59E0B;
    --white:#FFFFFF; --asphalt:var(--ink);
    /* Lesbarkeit/Touch (Task 2): Mindest-Tippfläche und Schriftgrößen.
       Kontrast --muted (WCAG, Soll >= 4,5:1): hell #4B5B6B auf --bg #F2F4F6 = 6,33,
       auf --card #FFFFFF = 6,98; dunkel #A9B8C4 auf --bg #0C161F = 8,99, auf --card #122130 = 8,04.
       Status-Abzeichen (Schrift auf Fläche): Neu weiß/#64748B 4,76; In Bearbeitung #0B2A42/#F59E0B 6,87;
       Bereit weiß/#0069B3 5,72; Beladen weiß/#7C3AED 5,70; Unterwegs weiß/#2563EB 5,17;
       Geliefert weiß/#15803D 5,02 (#16A34A hätte nur 3,30). */
    --tap:48px; --fs-body:15px; --fs-small:13px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0C161F; --card:#122130; --ink:#EAF1F6; --muted:#A9B8C4; --line:#233242; --line-strong:#324457;
      --accent:#5CAEEA; --accent-dark:#8FCBFA; --accent-soft:rgba(92,174,234,0.14);
      --surface-2:#18262F; --icon-tile:rgba(255,238,0,0.12); --zebra:#0F1D29;
      --disabled-bg:#233242; --disabled-fg:#5B6B79;
      --red:#F87171; --green:#4ADE80;
      --shadow:0 1px 2px rgba(0,0,0,0.35),0 10px 26px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:var(--fs-body);}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .login-logo{display:block;margin:0 auto 14px auto;width:110px;border-radius:10px;}

  /* Menü (3 Striche) + Logo, sichtbar auch ohne Anmeldung */
  .top-nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
  .top-nav.on-dark{background:transparent;}
  .top-nav.on-light{background:var(--card);border-bottom:1px solid var(--line);}
  .top-nav-logo{height:28px;width:auto;border-radius:6px;}
  .menu-wrap{position:relative;}
  .menu-btn{background:rgba(255,255,255,0.18);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:19px;cursor:pointer;line-height:1;}
  .top-nav.on-light .menu-btn{background:var(--surface-2);color:var(--ink);}
  .menu-dropdown{position:absolute;top:46px;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:220px;overflow:hidden;z-index:41;}
  .menu-dropdown button{display:block;width:100%;text-align:left;background:none;border:none;padding:13px 14px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;}
  .menu-dropdown button:active{background:var(--accent-soft);}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0069B3 0%,#00538D 60%,#003A63 100%);padding:76px 20px 20px 20px;}
  .login-card{background:var(--card);border-radius:20px;border-top:6px solid #FFEE00;padding:30px 26px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .login-card h1{font-size:22px;margin:0 0 4px 0;text-align:center;}
  .login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;}
  .role-grid{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .role-btn{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--ink);text-align:left;}
  .role-btn svg{width:24px;height:24px;flex:none;color:var(--accent);}
  .role-btn small{display:block;font-family:'Inter';font-size:13px;color:var(--muted);font-weight:400;margin-top:2px;}
  /* Hover nur mit Maus – am Handy bliebe er nach dem Antippen "hängen" */
  @media (hover:hover) and (pointer:fine){ .role-btn:hover{border-color:var(--accent);background:var(--accent-soft);} }
  .warn{color:var(--red);font-size:13px;margin-top:8px;}

  header.chrome{background:var(--card);color:var(--ink);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #FFEE00;position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{height:34px;width:auto;flex:none;border-radius:6px;}
  .brand h1{font-size:17px;margin:0;color:var(--ink);}
  .brand span{font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);letter-spacing:0;}
  .who{text-align:right;font-size:13px;color:var(--muted);}
  .who b{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .who a{color:var(--accent);text-decoration:none;font-size:13px;cursor:pointer;}

  main{flex:1;padding:20px 16px 110px 16px;max-width:720px;margin:0 auto;width:100%;}
  .view-title{margin:4px 0 2px 0;font-size:24px;}
  .view-sub{margin:0 0 18px 0;color:var(--muted);font-size:13.5px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:var(--card);color:var(--ink);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .loc-btn{display:block;width:100%;background:var(--accent-soft);border:none;color:var(--accent-dark);border-radius:12px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;font-family:'Inter',sans-serif;}
  .maps-btn{display:block;text-align:center;background:var(--accent-soft);border:none;color:var(--accent-dark);border-radius:10px;padding:9px;font-size:13px;font-weight:600;text-decoration:none;margin-top:10px;}
  .addr-sug{background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;}
  .addr-sug div{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .addr-sug div:last-child{border-bottom:none;}
  .addr-sug div:active{background:var(--accent-soft);}
  .katalog-search{width:100%;border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14px;margin:0 0 12px 0;background:var(--card);color:var(--ink);font-family:inherit;}
  .katalog-search:focus{outline:none;border-color:var(--accent);}

  /* Bestellliste als Tabelle (kein Warenkorb) -- Name antippen+halten
     zeigt ein Detail-Popup, praktisch sobald echte Teile-Fotos da sind. */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:10px;margin-bottom:6px;}
  table.order-table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);}
  .order-table thead th{text-align:left;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1.5px solid var(--line-strong);background:var(--zebra);}
  .order-table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .order-table tbody tr:last-child td{border-bottom:none;}
  .order-table tbody tr.row-alt{background:var(--zebra);}
  .t-name{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;position:relative;isolation:isolate;}
  /* Langes Drücken: Zeile füllt sich in 480 ms (= lpTimer), dann kommt das
     Detail-Popup. Loslassen zieht die Füllung schnell zurück. */
  .lp-fill{position:absolute;inset:0;z-index:-1;background:var(--accent-soft);clip-path:inset(0 100% 0 0);transition:clip-path 150ms var(--ease-out);pointer-events:none;}
  .t-name.holding .lp-fill,.var-name.holding .lp-fill{clip-path:inset(0 0 0 0);transition:clip-path 480ms linear;}
  .t-icon{width:22px;height:22px;color:var(--accent);flex:none;}
  .t-unit{color:var(--muted);font-size:13px;}
  .t-kg{font-size:13px;color:var(--muted);opacity:0.85;white-space:nowrap;}
  .order-weight{font-size:13px;color:var(--ink);background:var(--surface-2);border-radius:10px;padding:7px 10px;margin:6px 0 2px 0;}
  .order-weight b{font-family:'Space Grotesk',sans-serif;}
  .inv-cat{font-size:13px;text-transform:uppercase;letter-spacing:0.05em;color:var(--accent-dark);margin:18px 0 8px 0;}
  .qty-ctl{display:flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden;flex:none;background:var(--card);}
  .qty-ctl button{background:none;border:none;width:48px;height:48px;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);}
  .qty-ctl button:active{background:var(--accent-soft);color:var(--accent-dark);}
  .qty-ctl .qty-num{width:64px;height:48px;padding:0;margin:0;border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong);font-weight:800;font-size:18px;color:var(--ink);font-family:inherit;font-variant-numeric:tabular-nums;background:transparent;border-top:none;border-bottom:none;border-radius:0;cursor:pointer;}
  .qty-ctl .qty-num.zero{color:var(--muted);font-weight:600;}
  .qty-ctl .qty-val{width:56px;height:48px;padding:0;margin:0;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;border:none;border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong);border-radius:0;background:transparent;color:var(--ink);font-family:inherit;-moz-appearance:textfield;appearance:textfield;}
  .qty-ctl .qty-num:active{background:var(--accent-soft);}
  /* Schnellwahl: Chips in der zweiten Zeile der Variant-Zeile */
  .var-row{flex-wrap:wrap;}
  .var-row .var-name{flex:1 1 140px;}
  .qty-chips{flex:1 0 100%;display:flex;gap:8px;padding:2px 0 6px 0;}
  .qty-chip{flex:1 1 0;min-width:0;min-height:48px;padding:0 6px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;}
  .qty-chip.on{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff;}
  .item-popup .qty-chips{margin-top:10px;padding-bottom:0;}
  .art.single > .var-row{padding-left:14px;}
  .art.single.has-cart > .var-row{box-shadow:inset 4px 0 0 var(--accent);}
  .art-single-ico{flex:none;display:flex;}
  /* Ziffernblock */
  .drawer.numpad{max-width:420px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));}
  .np-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;text-align:center;}
  .np-unit{font-size:var(--fs-small);color:var(--muted);text-align:center;}
  .np-display{font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:700;text-align:center;line-height:1.2;margin:6px 0 10px 0;font-variant-numeric:tabular-nums;min-height:64px;}
  .np-display.empty{color:var(--muted);opacity:.55;}
  .np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .np-key{min-height:64px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface-2);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;cursor:pointer;}
  .np-key:active{background:var(--accent-soft);}
  .np-key.np-ok{background:#FFEE00;border-color:#FFEE00;color:#0B2A42;}
  .np-key.np-ok:active{filter:brightness(0.92);}
  .np-key svg{width:28px;height:28px;}
  .qty-ctl .qty-val::-webkit-outer-spin-button,.qty-ctl .qty-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .qty-ctl .qty-val:focus{outline:none;background:var(--accent-soft);}
  .qty-ctl .qty-val::placeholder{color:var(--muted);opacity:.7;}

  /* Bestellliste (Task 5): großes Suchfeld oben, Teile-Arten als Zeilen,
     Antippen klappt die Varianten auf. Bewusst KEINE Animation (render()
     zeichnet alle 4 s neu). */
  .catalog-col{max-width:820px;}
  .bv-line{display:flex;align-items:center;gap:10px;margin:0 0 10px 0;}
  .bv-line label{font-size:var(--fs-small);color:var(--muted);font-weight:600;flex:none;}
  .bv-line select{flex:1;min-width:0;min-height:var(--tap);padding:0 12px;border:1.5px solid var(--line);border-radius:12px;font-size:var(--fs-body);font-family:inherit;background:var(--card);color:var(--ink);text-overflow:ellipsis;}
  .bv-line select:focus{outline:none;border-color:var(--accent);}
  .katalog-search.big{height:56px;min-height:56px;font-size:17px;padding:0 16px;border-radius:14px;border-width:2px;margin:0 0 10px 0;-webkit-appearance:none;appearance:none;}
  .quick-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px 0;}
  .quick-chips::-webkit-scrollbar{display:none;}
  .reorder-chip{flex:0 0 auto;min-height:var(--tap);padding:0 16px;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--card);color:var(--ink);font-family:'Inter',sans-serif;font-size:var(--fs-small);font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .art-list{border:1px solid var(--line-strong);border-radius:12px;background:var(--card);overflow:hidden;margin:10px 0 12px 0;}
  .art + .art,.fav-block + .art{border-top:1px solid var(--line);}
  .art-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 12px 6px 14px;background:none;border:none;color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;}
  .art-name{flex:1;min-width:0;font-size:16px;font-weight:700;}
  .art-meta{flex:none;font-size:var(--fs-small);color:var(--muted);white-space:nowrap;}
  .art-meta b{color:var(--accent-dark);font-weight:800;}
  .art-chev{flex:none;display:flex;color:var(--muted);}
  .art.open .art-chev{transform:rotate(90deg);}
  .art.open > .art-row{background:var(--accent-soft);}
  .art.has-cart > .art-row{box-shadow:inset 4px 0 0 var(--accent);}
  .art-body{border-top:1px solid var(--line);background:var(--surface-2);}
  .art-sub{font-size:var(--fs-small);font-weight:700;color:var(--accent-dark);letter-spacing:0.03em;padding:10px 14px 4px 14px;}
  .fav-block{border-bottom:2px solid var(--line-strong);}
  .fav-h{padding-top:12px;}
  .var-row{display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 10px 6px 14px;border-top:1px solid var(--line);}
  .art-sub + .var-row,.art-body > .var-row:first-child,.search-results > .var-row:first-child{border-top:none;}
  .var-row.on .var-label{color:var(--accent-dark);}
  .var-name{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:48px;position:relative;isolation:isolate;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;border-radius:8px;padding:0 4px;margin-left:-4px;}
  .var-label{font-size:17px;font-weight:700;line-height:1.25;}
  .var-sub{font-size:var(--fs-small);color:var(--muted);}
  .pu-open-btn.calm{border:1.5px solid var(--line-strong);text-align:left;padding:0 14px;display:flex;align-items:center;font-weight:600;margin:4px 0 14px 0;}

  /* Detail-Popup pro Teil (langes Drücken auf den Namen) */
  .overlay-center{align-items:center;}
  .item-popup{background:var(--card);border-radius:20px;padding:24px;max-width:300px;width:88%;margin:auto;text-align:center;}
  .item-popup-photo{aspect-ratio:4/3;border:1.5px dashed var(--line-strong);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accent);background:var(--zebra);margin-bottom:14px;}
  .item-popup-photo svg{width:40px;height:40px;}
  .item-popup-photo span{font-size:13px;color:var(--muted);letter-spacing:0.03em;}
  .item-popup-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;}
  .item-popup-unit{font-size:13px;color:var(--muted);margin:2px 0 14px 0;}
  .item-popup .qty-ctl{margin:0 auto;}

  /* Bestellung prüfen (Bestellschein-Vorschau vor dem Abschicken) */
  .review-head{padding:4px 4px 14px 4px;border-bottom:2px dashed var(--line-strong);margin-bottom:14px;}
  .review-head .eyebrow{font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
  .review-head h3{font-size:19px;margin-top:4px;}
  .review-meta{font-size:13px;color:var(--muted);margin:0 4px 14px 4px;}
  .review-meta b{color:var(--ink);}
  .review-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:18px;}
  .review-table th{text-align:left;font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);padding:8px 4px;border-bottom:1.5px solid var(--line-strong);}
  .review-table th.num,.review-table td.num{text-align:right;}
  .review-table td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}

  .order-footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -6px 20px rgba(23,36,45,0.08);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);z-index:15;max-width:720px;margin:0 auto;border-radius:16px 16px 0 0;}
  .submit-btn{background:#FFEE00;color:#0B2A42;border:none;padding:12px 22px;border-radius:999px;font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:700;cursor:pointer;}
  .submit-btn:disabled{background:var(--disabled-bg);color:var(--disabled-fg);cursor:not-allowed;}

  /* Bestätigungs-Ticket */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;}
  .drawer{background:var(--card);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:20px;max-height:82vh;overflow-y:auto;}
  .ticket{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:0;max-width:340px;margin:auto;position:relative;overflow:hidden;}
  .ticket-top{padding:20px 20px 14px 20px;border-bottom:2px dashed var(--line);}
  .ticket-body{padding:14px 20px 20px 20px;}
  .stamp{position:absolute;top:14px;right:16px;border:3px solid var(--accent);color:var(--accent);border-radius:50%;width:74px;height:74px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;text-align:center;transform:rotate(-10deg);line-height:1.15;}
  .ticket-order-no{font-size:28px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .ticket-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;}
  .ticket-row span:first-child{color:var(--muted);}

  /* Bestellkarten (Lager/Fahrer/Chef) */
  .order-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;}
  .order-card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:#94A3B8;}
  .order-card.st-Neu::before{background:#94A3B8;}
  .order-card.st-InBearbeitung::before{background:var(--amber);}
  .order-card.st-BereitzurAbholung::before{background:var(--accent);}
  .order-card.st-Beladen::before{background:#7C3AED;}
  .order-card.st-Unterwegs::before{background:var(--blue);}
  .order-card.st-Geliefert::before{background:var(--green);}
  .order-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .order-head .no{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;}
  .order-head .site{font-size:13px;color:var(--muted);}
  .status-badge{font-size:var(--fs-small);font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .status-badge.st-Neu{background:#64748B;color:#fff;}
  .status-badge.st-InBearbeitung{background:#F59E0B;color:#0B2A42;}
  .status-badge.st-BereitzurAbholung{background:#0069B3;color:#fff;}
  .status-badge.st-Beladen{background:#7C3AED;color:#fff;}
  .status-badge.st-Unterwegs{background:#2563EB;color:#fff;}
  .status-badge.st-Geliefert{background:#15803D;color:#fff;}
  .order-items{font-size:13px;color:var(--ink);margin:8px 0;line-height:1.55;}
  .order-items li{margin-left:18px;}
  .order-time{font-size:13px;color:var(--muted);margin-bottom:4px;}
  .advance-btn{width:100%;background:#FFEE00;color:#0B2A42;border:none;padding:12px;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:10px;}
  .advance-btn:active{filter:brightness(0.94);}
  .done-label{font-size:13px;color:var(--green);font-weight:700;margin-top:8px;}
  .empty-state{text-align:center;color:var(--muted);padding:44px 10px;font-size:13.5px;}
  .waiting-note{font-size:13px;color:#92400E;background:#FEF3C7;padding:10px 12px;border-radius:12px;margin-bottom:12px;}
  .mine-section{margin-top:28px;border-top:2px dashed var(--line);padding-top:18px;}
  .mine-section h3{font-size:15px;margin:0 0 10px 0;}
  .refresh-row{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .refresh-btn{background:var(--card);border:1.5px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;}
  .loading{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px;}

  /* Segmented control (Lager) */
  .seg-control{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin:12px 0 16px 0;}
  .seg-control button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);}
  .seg-control button.active{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(23,36,45,0.12);}

  /* Inventur */
  .inv-list{display:flex;flex-direction:column;gap:10px;}
  .inv-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);}
  .inv-icon{width:40px;height:40px;background:var(--icon-tile);border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
  .inv-icon svg{width:22px;height:22px;}
  .inv-main{flex:1;}
  .inv-name{font-size:14px;font-weight:600;}
  .inv-qty{font-size:13px;color:var(--muted);margin-top:2px;}
  .inv-qty.stock-low{color:#B45309;font-weight:700;}
  .inv-qty.stock-missing{color:var(--red);font-weight:700;}
  .inv-qty .tag{margin-left:6px;background:var(--surface-2);border-radius:999px;padding:2px 8px;font-size:13px;}
  .inv-actions{display:flex;gap:5px;flex:none;}
  .inv-actions button{background:var(--surface-2);color:var(--ink);border:none;border-radius:9px;width:32px;height:32px;font-size:15px;font-weight:700;cursor:pointer;}
  .inv-actions button:active{background:var(--accent-solid);color:#fff;}
  .inv-restock{width:auto !important;padding:0 10px !important;font-size:13px !important;font-family:'Inter',sans-serif !important;}

  /* Chef */
  .stat-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .stat-chip{background:var(--card);border-radius:14px;padding:10px 14px;text-align:center;min-width:74px;box-shadow:var(--shadow);}
  .stat-chip b{display:block;font-family:'Space Grotesk',sans-serif;font-size:20px;}
  .stat-chip span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}

  /* Kartenlisten: am Handy eine Spalte, am PC mehrere nebeneinander */
  .card-grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start;margin-bottom:12px;}
  .card-grid > .order-card{margin-bottom:0;}

  /* Widgets: kurze Info-Kacheln oben (Idee wie iPhone-Widgets) */
  .widget-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px 0;}
  .widget{--wc:var(--muted);display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--card);border:none;border-radius:20px;padding:14px 14px 13px 14px;box-shadow:var(--shadow);font-family:'Inter',sans-serif;color:var(--ink);min-height:104px;position:relative;overflow:hidden;}
  button.widget{cursor:pointer;}
  .jump-flash{animation:jumpFlash 1.2s var(--ease-out);border-radius:10px;}
  @keyframes jumpFlash{0%{background:rgba(255,238,0,0.45);box-shadow:0 0 0 6px rgba(255,238,0,0.45);}100%{background:transparent;box-shadow:0 0 0 6px transparent;}}
  @keyframes jumpFlashSoft{0%{background:rgba(255,238,0,0.45);}100%{background:transparent;}}
  button.widget:active{transform:scale(0.98);}
  .widget::after{content:'';position:absolute;inset:0;background:var(--wc);opacity:0.07;pointer-events:none;}
  .w-top{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0.01em;}
  .w-dot{width:9px;height:9px;border-radius:50%;background:var(--wc);flex:none;}
  .w-ico{width:22px;height:22px;border-radius:7px;background:var(--wc);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .w-ico .ic{width:14px;height:14px;vertical-align:0;margin:0;}
  .widget-grid.three .w-ico{width:20px;height:20px;border-radius:6px;}
  .widget-grid.three .w-ico .ic{width:13px;height:13px;}
  /* Symbole (ic()) – laufen in der Textfarbe mit */
  .ic{width:1.15em;height:1.15em;vertical-align:-0.2em;flex:none;display:inline-block;}
  .ic-red{color:var(--red);}
  .forgot-link{background:none;border:none;color:var(--accent);font:inherit;font-size:14px;font-weight:600;margin:12px auto 0 auto;display:block;cursor:pointer;padding:6px;}
  .forgot-box{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;margin-top:6px;color:var(--ink);}
  .new-pin-btn{margin-bottom:8px;}
  .new-pin-box{border:2px solid var(--accent);border-radius:14px;padding:12px 14px;margin:6px 0 10px 0;background:var(--surface-2);}
  .new-pin-box .np-title{font-weight:700;font-size:14px;}
  .new-pin-box .np-pin{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;letter-spacing:0.12em;margin:4px 0;color:var(--ink);user-select:all;}
  .new-pin-box .np-hint{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .my-pw-card{border:2px solid var(--accent);margin-bottom:14px;}
  .wunsch-badge .ic-red, .active > .ic-red{color:inherit;}
  .menu-btn .ic{width:20px;height:20px;vertical-align:middle;}
  .plan-icon .ic{width:24px;height:24px;color:var(--accent);}
  .plan-del .ic{width:18px;height:18px;vertical-align:middle;}
  .w-value{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;line-height:1.1;margin-top:8px;color:var(--wc);}
  .w-value.small{font-size:17px;margin-top:10px;color:var(--ink);}
  .w-detail{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .widget-grid.three{grid-template-columns:repeat(3,1fr);gap:8px;}
  .widget-grid.three .widget{min-height:86px;padding:11px 10px;border-radius:16px;}
  .widget-grid.three .w-value{font-size:24px;margin-top:6px;}
  .widget-grid.three .w-top{font-size:13px;align-items:flex-start;}
  .widget-grid.three .w-dot{margin-top:3px;}
  .widget-grid.three .w-detail{font-size:13px;}
  .w-green{--wc:#1E9E5A;} .w-blue{--wc:var(--blue);} .w-sky{--wc:#3AA0E6;} .w-amber{--wc:var(--amber);}
  .w-red{--wc:var(--red);} .w-accent{--wc:var(--accent);} .w-grey{--wc:#7A8896;}
  .w-dots{display:flex;gap:10px;margin-top:6px;font-size:13px;font-weight:700;color:var(--ink);}
  .w-dots span{display:flex;align-items:center;gap:4px;}
  .w-dots i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* Bauvorhaben-Liste (Chef): erst Liste mit Status-Farben, Antippen
     öffnet die Detail-Ansicht */
  .proj-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:0 0 12px 0;}
  .proj-legend span{display:flex;align-items:center;gap:6px;}
  .proj-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .proj-list{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px;}
  .proj-row{--pc:var(--line-strong);display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:none;border-radius:16px;padding:14px 14px 14px 0;box-shadow:var(--shadow);cursor:pointer;font-family:'Inter',sans-serif;color:var(--ink);overflow:hidden;}
  .proj-row:active{transform:scale(0.99);}
  .proj-row-bar{width:6px;align-self:stretch;background:var(--pc);border-radius:0 6px 6px 0;flex:none;}
  .proj-row-main{flex:1;min-width:0;}
  .proj-row-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;}
  .proj-row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .proj-row-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:6px;}
  .proj-row-meta .pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink);}
  .proj-row-meta .pill i{width:9px;height:9px;border-radius:50%;background:var(--pc);display:inline-block;border:1px solid var(--line-strong);}
  .proj-row-chev{font-size:22px;color:var(--muted);padding-right:4px;}
  .order-card.proj-card::before{background:var(--pc,#94A3B8);width:6px;}
  .back-link{background:none;border:none;color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 0;margin:0 0 10px 0;font-family:'Inter',sans-serif;}
  .section-h{font-size:15px;margin:22px 0 10px 0;}
  .detail-grid{display:block;}
  .drv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .drv-row:last-child{border-bottom:none;}
  .drv-row .drv-sub{font-size:13px;color:var(--muted);}
  .drv-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .chip-btn{border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .chip-btn.primary{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff;}
  .chip-btn.done{background:var(--accent-soft);border-color:transparent;color:var(--accent-dark);cursor:default;}

  /* Fahrer-Kalender: Wochenleiste + Tagesliste */
  .week-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .week-nav .chip-btn{min-width:38px;}
  .week-label{flex:1;text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;}
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .day-cell{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:8px 2px 7px 2px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);font-family:'Inter',sans-serif;}
  .day-cell.today{border-color:var(--accent);}
  .day-cell.active{background:var(--accent-solid);color:#fff;border-color:var(--accent-solid);}
  .day-wd{font-size:13px;font-weight:600;opacity:0.75;}
  .day-no{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;line-height:1;}
  .day-dots{display:flex;gap:3px;min-height:7px;}
  .day-dots i{width:7px;height:7px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px var(--card);}
  .ev-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .ev-time{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;}
  .ev-kind{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .ev-kind.termin{background:var(--accent-soft);color:var(--accent-dark);}
  .ev-kind.lieferung{background:#DCFCE7;color:#166534;}
  .ev-notiz{font-size:13px;margin-top:6px;}
  .ev-kind.fertig{background:var(--surface-2);color:var(--ink);}
  .bv-map-slot{margin:0 0 16px 0;}
  .push-card{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:14px 16px;margin:0 0 14px 0;font-size:13px;line-height:1.45;}
  .push-card b{font-family:'Space Grotesk',sans-serif;font-size:15px;display:block;margin-bottom:4px;}
  .push-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .bv-map{height:340px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface-2);z-index:0;}
  .bv-tip{background:var(--card);color:var(--ink);border:none;box-shadow:0 1px 4px rgba(0,0,0,0.25);font-weight:700;font-size:11px;padding:2px 6px;}
  .bv-tip::before{display:none;}
  .truck-pin{display:flex;align-items:center;justify-content:center;color:var(--blue);background:var(--card);border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35);border:2px solid #FFEE00;}
  .truck-tip{font-size:13px;}
  .pos-chip.live{border-color:#1E9E5A;}
  .sec-h{font-size:15px;margin:22px 0 10px 0;display:flex;align-items:center;gap:8px;}
  .sec-n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--surface-2);font-size:13px;font-family:'Inter',sans-serif;}
  .done-toggle{display:block;width:100%;text-align:left;margin:14px 0 10px 0;border:none;background:var(--surface-2);color:var(--muted);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .mini-btn{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;font-family:'Inter',sans-serif;}
  .order-card .order-weight{padding:6px 10px;margin-top:6px;}
  .rn-ico{display:none;}
  .rn-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#DC2626;color:#fff;font-size:13px;font-weight:700;margin-left:6px;font-family:'Inter',sans-serif;line-height:1;}
  .geo-badge.geo-on{padding:7px 12px;font-size:13px;}
  @media (max-width: 899px){
    .role-nav{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:18px 18px 0 0;z-index:20;background:var(--card);box-shadow:0 -6px 20px rgba(23,36,45,.14);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px;}
    .role-nav button{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 0 6px 0;font-size:13px;position:relative;border-radius:12px;min-height:54px;}
    .role-nav button.active{background:var(--accent-soft);color:var(--accent-dark);box-shadow:none;}
    .role-nav .rn-ico{display:block;line-height:1;}
    .role-nav .rn-ico .ic{width:22px;height:22px;vertical-align:0;}
    .role-nav .rn-lbl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;max-width:100%;text-align:center;line-height:1.15;overflow-wrap:normal;hyphens:auto;font-size:13px;}
    .role-nav .rn-badge{position:absolute;top:3px;left:calc(50% + 6px);margin:0;}
    body.has-nav main{padding-bottom:calc(150px + env(safe-area-inset-bottom));}
    body.has-nav .order-footer{bottom:calc(66px + env(safe-area-inset-bottom));border-radius:16px;}
    body.has-nav .toast{bottom:calc(150px + env(safe-area-inset-bottom));}
    /* Info-Kacheln am Handy flacher, damit die Arbeit (Bestellungen/
       Lieferungen) schneller im Bild ist */
    .widget-grid:not(.three){gap:8px;margin:8px 0 12px 0;}
    .widget-grid:not(.three) .widget{min-height:74px;padding:10px 12px;border-radius:16px;}
    .widget-grid:not(.three) .w-value{font-size:24px;margin-top:4px;}
    .widget-grid:not(.three) .w-value.small{font-size:15px;margin-top:6px;}
    .widget-grid:not(.three) .w-detail{-webkit-line-clamp:1;margin-top:2px;}
    .view-title{margin-bottom:4px;}
  }
  .pu-open-btn{display:block;width:100%;margin:6px 0 14px 0;border:1.5px dashed #3AA0E6;background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;text-align:center;}
  .pu-card::before{background:#3AA0E6 !important;}
  .pu-card.pu-done{background:var(--surface-2);}
  .pu-card.pu-done::before{background:var(--line-strong) !important;}
  .pu-badge{background:rgba(58,160,230,.15);color:var(--accent-dark);}
  .pu-abbau{font-size:13px;font-weight:700;margin:6px 0;}
  .pu-vor{font-size:13px;color:var(--muted);font-weight:500;}
  .pu-quick{display:flex;gap:8px;margin:8px 0;}
  .pu-quick .refresh-btn{flex:1;}
  .pu-check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:4px 0 8px 0;cursor:pointer;}
  .pu-check input{width:20px;height:20px;}
  .pu-sum{font-size:13px;font-weight:700;margin-top:10px;color:var(--muted);}
  .pu-del{display:block;margin:8px auto 0 auto;border:none;background:none;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;font-family:'Inter',sans-serif;}
  .ev-kind.abholung{background:rgba(58,160,230,.15);color:var(--accent-dark);}
  .reorder-btn{display:block;width:100%;margin-top:8px;border:1.5px solid var(--accent);background:var(--card);color:var(--accent-dark);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
  .pick-all-btn{display:block;width:100%;margin-top:8px;border:1.5px solid #1E9E5A;background:rgba(30,158,90,0.08);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);max-width:calc(100% - 32px);width:max-content;background:#0B2A4A;color:#fff;border-left:5px solid #FFEE00;border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity 150ms ease-out, transform 150ms ease-out;z-index:1000;font-family:'Inter',sans-serif;}
  /* rein 220 ms mit kräftigem ease-out, raus schneller (150 ms, Regel oben) */
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);transition-duration:220ms;transition-timing-function:var(--ease-out);}
  .plaene{margin:12px 0 4px 0;padding:10px;border-radius:12px;background:var(--surface-2);}
  .plaene-head{font-size:13px;font-weight:700;margin-bottom:6px;}
  .plaene-list{display:flex;flex-direction:column;gap:6px;}
  .plan-row{display:flex;align-items:center;gap:6px;}
  .plan-link{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:7px 9px;text-decoration:none;color:var(--ink);}
  .plan-thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--surface-2);}
  .plan-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:var(--surface-2);border-radius:6px;}
  .plan-txt{min-width:0;display:flex;flex-direction:column;}
  .plan-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .plan-meta{font-size:13px;color:var(--muted);}
  .plan-del{border:none;background:var(--card);border-radius:10px;width:40px;height:40px;font-size:17px;cursor:pointer;flex-shrink:0;}
  .plan-upload{display:block;text-align:center;margin-top:10px;background:#FFEE00;color:#0B2A4A;font-weight:700;font-size:14px;border-radius:12px;padding:11px 14px;cursor:pointer;}
  .plan-upload.busy{opacity:0.6;pointer-events:none;}
  .plan-hint{font-size:13px;color:var(--muted);margin-top:6px;}
  .wunsch-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px 0;}
  .wunsch-badge{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink);}
  .wunsch-badge.w-urgent{background:#DC2626;color:#fff;}
  .wunsch-badge.w-today{background:var(--amber);color:#1a1a1a;}
  .wunsch-badge.w-nach{background:var(--accent-soft);color:var(--accent-dark);}
  .wunsch-pick{margin:16px 0 14px 0;}
  .wunsch-pick-label{font-size:13px;font-weight:700;margin-bottom:8px;}
  .ziel-chip.urgent.active{background:#DC2626;border-color:#DC2626;color:#fff;}
  .wunsch-date{margin-top:10px;width:100%;padding:11px 12px;border:1.5px solid var(--line-strong);border-radius:12px;font-size:15px;background:var(--card);color:var(--ink);font-family:'Inter',sans-serif;box-sizing:border-box;}
  .pick-hint{font-size:13px;color:var(--muted);margin:10px 0 6px 0;}
  .pick-list{display:flex;flex-direction:column;gap:6px;}
  .pick-row{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:0;background:var(--card);overflow:hidden;}
  .pick-row.pk-ok{border-color:#1E9E5A;background:rgba(30,158,90,0.08);}
  .pick-row.pk-fehlt{border-color:#DC2626;background:rgba(220,38,38,0.07);}
  .pick-tap{flex:1;min-width:0;min-height:56px;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--ink);padding:8px 4px 8px 12px;text-align:left;cursor:pointer;font-family:'Inter',sans-serif;}
  .pick-box{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:#fff;}
  .pick-box svg{width:20px;height:20px;opacity:0;}
  .pick-row.pk-ok .pick-box{background:#1E9E5A;border-color:#1E9E5A;}
  .pick-row.pk-ok .pick-box svg{opacity:1;}
  .pick-row.pk-fehlt .pick-box{border-color:#DC2626;}
  .pick-name{font-size:15px;font-weight:600;min-width:0;}
  .pick-row.pk-ok .pick-name{text-decoration:line-through;opacity:0.7;}
  .pick-miss{flex-basis:100%;display:block;font-size:13px;margin:0;padding:0 12px 10px 12px;color:#DC2626;font-weight:600;}
  .pick-miss input{width:64px;padding:5px 6px;border:1.5px solid #DC2626;border-radius:8px;font-size:14px;background:var(--card);color:var(--ink);}
  .pick-btn{flex:none;align-self:center;min-width:76px;min-height:48px;margin:4px 6px 4px 0;border:1.5px solid #DC2626;background:var(--card);color:#DC2626;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;}
  .pick-btn.miss.on{background:#DC2626;border-color:#DC2626;color:#fff;}
  .pick-open{font-size:14px;font-weight:700;color:var(--muted);margin:10px 0 2px 0;}
  .pick-ready{margin-top:10px;}
  .pick-progress{font-size:13px;color:var(--muted);margin:8px 0 4px 0;}
  .fehlt-box{margin:10px 0 4px 0;padding:8px 10px;border-radius:10px;background:rgba(220,38,38,0.08);border-left:4px solid #DC2626;font-size:13px;}
  .fehlt-box .order-items{margin:4px 0 0 0;}
  .sync-banner{font-size:13px;line-height:1.45;border-radius:12px;padding:10px 12px;margin:0 0 14px 0;background:var(--surface-2);color:var(--ink);border-left:4px solid var(--amber);}
  .lager-pin{border-color:#0069B3;}
  .nav-btn{display:block;text-align:center;margin-top:12px;background:#FFEE00;color:#0B2A4A;font-weight:700;font-size:14px;border-radius:12px;padding:11px 14px;text-decoration:none;}
  .geo-badge{font-size:13px;line-height:1.45;border-radius:12px;padding:9px 12px;margin:0 0 14px 0;background:var(--surface-2);color:var(--ink);border-left:4px solid var(--line-strong);}
  .geo-badge.geo-on{border-left-color:#1E9E5A;}
  .geo-badge.geo-denied,.geo-badge.geo-unavailable{border-left-color:var(--amber);}
  .geo-retry{margin-top:8px;display:block;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  @media (min-width: 900px){ .bv-map{height:460px;} }
  .fertig-line{font-size:13px;margin-top:8px;}
  .fertig-box{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .fertig-box label{font-size:13px;font-weight:600;color:var(--muted);}
  .fertig-box input{padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);}

  /* Fahrer: Ziel antippen, wenn "Unterwegs" */
  .ziel-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .ziel-chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .ziel-chip i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line-strong);}
  .ziel-chip.active{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff;}
  .sent-note{font-size:13px;color:var(--accent-dark);background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin-top:10px;}

  /* PC / breite Bildschirme (Chef im Büro) -- am Handy bleibt alles
     wie gehabt, ab 900px wird es breiter und mehrspaltig. */
  @media (min-width: 900px){
    main{max-width:1060px;padding:24px 28px 110px 28px;}
    .order-footer{max-width:1060px;}
    .inv-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
    .card-grid{grid-template-columns:1fr 1fr;}
    .proj-list{grid-template-columns:1fr 1fr;}
    .widget-grid{grid-template-columns:repeat(4,1fr);gap:14px;}
    .view-title{font-size:28px;}
  }
  @media (min-width: 1280px){
    main{max-width:1320px;}
    .order-footer{max-width:1320px;}
    .card-grid{grid-template-columns:repeat(3,1fr);}
    .proj-list{grid-template-columns:repeat(3,1fr);}
    .detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:22px;align-items:start;}
    .detail-grid .section-h:first-child{margin-top:0;}
  }

  /* Projekt-Farben: Status-Punkt + Auswahl-Kacheln auf den Bauvorhaben-
     Karten. Immer ein sichtbarer Rand, damit z.B. "schwarz" auch im
     Dunkelmodus nicht mit dem Hintergrund verschmilzt. */
  .proj-color-badge{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px;font-weight:600;color:var(--muted);}
  .proj-color-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-strong);background:transparent;flex-shrink:0;}
  .proj-color-picker{display:flex;gap:8px;margin-top:8px;}
  .proj-color-swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);cursor:pointer;padding:0;}
  .proj-color-swatch.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink);}
  .proj-color-swatch.proj-color-none{background:transparent;position:relative;}
  .proj-color-swatch.proj-color-none::after{content:'';position:absolute;left:3px;right:3px;top:50%;height:2px;background:var(--line-strong);transform:rotate(45deg);}

  /* Personal: Rollen-Chips (mehrere pro Person an-/abwählbar) */
  .role-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .role-chip{border:1.5px solid var(--line-strong);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;}
  .role-chip.active{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff;}

  /* Fahrer-Status: jeder Fahrer setzt seinen eigenen Status, Chef/Lager
     sehen die Liste aller gesetzten Status. */
  .driver-status-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .driver-status-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
  .driver-status-name{font-weight:700;font-size:13.5px;}

  /* Lieferschein-Druck: immer weißer Hintergrund/schwarze Schrift,
     unabhängig vom Dunkelmodus -- feste Farben statt Variablen. */
  .print-btn{background:none;border:1.5px solid var(--line-strong);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;margin-top:8px;}
  #printArea{display:none;}
  #printArea .ls-logo{height:42px;margin-bottom:10px;}
  #printArea h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 16px 0;color:#111;}
  #printArea table{width:100%;border-collapse:collapse;margin-bottom:14px;}
  #printArea .ls-meta td{padding:3px 0;font-size:13px;color:#111;}
  #printArea .ls-meta td:first-child{color:#555;width:140px;}
  #printArea .ls-items th{text-align:left;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:#555;border-bottom:2px solid #111;padding:6px 4px;}
  #printArea .ls-items td{padding:7px 4px;border-bottom:1px solid #ccc;font-size:14px;color:#111;}
  #printArea .ls-items td.ls-menge,#printArea .ls-items th.ls-menge{text-align:right;white-space:nowrap;}
  #printArea .ls-items .ls-total{font-weight:700;border-top:2px solid #111;border-bottom:none;text-align:right;padding-top:9px;}
  .ls-fehlt{margin-top:14px;font-size:13px;}
  /* Feinschliff (Bedienung): Knöpfe geben beim Drücken leicht nach, kein
     Doppeltipp-Zoom, kein grauer System-Blitz. Bewusst KEINE Einblend-
     Animationen auf Karten/Listen: render() zeichnet alle 4 s per innerHTML
     neu, die würden ständig neu abspielen. Fenster: animateOverlayOnOpen(). */
  .submit-btn,.advance-btn,.chip-btn,.mini-btn,.ziel-chip,.pick-btn,.pick-tap,.day-cell,.role-btn,.loc-btn,
  .done-toggle,.reorder-btn,.pick-all-btn,.pu-open-btn,.seg-control button,.qty-ctl button,.qty-chip,.np-key,
  .inv-actions button,.refresh-btn,.role-chip,.geo-retry,.back-link,.print-btn,
  button.widget,.proj-row,.art-row,.reorder-chip{
    transition:transform 140ms var(--ease-out), filter 140ms var(--ease-out);
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .submit-btn:active:not(:disabled),.advance-btn:active:not(:disabled),.chip-btn:active:not(:disabled),
  .mini-btn:active,.ziel-chip:active,.pick-btn:active,.pick-tap:active,.day-cell:active,.role-btn:active,.loc-btn:active,
  .done-toggle:active,.reorder-btn:active,.pick-all-btn:active,.pu-open-btn:active,.seg-control button:active,
  .qty-ctl button:active,.qty-chip:active,.np-key:active,.inv-actions button:active,.refresh-btn:active,.role-chip:active,.geo-retry:active,
  .print-btn:active,.reorder-chip:active{transform:scale(0.97);}
  .art-row:active{transform:scale(0.99);}
  /* Zahlen, die sich bei der Aktualisierung ändern: gleich breite Ziffern, damit nichts wackelt */
  .w-value,.sec-n,.rn-badge,.stat-chip b,.w-dots{font-variant-numeric:tabular-nums;}
  /* Sichtbarer, einheitlicher Fokus-Rahmen für Tastatur (Chef am PC) */
  button:focus-visible,a:focus-visible,[data-action]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  /* Weniger Bewegung, wenn am Gerät eingestellt: kein Skalieren/Gleiten, Blenden bleibt */
  /* Touch-Grundlagen (Task 2): Mindesthöhe --tap für alle Knopf-Arten im Arbeitsbereich */
  .submit-btn,.advance-btn,.chip-btn,.mini-btn,.ziel-chip,.pick-btn,.pick-tap,.day-cell,.role-btn,.loc-btn,
  .done-toggle,.reorder-btn,.pick-all-btn,.pu-open-btn,.seg-control button,.inv-actions button,
  .refresh-btn,.role-chip,.geo-retry,.back-link,.print-btn,button.widget,.proj-row,.maps-btn,
  .menu-dropdown button,.inv-restock{min-height:var(--tap);}
  .mini-btn,.ziel-chip,.chip-btn,.pick-btn,.geo-retry,.role-chip,.refresh-btn,.print-btn,.back-link,.inv-restock,.maps-btn{display:inline-flex;align-items:center;justify-content:center;}
  .geo-retry{display:flex;}
  .maps-btn{display:flex;}
  .inv-actions button{width:var(--tap);}
  .menu-btn{width:44px;height:44px;}
  .katalog-search,.pu-del,.nav-btn{min-height:var(--tap);}
  .pu-del,.nav-btn{display:flex;align-items:center;justify-content:center;}
  /* Zahlen-Leiste (Handy) statt Kacheln – Task 3 */
  .stat-strip{display:none;}
  .gb-short,.st-short{display:none;}
  @media (max-width: 899px){
    .widget-grid{display:none;}
    .stat-strip{display:flex;gap:8px;margin:8px 0 12px 0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;}
    .stat-strip::-webkit-scrollbar{display:none;}
    .stat-chip-btn{--wc:var(--muted);flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;min-height:var(--tap);padding:0 14px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:999px;font-family:'Inter',sans-serif;font-size:var(--fs-small);font-weight:600;cursor:pointer;white-space:nowrap;}
    .stat-chip-btn .sc-dot{width:10px;height:10px;border-radius:50%;background:var(--wc);flex:none;}
    .stat-chip-btn b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
    .my-status{padding:8px 12px;}
    .my-status .ms-label,.my-status .ms-hint{display:none;}
    .my-status .st-full{display:none;} .my-status .st-short{display:inline;}
    .my-status .seg-control{margin-top:0;}
    .my-status{margin-bottom:10px !important;}
    .my-status .nav-btn{margin-top:4px;}
    .my-status .ziel-chips{flex-wrap:nowrap;overflow-x:auto;margin-top:4px;padding-bottom:0;}
    .my-status .ziel-chip{flex:0 0 auto;white-space:nowrap;}
    .my-status .ms-meta{margin-top:2px !important;}
    .my-status .ziel-label{display:none;}
    main .view-title.role-title{display:none;}
    .hide-phone{display:none;}
    .geo-badge.geo-denied{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:6px 6px 6px 12px;}
    .geo-badge.geo-denied .gb-full{display:none;} .geo-badge.geo-denied .gb-short{display:inline;flex:1;min-width:0;}
    .geo-badge.geo-denied .geo-retry{margin-top:0;flex:none;padding:0 14px;}
  }
  button.stat-chip-btn{transition:transform 140ms var(--ease-out), filter 140ms var(--ease-out);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  button.stat-chip-btn:active{transform:scale(0.97);}
  /* Zweitknöpfe in einer Zeile (für Task 4) */
  .btn-row-secondary{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .btn-row-secondary > *{flex:1 1 0;}
  .btn-row-secondary .mini-btn{border-radius:12px;min-height:var(--tap);}
  .order-meta{margin:2px 0 4px 0;}
  .order-head-main{flex:1;min-width:0;}
  .advance-row{display:flex;gap:8px;margin-top:10px;}
  .advance-row .advance-btn{margin-top:0;}
  .advance-row .advance-btn:first-child{flex:1 1 0;}
  .advance-row .advance-alt{flex:0 0 34%;background:var(--card);color:var(--ink);border:1.5px solid var(--line-strong);}
  .tour-tick{flex:0 0 48px;width:48px;height:48px;margin:-6px 4px -6px -8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .tour-tick i{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);background:var(--card);display:block;position:relative;transition:transform 140ms var(--ease-out), background-color 140ms var(--ease-out);}
  .tour-tick.on i{background:var(--accent-solid);border-color:var(--accent-solid);}
  .tour-tick.on i::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg);}
  .tour-tick:active i{transform:scale(0.9);}
  .tour-bar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;z-index:16;background:var(--card);box-shadow:0 -6px 20px rgba(23,36,45,.16);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;}
  .tour-bar .tour-n{font-weight:700;font-size:var(--fs-small);white-space:nowrap;margin-right:2px;}
  .tour-bar .advance-btn{width:auto;flex:1 1 0;margin:0;min-height:48px;padding:8px 6px;font-size:13px;}
  .tour-bar .advance-btn:disabled{opacity:.4;cursor:default;}
  @media (min-width: 900px){ .tour-bar{bottom:0;max-width:1060px;border-radius:16px 16px 0 0;} }
  body.has-tour main{padding-bottom:calc(230px + env(safe-area-inset-bottom));}
  .order-card .wunsch-row{margin:6px 0 0 0;}
  .order-card .order-items{margin:6px 0;}
  @media (prefers-reduced-motion: reduce){
    :root :is(.submit-btn,.advance-btn,.chip-btn,.mini-btn,.ziel-chip,.pick-btn,.pick-tap,.day-cell,.role-btn,.loc-btn,
      .done-toggle,.reorder-btn,.pick-all-btn,.pu-open-btn,.seg-control button,.qty-ctl button,.qty-chip,.np-key,.inv-actions button,
      .refresh-btn,.role-chip,.geo-retry,.print-btn,button.widget,.proj-row,.art-row,.reorder-chip):active{transform:none;}
    .tour-tick:active i{transform:none;}
    :root button.stat-chip-btn:active{transform:none;}
    .toast,.toast.show{transform:translateX(-50%);}
    .jump-flash{animation-name:jumpFlashSoft;}
  }
@media print{
    html,body{background:#fff !important;}
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;background:#fff;color:#111;padding:16px;font-family:'Inter',sans-serif;}
  }
  /* DEMO-Leiste */
  :root{--demo-h:44px;}
  #demoBar{position:sticky;top:0;z-index:60;height:var(--demo-h);box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 8px;background:#111;color:#FFEE00;border-bottom:6px solid transparent;border-image:repeating-linear-gradient(45deg,#FFEE00 0 10px,#111 10px 20px) 6;font:600 12px/1 'Inter',sans-serif;overflow-x:auto;white-space:nowrap;}
  #demoBar .demo-txt{margin-right:4px;}
  #demoBar button{font:600 12px/1 'Inter',sans-serif;padding:6px 8px;border-radius:8px;border:1px solid #FFEE00;background:transparent;color:#FFEE00;cursor:pointer;}
  #demoBar button.on{background:#FFEE00;color:#111;}
  #demoBar button.reset{margin-left:auto;border-color:#888;color:#ccc;}
  header.chrome{top:var(--demo-h);}
</style>
</head>
<body>
<div id="demoBar"><span class="demo-txt">DEMO – Beispieldaten</span>
  <button data-action="demo-role" data-role="baustelle">Baustelle</button><button data-action="demo-role" data-role="lager">Lager</button><button data-action="demo-role" data-role="fahrer">Fahrer</button><button data-action="demo-role" data-role="chef">Chef</button><button data-action="demo-reset" class="reset">Zurücksetzen</button></div>
<div id="app"><div class="loading">Lade Daten…</div></div>
<div id="printArea"></div>

<script>
// ---- Supabase-Verbindung -------------------------------------------------
// Hier deine eigenen Werte aus dem Supabase-Dashboard eintragen

  return Object.assign(JSON.parse(JSON.stringify(DEMO_DATA)), {rev:1});
}
let demoMem = null;
function demoSave(v){ v = Object.assign({}, v); delete v.demoVersion; demoMem = v; try{ localStorage.setItem(DEMO_STORE_KEY, JSON.stringify(v)); localStorage.setItem(DEMO_STORE_KEY+'-version', String(DEMO_VERSION)); }catch(e){} }
// Nachbau der Supabase-Ketten: sammelt Methode + Argumente, antwortet beim `await`.
function createDemoClient(){
  const cur = ()=> demoMem || (demoMem = demoLoad());
  function chain(table){
    const ops = [];
    const has = (m)=>ops.find(o=>o[0]===m);
    const q = {};
    ['select','eq','like','is','filter','update','upsert','maybeSingle','single','order','limit'].forEach(m=>{
      q[m] = (...a)=>{ ops.push([m, ...a]); return q; };
    });
    q.then = (res, rej)=>{
      let out;
      try{
        const up = has('update'), ups = has('upsert');
        if(up){
          const eqs = ops.filter(o=>o[0]==='eq'||o[0]==='is');
          const revOp = eqs.find(o=>o[1]==='value->>rev');
          const rev = cur().rev;
          const ok = !revOp || (revOp[0]==='is' ? rev==null : String(rev)===String(revOp[2]));
          if(ok){ demoSave(up[1].value); out = {data:[{key:'shopfloor-data-v2'}], error:null}; }
          else out = {data:[], error:null};
        } else if(ups){
          const row = ups[1];
          if(row.key==='shopfloor-data-v2') demoSave(row.value);
          out = {data:[{value:row.value}], error:null};
        } else if(has('like')){
          out = {data:[], error:null};
        } else if(has('maybeSingle')||has('single')){
          out = {data:{value:cur()}, error:null};
        } else out = {data:[{value:cur()}], error:null};
      }catch(e){ out = {data:null, error:e}; }
      return Promise.resolve(out).then(res, rej);
    };
    return q;
  }
  const session = {access_token:'demo', user:{id:'demo'}};
  return {
    auth:{
      getSession: async ()=>({data:{session}, error:null}),
      onAuthStateChange: ()=>({data:{subscription:{unsubscribe(){}}}}),
      signInWithPassword: async ()=>({data:{session}, error:null}),
      signOut: async ()=>({error:null}),
      updateUser: async ()=>({data:{}, error:null}),
    },
    from: chain,
    rpc: async ()=>({data:null, error:{message:'demo'}}),
    functions:{ invoke: async ()=>({data:null, error:null}) },
    storage:{ from: ()=>({
      createSignedUrls: async (paths)=>({data:(paths||[]).map(p=>({path:p, signedUrl:'', error:null})), error:null}),
      upload: async ()=>({data:{}, error:null}),
      remove: async ()=>({data:[], error:null}),
    })},
  };
}

// Mitarbeiter + Rollen (wie auf einem Discord-Server): Jeder meldet sich
// mit Name + eigenem Passwort an und landet in der Rolle / den Rollen,
// die der Chef ihm im Reiter "Personal" zugewiesen hat. Die Liste (ohne
// Passwörter) liegt im gemeinsamen Datensatz (state.employees).
const ROLES = ['baustelle','lager','fahrer','chef'];
function findEmployee(name){ return state.employees.find(e=>e.name===name); }
function employeeRoles(name){
  const e = findEmployee(name);
  return e ? ROLES.filter(r=>e.roles.includes(r)) : [];
}

// Angemeldet bleiben: Die Anmeldung wird auf dem Handy gespeichert und
// gilt, bis man sich ausdrücklich abmeldet (kein Ablauf am Tagesende --
// Nutzerwunsch). Rausgeworfen wird man nur noch, wenn der Chef die
// Person oder ihre Rolle entfernt (enforceSession).
const SESSION_KEY = 'geruest-session';
// Speicher-Schlüssel: in der Demo mit Vorsilbe 'demo-', damit echte
// App-Daten im selben Browser nie gelesen oder überschrieben werden.
function skey(k){ return window.DEMO_MODE===true ? 'demo-'+k : k; }
function saveSession(){
  try{ localStorage.setItem(skey(SESSION_KEY), JSON.stringify({name:state.name, role:state.role})); }catch(e){}
}
function restoreSession(){
  try{
    const s = JSON.parse(localStorage.getItem(skey(SESSION_KEY)));
    if(s && s.name && s.role){
      state.name = s.name; state.authName = s.name; state.role = s.role; state.loggedIn = true;
    }
  }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(skey(SESSION_KEY)); }catch(e){}
}
// Nach jedem Laden prüfen, ob die gespeicherte Anmeldung noch gültig ist
// (Chef könnte den Mitarbeiter entfernt oder ihm die Rolle entzogen haben).
// Liegt noch eine Supabase-Sitzung auf dem Gerät? (für den Start ohne Netz)
function hasStoredAuth(){
  try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(/^sb-.*-auth-token$/.test(k) && localStorage.getItem(k)) return true; } }catch(e){}
  return false;
}
function enforceSession(){
  if(!state.loggedIn) return;
  if(!state.authed){ state.loggedIn=false; state.role=null; state.authName=null; state.askChefPw=false; clearSession(); return; }
  if(!employeeRoles(state.name).includes(state.role)){
    state.loggedIn=false; state.role=null; state.authName=null; state.askChefPw=false;
    clearSession();
    dropAuthLocal();   // auch beim Server abmelden (neu anmelden nötig)
  }
}

// Für den Lieferschein: Stückzahl in ganze Pakete + Rest umrechnen
// (z.B. 32 Stk bei 10 Stk/Paket -> "3 Pakete und 2 Stk"), statt einer
// unpraktischen Kommazahl wie "3,2 Pakete". Teile ohne pkg-Feld liefern
// null (werden ganz normal nur in Stück angezeigt).
function formatPackages(qty, it){
  if(!it || !it.pkg || qty<=0) return null;
  const pkgCount = Math.floor(qty/it.pkg);
  const rest = qty % it.pkg;
  if(pkgCount===0) return null;
  const pkgWord = pkgCount===1 ? t('pkgOne') : t('pkgMany');
  return rest>0
    ? `${pkgCount} ${pkgWord} ${t('pkgAnd')} ${rest} ${unitLabel(it.unit)}`
    : `${pkgCount} ${pkgWord}`;
}

function weightOf(items){

  items.forEach(i=>{ const w = itemKg(i); if(w==null) missing++; else kg += w*i.qty; });

}

  const loc = LOCALES[state.lang]||'de-DE';

    ? (kg/1000).toLocaleString(loc, {minimumFractionDigits:2, maximumFractionDigits:2})+' t'
    : Math.round(kg).toLocaleString(loc)+' kg';
}

// ======================================================================
// Speicher: Abgleich mit Supabase (app_state / STORAGE_KEY)
// ----------------------------------------------------------------------
// Statt den ganzen Datensatz blind zu überschreiben, merkt sich die App
// den zuletzt vom Server gelesenen Stand (syncBase). Beim Speichern holt
// sie den AKTUELLEN Server-Stand und trägt nur die EIGENEN Änderungen
// (Unterschied syncBase -> eigener Stand) darauf ein (merge3). Dadurch:
//  - gehen gleichzeitige Änderungen anderer nicht verloren (Bestellung
//    hier, Status dort; Lagerbestand wird als +/- verrechnet),
//  - kann ein fehlgeschlagenes Laden nichts mehr überschreiben (ohne
//    bekannten Server-Stand wird gar nicht gespeichert),
//  - funktioniert die App bei schlechtem Netz weiter: Änderungen bleiben
//    auf dem Handy gemerkt (auch nach Schließen, localStorage PENDING_KEY)
//    und werden automatisch gesendet, sobald wieder Netz da ist. Der
//    letzte Server-Stand liegt zusätzlich in CACHE_KEY, damit die App auch
//    ohne Netz startet.
// Schreiben nur, wenn sich der Server seit dem Lesen nicht geändert hat
// (Versionszähler value.rev), sonst neu lesen + neu zusammenführen.
// ======================================================================
const CACHE_KEY = 'geruest-cache', PENDING_KEY = 'geruest-pending';
const RECORD_ARRAYS = {orders:'counter', projects:'projektCounter', calendarEntries:'calCounter',
  plannedDeliveries:'planCounter', lkwEntries:'lkwCounter', employees:'empCounter', pickups:'pickupCounter'};
let syncBase = null;          // letzter bekannter Server-Stand (ohne rev)
let syncChain = Promise.resolve();
state.syncOffline = false; state.syncPending = false;

function clone(x){ return x===undefined ? undefined : JSON.parse(JSON.stringify(x)); }
// Vergleich unabhängig von der Reihenfolge der Felder
function stableStr(x){
  if(Array.isArray(x)) return '['+x.map(stableStr).join(',')+']';
  if(x && typeof x==='object') return '{'+Object.keys(x).filter(k=>x[k]!=null).sort().map(k=>JSON.stringify(k)+':'+stableStr(x[k])).join(',')+'}';
  return JSON.stringify(x===undefined ? null : x);
}
function same(a, b){ return stableStr(a)===stableStr(b); }

function stateToValue(){
  return clone({orders:state.orders, counter:state.orderCounter, inventory:state.inventory,
    projects:state.projects, projektCounter:state.projektCounter,

    driverStatus:state.driverStatus, driverPos:state.driverPos, lager:state.lager, chefPw:state.chefPw,
    pickups:state.pickups, pickupCounter:state.pickupCounter,
    plannedDeliveries:state.plannedDeliveries, planCounter:state.planCounter,
    lkwEntries:state.lkwEntries, lkwCounter:state.lkwCounter,
    employees:state.employees, empCounter:state.empCounter,
    pushSubs:state.pushSubs});
}
function applyValue(v){
  v = v || {};
  state.orders = v.orders || [];
  state.orderCounter = v.counter || 1001;
  state.inventory = v.inventory || {...DEFAULT_INVENTORY};
  state.projects = v.projects || [];
  state.projektCounter = v.projektCounter || 101;
  state.calendarEntries = v.calendarEntries || [];
  state.calCounter = v.calCounter || 1;
  state.driverStatus = v.driverStatus || {};
  state.driverPos = v.driverPos || {};
  state.lager = v.lager || null;
  state.pickups = v.pickups || [];
  state.pickupCounter = v.pickupCounter || 1;
  state.chefPw = v.chefPw || null;
  state.plannedDeliveries = v.plannedDeliveries || [];
  state.planCounter = v.planCounter || 1;
  state.lkwEntries = v.lkwEntries || [];
  state.lkwCounter = v.lkwCounter || 1;
  state.pushSubs = v.pushSubs || [];
  state.employees = Array.isArray(v.employees) ? v.employees : [];
  state.empCounter = v.empCounter || (state.employees.length ? Math.max(...state.employees.map(e=>e.id))+1 : 1);
}

// Feldweise: was lokal (gegenüber base) geändert wurde, gewinnt; sonst Server.
// isOrder: Bestellungen – Status läuft nie rückwärts, Packliste je Zeile.
function mergeRecord(b, l, r, isOrder){
  const out = {...r};
  new Set([...Object.keys(b||{}), ...Object.keys(l||{})]).forEach(f=>{
    if(f==='steps'){ // Status-Zeiten: je Status zusammenführen (zwei Geräte ergänzen verschiedene Zeiten)
      const bs = (b||{}).steps||{}, ls = (l||{}).steps||{}, rs = (r||{}).steps||{};
      if(same(ls, bs)) return;
      const m = {...rs};
      Object.keys(ls).forEach(k=>{ if(!same(ls[k], bs[k]) && !(m[k] && !same(m[k], bs[k]) && String(m[k])>String(ls[k]))) m[k] = ls[k]; });
      out.steps = m; return;
    }
    if(isOrder && f==='pick'){ // Packliste: je Zeile zusammenführen (zwei Geräte haken verschiedene Zeilen ab)
      const bp = (b||{}).pick||{}, lp = (l||{}).pick||{}, rp = (r||{}).pick||{};
      if(same(lp, bp)) return;
      const m = {...rp};
      new Set([...Object.keys(bp), ...Object.keys(lp)]).forEach(k=>{
        if(same(lp[k], bp[k])) return;
        if(lp[k]===undefined) delete m[k]; else m[k] = clone(lp[k]);
      });
      out.pick = m; return;
    }
    if(!same((l||{})[f], (b||{})[f])){ if(l[f]===undefined) delete out[f]; else out[f] = clone(l[f]); }
  });
  if(isOrder){
    // Status nie rückwärts: der weiter fortgeschrittene Stand (lokal/Server) gilt
    const ri = STATUS_FLOW.indexOf((r||{}).status), oi = STATUS_FLOW.indexOf(out.status);
    if(ri > oi){ out.status = r.status; if(r.items) out.items = clone(r.items); }
    // Packliste nur bis „In Bearbeitung“ – danach ist sie ausgewertet
    if(STATUS_FLOW.indexOf(out.status) > STATUS_FLOW.indexOf('In Bearbeitung')) delete out.pick;
  }
  return out;
}
// Listen mit Schlüssel (id bzw. endpoint): Hinzufügen/Löschen/Ändern je Eintrag.
function mergeList(b, l, r, key, counterInfo, isOrder){
  b = b||[]; l = l||[]; r = r||[];
  let changes = 0;
  const bm = new Map(b.map(x=>[x[key], x])), lm = new Map(l.map(x=>[x[key], x]));
  let out = r.map(x=>clone(x));
  // gelöscht
  b.forEach(x=>{ if(!lm.has(x[key])){ changes++; out = out.filter(y=>y[key]!==x[key]); } });
  // geändert
  l.forEach(x=>{
    const bx = bm.get(x[key]);
    if(bx && !same(bx, x)){
      changes++;
      const i = out.findIndex(y=>y[key]===x[key]);
      if(i>=0) out[i] = mergeRecord(bx, x, out[i], isOrder);
      else out.push(clone(x));   // auf dem Server inzwischen gelöscht -> lokale Änderung behalten
    }
  });
  // neu
  l.forEach(x=>{
    if(bm.has(x[key])) return;
    changes++;
    const rx = out.find(y=>y[key]===x[key]);
    if(!rx){ out.push(clone(x)); return; }
    if(same(rx, x)) return;
    // gleiche Nummer von zwei Geräten gleichzeitig vergeben -> neue Nummer
    const nx = clone(x);
    if(counterInfo && typeof x[key]==='number'){
      nx[key] = Math.max(...out.map(y=>typeof y[key]==='number'? y[key] : 0), ...l.map(y=>typeof y[key]==='number'? y[key] : 0)) + 1;
    }
    out.push(nx);
  });
  return {out, changes};
}
// Schlüssel-Objekte (driverStatus, driverPos): je Eintrag
function mergeMap(b, l, r, numericDelta){
  b = b||{}; l = l||{}; r = r||{};
  const out = clone(r);
  let changes = 0;
  new Set([...Object.keys(b), ...Object.keys(l)]).forEach(k=>{
    if(same(b[k], l[k])) return;
    changes++;
    if(numericDelta){
      out[k] = (Number(r[k])||0) + (Number(l[k])||0) - (Number(b[k])||0);   // Lagerbestand: +/- verrechnen
    } else if(l[k]===undefined) delete out[k];
    else if(b[k] && r[k] && typeof l[k]==='object') out[k] = mergeRecord(b[k], l[k], r[k]);
    else out[k] = clone(l[k]);
  });
  return {out, changes};
}
function merge3(base, local, remote){
  base = base||{}; local = local||{}; remote = remote||{};
  const out = clone(remote);
  delete out.rev;
  let changes = 0;
  const handled = new Set(['rev']);
  Object.entries(RECORD_ARRAYS).forEach(([k, ck])=>{
    handled.add(k); handled.add(ck);
    const m = mergeList(base[k], local[k], remote[k], 'id', true, k==='orders');
    out[k] = m.out; changes += m.changes;
    const maxId = Math.max(0, ...m.out.map(x=>typeof x.id==='number'? x.id : 0));
    // Zähler laufen nur mit den Einträgen mit (neuer Eintrag = Änderung),
    // ein fehlender/abweichender Zähler allein ist KEINE eigene Änderung
    // (sonst "Kein Netz"-Hinweis, wenn ein neues Feld im Datensatz fehlt).
    const lc = Number(local[ck])||0, rc = Number(remote[ck])||0;
    out[ck] = Math.max(lc, rc, maxId+1);
  });
  [['inventory', true], ['driverStatus', false], ['driverPos', false]].forEach(([k, num])=>{
    handled.add(k);
    const m = mergeMap(base[k], local[k], remote[k], num);
    out[k] = m.out; changes += m.changes;
  });
  handled.add('pushSubs');
  const ps = mergeList(base.pushSubs, local.pushSubs, remote.pushSubs, 'endpoint', false);
  out.pushSubs = ps.out; changes += ps.changes;
  new Set([...Object.keys(base), ...Object.keys(local)]).forEach(k=>{
    if(handled.has(k) || same(base[k], local[k])) return;
    changes++;
    if(local[k]===undefined) delete out[k]; else out[k] = clone(local[k]);
  });
  return {value:out, changes};
}
// Gibt es eigene, noch nicht gespeicherte Änderungen? Gleiche Logik wie
// beim Zusammenführen (leere Liste = fehlende Liste usw.).
function hasLocalChanges(){
  return !!syncBase && merge3(syncBase, stateToValue(), syncBase).changes > 0;
}
function savePending(){
  if(state.syncPending && syncBase) lsSet(PENDING_KEY, JSON.stringify({base:syncBase, local:stateToValue(), ts:Date.now()}));
  else lsSet(PENDING_KEY, null);
}
async function fetchRemote(){
  const { data, error } = await supabaseClient.from('app_state').select('value').eq('key', STORAGE_KEY).maybeSingle();
  if(error) throw error;
  return data && data.value ? data.value : null;
}
// Schreibt nur, wenn der Server noch auf Version rev steht. true = geschrieben.
async function writeIfUnchanged(value, rev){
  const q = supabaseClient.from('app_state').update({value});
  const filtered = q.eq('key', STORAGE_KEY);
  const { data, error } = await (rev==null ? filtered.is('value->>rev', null) : filtered.eq('value->>rev', String(rev))).select('key');
  if(error) throw error;
  return Array.isArray(data) && data.length>0;
}

// Ein Abgleich: Server lesen, eigene Änderungen einarbeiten, ggf. schreiben.
async function doSync(){
  if(!supabaseClient) throw new Error('Supabase-Bibliothek nicht geladen');
  for(let attempt=0; attempt<5; attempt++){
    const captured = stateToValue();
    let remote;
    try{ remote = await fetchRemote(); }
    catch(e){ state.syncOffline = true; savePending(); throw e; }
    state.syncOffline = false;
    if(!remote){
      // Nichts lesbar: ohne Anmeldung (Zugriffsschutz) oder ganz neue
      // Datenbank. Nur im zweiten Fall und nur angemeldet anlegen.
      if(!state.authed) throw new Error('nicht angemeldet');
      const v = {...stateToValue(), rev:1};
      const { error } = await supabaseClient.from('app_state').upsert({key:STORAGE_KEY, value:v});
      if(error) throw error;
      syncBase = clone(v); delete syncBase.rev;
      state.syncPending = false; savePending();
      lsSet(CACHE_KEY, JSON.stringify(syncBase));
      return;
    }
    const rev = remote.rev==null ? null : remote.rev;
    let merged, changes = 0;
    if(syncBase){ const m = merge3(syncBase, captured, remote); merged = m.value; changes = m.changes; }
    else { merged = clone(remote); delete merged.rev; }
    if(changes>0){
      let ok;
      try{ ok = await writeIfUnchanged({...merged, rev:(Number(rev)||0)+1}, rev); }
      catch(e){
        if(/fetch|network|Failed/i.test(String(e && (e.message||e)))){ state.syncOffline = true; state.syncPending = true; savePending(); throw e; }
        // Bedingtes Schreiben nicht möglich (z. B. Tabellen-Regeln) -> normal speichern
        console.warn('Bedingtes Speichern nicht möglich, speichere direkt', e);
        const { error } = await supabaseClient.from('app_state').upsert({key:STORAGE_KEY, value:{...merged, rev:(Number(rev)||0)+1}});
        if(error){ state.syncPending = true; savePending(); throw error; }
        ok = true;
      }
      if(!ok) continue;   // jemand anderes hat gerade gespeichert -> neu lesen + zusammenführen
    }
    // Was seit "captured" lokal noch dazukam (während wir gewartet haben), behalten
    const now = stateToValue();
    const result = same(now, captured) ? merged : merge3(captured, now, merged).value;
    syncBase = merged;
    applyValue(clone(result));   // eigene Kopie, sonst ändert die App syncBase mit
    state.syncPending = hasLocalChanges();
    savePending();
    lsSet(CACHE_KEY, JSON.stringify(syncBase));
    enforceSession();
    return;
  }
  state.syncPending = true; savePending();
  throw new Error('Speichern: zu viele gleichzeitige Änderungen, versuche es gleich nochmal');
}
function sync(){
  const run = syncChain.then(doSync, doSync);
  syncChain = run.catch(()=>{});
  return run;
}
// Beim Start: letzter bekannter Stand + gemerkte Änderungen (falls offline)
function restoreOfflineState(){
  let cache = null, pend = null;
  try{ cache = JSON.parse(lsGet(CACHE_KEY)||'null'); }catch(e){}
  try{ pend = JSON.parse(lsGet(PENDING_KEY)||'null'); }catch(e){}
  if(pend && pend.base && pend.local && Date.now()-(pend.ts||0) < 3*24*3600*1000){
    syncBase = pend.base; applyValue(clone(pend.local)); state.syncPending = true; return true;
  }
  if(cache){ syncBase = cache; applyValue(clone(cache)); return true; }
  return false;
}
