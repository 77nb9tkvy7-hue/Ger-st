    if(p){ p.farbe = el.dataset.color || null; await saveShared(); }
    render();
  }
  if(action==='fahrer-tab'){ state.fahrerTab = el.dataset.tab; render(); }
  if(action==='fk-day'){ state.fahrerCalDay = el.dataset.day; render(); }
  if(action==='set-driver-status'){
    const prev = state.driverStatus[state.name];
    const status = el.dataset.status;
    const keep = status==='unterwegs' && prev && prev.status==='unterwegs';
    state.driverStatus[state.name] = {
      status,
      ziel: keep? prev.ziel : null,
      by: keep? prev.by : null,
      time: nowStr(), ts: Date.now(),
    };
    await saveShared();
    render();
  }
  if(action==='add-planned-delivery'){
    const projSel = document.getElementById('planProjektSelect');
    const dateInput = document.getElementById('planDateInput');
    const projektId = el.dataset.projekt ? parseInt(el.dataset.projekt,10)
      : (projSel && projSel.value ? parseInt(projSel.value,10) : null);
    const date = dateInput ? dateInput.value : '';
    if(!projektId || !date){
      state.planWarn = t('plWarnFields');
      render();
      return;
    }
    const items = Object.entries(state.cart).filter(([id,q])=>q>0).map(([id,q])=>{
      const it = CATALOG.find(c=>c.id===id);
      return {id:it.id, name:it.name, unit:it.unit, qty:q, kg:it.kg};
    });
    if(items.length===0) return;
    state.plannedDeliveries.push({id: state.planCounter++, projekt: projektId, date, items, person: state.name});
    notify({roles:['lager','fahrer']}, 'nPlannedT', 'nPlannedB', {date:isoToDE(date), bv:projektLabel(projektId)});
    state.cart = {};
    state.planDraft = {projekt:'', date:''};
    state.planWarn = '';
    await saveShared();
    render();
  }
  if(action==='delete-planned'){
    const id = parseInt(el.dataset.id,10);
    state.plannedDeliveries = state.plannedDeliveries.filter(pd=>pd.id!==id);
    await saveShared();
    render();
  }
  if(action==='pick-addr'){
    state.baustelleOrt = el.dataset.text;
    state.baustelleCoords = {lat: parseFloat(el.dataset.lat), lon: parseFloat(el.dataset.lon)};
    render();
  }
  if(action==='inv'){
    const id = el.dataset.id, delta = parseInt(el.dataset.delta,10);
    state.inventory[id] = (state.inventory[id] ?? 0) + delta;
    await saveShared();
    render();
  }
  if(action==='refresh'){ state.menuOpen = false; await loadShared(); render(); }
  if(action==='toggle-done'){ state.showDone[el.dataset.key] = !state.showDone[el.dataset.key]; render(); }
  if(action==='geo-retry'){ geoDenied=false; state.geoStatus=''; syncGeo(); }
  if(action==='pos-focus'){
    const m = posMarkers[el.dataset.name];
    if(m && bvMap){ bvMap.setView(m.getLatLng(), Math.max(bvMap.getZoom(), 14)); m.openPopup(); }
  }

  if(action==='menu-toggle'){ state.menuOpen = !state.menuOpen; state.langMenuOpen=false; render(); }
  if(action==='lang-toggle'){ state.langMenuOpen = !state.langMenuOpen; state.menuOpen=false; render(); }
  if(action==='set-lang'){
    state.lang = el.dataset.lang; saveLang(state.lang); state.langMenuOpen=false; render();
    syncPushSub();
  }
  if(action==='push-enable'){ state.menuOpen=false; await enablePush(); }
  if(action==='push-later'){ lsSet(PUSH_LATER_KEY, '1'); state.pushMsg=''; render(); }
  if(action==='go-calendar'){
    state.view='calendar'; state.menuOpen=false; state.calWarn='';
    await loadShared();
    render();
  }
  if(action==='go-lkwkalender'){
    state.view='lkwkalender'; state.menuOpen=false; state.lkwWarn='';
    await loadShared();
    render();
  }
  if(action==='go-app'){ state.view='app'; state.menuOpen=false; render(); }

  if(action==='cal-unlock-ask'){ state.calAskPw=true; render(); }
  if(action==='cal-unlock-cancel'){ state.calAskPw=false; render(); }
  if(action==='cal-unlock-ok'){
    const pw = document.getElementById('calPwInput');
    if(pw && await verifyChefPw(pw.value)){
      state.calUnlocked=true; state.calAskPw=false;
    } else {
      const w = document.getElementById('calPwWarn');
      if(w) w.innerHTML = `<div class="warn">${t('warnWrongPw')}</div>`;
    }
    render();
  }
  if(action==='cal-lock'){ state.calUnlocked=false; state.calEditId=null; state.calDraft=null; render(); }
  if(action==='cal-cancel-edit'){ state.calEditId=null; state.calDraft=null; state.calWarn=''; render(); }
  if(action==='cal-edit'){
    const entry = state.calendarEntries.find(x=>String(x.id)===el.dataset.id);
    if(entry){ state.calEditId=entry.id; state.calDraft={...entry}; state.calWarn=''; render(); }
  }
  if(action==='cal-delete'){
    state.calendarEntries = state.calendarEntries.filter(x=>String(x.id)!==el.dataset.id);
    await saveShared();
    render();
  }
  if(action==='cal-save'){
    const date = document.getElementById('calDate').value;
    const person = document.getElementById('calPerson').value;
    const ort = document.getElementById('calOrt').value.trim();
    const notiz = document.getElementById('calNotiz').value.trim();
    if(!date || !person || !ort){ state.calWarn=t('calWarnFields'); render(); return; }
    if(state.calEditId){
      const entry = state.calendarEntries.find(x=>x.id===state.calEditId);
      if(entry){ entry.date=date; entry.person=person; entry.ort=ort; entry.notiz=notiz; }
      state.calEditId=null;
    } else {
      state.calendarEntries.push({id: state.calCounter++, date, person, ort, notiz});
    }
    state.calDraft=null; state.calWarn='';
    await saveShared();
    render();
  }

  if(action==='lkw-cancel-edit'){ state.lkwEditId=null; state.lkwDraft=null; state.lkwWarn=''; render(); }
  if(action==='lkw-edit'){
    const entry = state.lkwEntries.find(x=>String(x.id)===el.dataset.id);
    if(entry){ state.lkwEditId=entry.id; state.lkwDraft={...entry}; state.lkwWarn=''; render(); }
  }
  if(action==='lkw-delete'){
    state.lkwEntries = state.lkwEntries.filter(x=>String(x.id)!==el.dataset.id);
    await saveShared();
    render();
  }
  if(action==='lkw-save'){
    const date = document.getElementById('lkwDate').value;
    const time = document.getElementById('lkwTime').value;
    const projektSel = document.getElementById('lkwProjekt');
    const projekt = projektSel && projektSel.value ? parseInt(projektSel.value,10) : null;
    const notiz = document.getElementById('lkwNotiz').value.trim();
    if(!date || !time || !projekt){ state.lkwWarn=t('lkwWarnFields'); render(); return; }
    if(state.lkwEditId){
      const entry = state.lkwEntries.find(x=>x.id===state.lkwEditId);
      if(entry){ entry.date=date; entry.time=time; entry.projekt=projekt; entry.notiz=notiz; }
      state.lkwEditId=null;
    } else {
      state.lkwEntries.push({id: state.lkwCounter++, date, time, projekt, notiz});
      notify({roles:['fahrer']}, 'nLkwT', 'nLkwB', {date:isoToDE(date), time, bv:projektLabel(projekt)});
    }
    state.lkwDraft=null; state.lkwWarn='';
    await saveShared();
    render();
  }
});

// Adress-Vorschläge aus der Umgebung (freie OpenStreetMap-Suche).
// Wird gebremst abgefragt (max. ~1 Anfrage pro Sekunde erlaubt).
let addrTimer = null;
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fetchAddrSuggestions(q){
  clearTimeout(addrTimer);
  const box = document.getElementById('addrSuggestions');
  if(q.trim().length < 3){ if(box) box.innerHTML=''; return; }
  addrTimer = setTimeout(async ()=>{
    try{
      let url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=de&q=${encodeURIComponent(q)}`;
      if(state.lastGPS){
        const g = state.lastGPS;
        url += `&viewbox=${g.lon-0.15},${g.lat+0.15},${g.lon+0.15},${g.lat-0.15}`;
      } else {
        url += `&viewbox=${MUC_VIEWBOX}`;  // ohne GPS: Raum München bevorzugen
      }
      const r = await fetch(url);
      const list = await r.json();
      const b = document.getElementById('addrSuggestions');
      if(!b) return;
      if(!Array.isArray(list) || !list.length){ b.innerHTML=''; return; }
      b.innerHTML = `<div class="addr-sug">${list.map(x=>{
        const t = escapeHtml(x.display_name.split(',').slice(0,3).join(','));
        return `<div data-action="pick-addr" data-lat="${x.lat}" data-lon="${x.lon}" data-text="${t}">📍 ${t}</div>`;
      }).join('')}</div>`;
    }catch(e){ /* Vorschläge sind nur Komfort – Fehler still ignorieren */ }
  }, 700);
}

// Fertig-Datum eines Bauvorhabens (Chef) -- 'change' feuert, sobald im
// Datumsfeld ein Tag gewählt oder das Feld geleert wurde.
document.getElementById('app').addEventListener('change', async (e)=>{
  if(e.target.id && e.target.id.startsWith('fertigDate-')){
    const p = state.projects.find(x=>String(x.id)===e.target.dataset.projekt);
    if(!p) return;
    p.fertigAm = e.target.value || null;
    await saveShared();
    e.target.blur();
    render();
  }
  if(e.target.id && e.target.id.startsWith('pickMiss-')){
    const order = state.orders.find(o=>String(o.id)===e.target.dataset.order);
    const i = e.target.dataset.idx;
    if(!order || !order.pick || !order.pick[i]) return;
    const q = order.items[i].qty;
    order.pick[i].n = Math.min(q, Math.max(1, parseInt(e.target.value,10) || q));
    e.target.blur();
    render();
    await saveShared();
  }
  if(e.target.id && e.target.id.startsWith('planFile-') && e.target.files && e.target.files.length){
    const files = [...e.target.files];
    e.target.value = '';
    await uploadPlans(parseInt(e.target.dataset.projekt,10), files);
  }
  if(state.puDraft){
    if(e.target.id==='puProjekt'){ state.puDraft.projekt = e.target.value; render(); return; }
    if(e.target.id==='puAbbau'){ state.puDraft.abbau = e.target.checked; render(); return; }
    if(e.target.id==='puDate'){ state.puDraft.bis = e.target.value || ''; return; }
    if(e.target.dataset && e.target.dataset.pq){ setPuQtyFromInput(e.target, true); return; }
  }
  if(e.target.id==='wunschDate' && state.orderReview){
    state.orderReview.bis = e.target.value || null;
  }
});
// Mengenfeld antippen: Inhalt markieren, damit man direkt die Zahl tippt;
// Enter = fertig (Tastatur zu).
document.getElementById('app').addEventListener('focusin', (e)=>{
  if(e.target.dataset && e.target.dataset.pq) setTimeout(()=>{ try{ e.target.select(); }catch(_){} }, 0);
});
// Nach dem Antippen setzt der Browser die Schreibmarke -- danach nochmal
// alles markieren, damit die neue Zahl die alte ersetzt statt anzuhängen.
document.getElementById('app').addEventListener('click', (e)=>{
  if(e.target.dataset && e.target.dataset.pq && e.target.tagName==='INPUT'){ try{ e.target.select(); }catch(_){} }
}, true);
document.getElementById('app').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.pq){ e.preventDefault(); e.target.blur(); }
});
// Menge geändert (+/−, Schnellwahl) OHNE die ganze Seite neu zu zeichnen
// (schnelles Mehrfach-Tippen soll nichts verschlucken): alle Stellen, die
// dieses Teil zeigen, werden nachgezogen -- Zahl, Chips, Zeile, Teile-Art
// ("X im Auftrag", auch Doppelungen wie "Häufig bestellt") und Fußleiste.
function syncQtyDom(id){
  const n = state.cart[id]||0;
  const root = document.getElementById('app');
  root.querySelectorAll('[data-numfor]').forEach(x=>{
    if(x.dataset.numfor!==id) return;
    x.textContent = n; x.classList.toggle('zero', !n);
    const row = x.closest('.var-row'); if(row) row.classList.toggle('on', n>0);
  });
  root.querySelectorAll('.qty-chip').forEach(c=>{
    if(c.dataset.id!==id) return;
    const on = parseInt(c.dataset.q,10)===n;
    c.classList.toggle('on', on); c.setAttribute('aria-pressed', on);
  });
  root.querySelectorAll('.art').forEach(art=>{
    const ids = [...new Set([...art.querySelectorAll('[data-numfor]')].map(x=>x.dataset.numfor))];
    if(!ids.includes(id)) return;
    const sum = ids.reduce((a,i)=>a+(state.cart[i]||0), 0);
    const meta = art.querySelector('.art-meta');
    if(meta){ if(sum){ meta.innerHTML = ''; const b = document.createElement('b'); b.textContent = t('artInCart',{n:sum}); meta.appendChild(b); } else meta.textContent = meta.dataset.idle || ''; }
    art.classList.toggle('has-cart', sum>0);
  });
  const count = cartCount();
  document.querySelectorAll('.order-footer').forEach(f=>{
    const sp = f.querySelector('span'), btn = f.querySelector('button');
    if(sp) sp.textContent = count ? t('footerCount',{n:count}) + (weightText(cartItems())? ' · '+weightText(cartItems()) : '') : t('footerEmpty');
    if(btn) btn.disabled = !count;
  });
}
function setPuQtyFromInput(inp, final){
  if(!state.puDraft) return;
  if(/\D/.test(inp.value)) inp.value = inp.value.replace(/\D/g,'');
  const n = Math.max(0, Math.min(9999, parseInt(inp.value,10) || 0));
  if(n) state.puDraft.items[inp.dataset.pq] = n; else delete state.puDraft.items[inp.dataset.pq];
  if(final) inp.value = n || '';
  const sum = document.getElementById('puSum'); if(sum) sum.textContent = puSumText(state.puDraft);
}
document.getElementById('app').addEventListener('input', (e)=>{
  if(e.target.dataset && e.target.dataset.pq){ setPuQtyFromInput(e.target, false); return; }
  if(state.puDraft && e.target.id==='puOrt'){ state.puDraft.ort = e.target.value; return; }
  if(state.puDraft && e.target.id==='puNotiz'){ state.puDraft.notiz = e.target.value; return; }
  if(state.puDraft && e.target.id==='puSearch'){
    state.puDraft.search = e.target.value; render();
    const s = document.getElementById('puSearch'); if(s){ s.focus(); s.selectionStart = s.selectionEnd = s.value.length; }
    return;
  }
  if(e.target.id==='baustelleOrtInput'){
    state.baustelleOrt = e.target.value;
    state.baustelleCoords = null;
    fetchAddrSuggestions(e.target.value);
  }
  if(e.target.id==='projektSelect'){
    state.selProjekt = e.target.value;
    lsSet('geruest-bv', e.target.value);
    render();
  }
  if(e.target.id==='persName'){ state.persDraftName = e.target.value; }
  if(e.target.id==='persPw'){ state.persDraftPw = e.target.value; }
  if(e.target.id==='planProjektSelect'){ state.planDraft.projekt = e.target.value; }
  if(e.target.id==='planDateInput'){ state.planDraft.date = e.target.value; }
  if(e.target.id==='catalogSearch'){
    state.catalogSearch = e.target.value;
    render();
    const s = document.getElementById('catalogSearch');
    if(s){ s.focus(); s.selectionStart = s.selectionEnd = s.value.length; }
  }
});

// Name antippen und halten öffnet das Detail-Popup (Foto/Menge) --
// nützlich sobald echte Teile-Fotos zur Sicherheit dabei sind.
let lpTimer=null, lpStartX=0, lpStartY=0, lpId=null;
function clearLongPress(){
  if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } lpId=null;
  document.querySelectorAll('[data-longpress].holding').forEach(c=>c.classList.remove('holding'));
}
document.getElementById('app').addEventListener('pointerdown', (e)=>{
  const cell = e.target.closest('[data-longpress]');
  if(!cell) return;
  lpId = cell.dataset.longpress;
  lpStartX = e.clientX; lpStartY = e.clientY;
  cell.classList.add('holding');   // Füllung zeigt, wie lange noch halten
  lpTimer = setTimeout(()=>{
    lpTimer = null;
    state.itemPopup = lpId;
    render();
  }, 480);
});
document.getElementById('app').addEventListener('pointermove', (e)=>{
  if(!lpTimer) return;
  if(Math.abs(e.clientX-lpStartX)>10 || Math.abs(e.clientY-lpStartY)>10) clearLongPress();
});
document.getElementById('app').addEventListener('pointerup', clearLongPress);
document.getElementById('app').addEventListener('pointercancel', clearLongPress);
document.getElementById('app').addEventListener('contextmenu', (e)=>{
  if(e.target.closest('[data-longpress]')) e.preventDefault();
});

// Ziffernblock auch mit der Tastatur (PC): Ziffern, Rücktaste, Enter, Esc
document.addEventListener('keydown', (e)=>{
  if(!state.numpad || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && !e.target.closest('.numpad')) return;
  if(/^[0-9]$/.test(e.key)) numpadKey(e.key);
  else if(e.key==='Backspace') numpadKey('del');
  else if(e.key==='Enter') numpadOk();
  else if(e.key==='Escape'){ state.numpad = null; render(); }
  else return;
  e.preventDefault();
});

// ---- DEMO: Rollen-Umschalter ---------------------------------------------
const DEMO_PERSON = {baustelle:'Max', lager:'Jochen', fahrer:'Ludwig', chef:'Chefin'};
function demoSwitchRole(role){
  state.name = DEMO_PERSON[role]; state.authName = state.name; state.role = role;
  state.loggedIn = true; state.authed = true; state.view = 'app'; state.menuOpen = false;
  state.askChefPw = false; state.itemPopup = null; state.numpad = null; state.orderReview = null; state.confirmOrder = null; state.puDraft = null;
  saveSession(); render();
}
function demoBarUpdate(){
  document.querySelectorAll('#demoBar [data-role]').forEach(b=>b.classList.toggle('on', b.dataset.role===state.role));
}
(function(){
  const _render = render;
  render = function(){ _render(); demoBarUpdate(); };
  document.getElementById('demoBar').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-action]'); if(!b) return;
    if(b.dataset.action==='demo-role') demoSwitchRole(b.dataset.role);
    if(b.dataset.action==='demo-reset'){
      // nur Demo-Schlüssel löschen (alle mit 'demo-'), echte App-Daten bleiben
      try{ Object.keys(localStorage).filter(k=>k.startsWith('demo-')).forEach(k=>localStorage.removeItem(k)); }catch(e){}
      location.reload();
    }
  });
})();

(async function init(){
  state.lang = loadLang();
  state.selProjekt = lsGet('geruest-bv') || '';
  restoreSession();
  if(!state.loggedIn){ state.name = DEMO_PERSON.baustelle; state.authName = state.name; state.role = 'baustelle'; state.loggedIn = true; }
  // Echte Anmeldung: gilt nur, wenn Supabase noch eine Sitzung hat
  // (bleibt gespeichert, bis man sich abmeldet; geht auch ohne Netz).
  // Ohne Netz kann Supabase eine abgelaufene Sitzung nicht verlängern und
  // meldet dann "keine Sitzung" -- liegt sie aber noch auf dem Handy, bleibt
  // man angemeldet (sonst würde man beim Offline-Start rausgeworfen).
  try{
    const { data, error } = await supabaseClient.auth.getSession();
    state.authed = !!(data && data.session) || (!!error && hasStoredAuth());
  }catch(e){ state.authed = hasStoredAuth(); }
  if(!state.authed){ state.loggedIn=false; state.role=null; state.authName=null; clearSession(); lsSet(CACHE_KEY, null); lsSet(PENDING_KEY, null); }
  // letzter Stand + gemerkte Änderungen sofort zeigen (auch ohne Netz),
  // frische Daten kommen gleich danach über loadShared()
  else if(restoreOfflineState()){ state.loading = false; render(); }
  if(!state.authed && !navigator.onLine){ state.loading = false; render(); }
  try{
    supabaseClient.auth.onAuthStateChange((event)=>{
      if(event==='SIGNED_OUT' && state.authed){ signOutAll().then(render); }
    });
  }catch(e){}
  await loadShared();
  state.loading = false;
  render();
  syncPushSub();
})();
