// Chef-Passwort: verschlüsselt (SHA-256 mit Salz) im Datensatz.
async function sha256hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function makeChefPw(pw){
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b=>b.toString(16).padStart(2,'0')).join('');
  return {salt, hash: await sha256hex(salt+':'+pw)};
}
// true = richtig. Gibt es noch keins (neue Datenbank), wird das erste
// eingegebene (mind. MIN_PW Zeichen) zum Chef-Passwort.
async function verifyChefPw(pw){
  pw = String(pw||'').trim();
  if(!state.authed || !pw) return false;
  if(!state.chefPw || !state.chefPw.hash){
    if(pw.length < MIN_PW) return false;
    state.chefPw = await makeChefPw(pw);
    await saveShared();
    return true;
  }
  return (await sha256hex(state.chefPw.salt+':'+pw)) === state.chefPw.hash;
}
// Ruft die Server-Funktion manage-users auf. Liefert {ok} oder wirft einen
// Fehler mit lesbarem Text (Code -> Übersetzung).
async function manageUsers(body){
  let res;
  try{ res = await supabaseClient.functions.invoke('manage-users', {body}); }
  catch(e){ throw new Error(t('persFnMissing')); }
  const { data, error } = res;
  if(!error) return data;
  let info = null;
  try{ info = error.context && typeof error.context.json==='function' ? await error.context.json() : null; }catch(e){}
  const map = {last_chef:'persWarnLastChef', duplicate:'persWarnDuplicate', pw_short:'persWarnPwShort', not_chef:'persNotChef', fields:'persWarnFields'};
  if(info && map[info.code]) throw new Error(t(map[info.code]));
  if(info && info.error) throw new Error(t('persErr',{msg:info.error}));
  throw new Error(t('persFnMissing'));
}

async function saveShared(){
  if(!state.authed) return false;
  if(!syncBase){
    // Server-Stand nie gelesen -> NICHT speichern (sonst würden echte Daten
    // mit leeren Startwerten überschrieben). Änderung bleibt lokal sichtbar.
    console.warn('Noch keine Verbindung zum Server – nicht gespeichert');
    state.syncOffline = true;
    return false;
  }
  state.syncPending = true;
  try{ await sync(); return true; }
  catch(e){ console.error('Speichern fehlgeschlagen', e); return false; }
}

// In eine Rolle einsteigen; Chef verlangt ZUSÄTZLICH das Chef-Passwort.
// ---- Push-Benachrichtigungen ---------------------------------------------
// Jedes Handy, das Benachrichtigungen erlaubt, landet mit seinem Push-
// Abo in state.pushSubs ({endpoint, keys, name, lang, ts}). Verschickt
// wird über die Supabase Edge Function "send-push" (notify()): sie sucht
// die passenden Handys (nach Rolle der Person oder nach Name) und schickt
// den Text in der Sprache, die auf dem jeweiligen Handy eingestellt ist.
// Ist die Funktion (noch) nicht eingerichtet, passiert einfach nichts.
const PUSH_ENDPOINT_KEY = 'geruest-push-endpoint', PUSH_LATER_KEY = 'geruest-push-later';
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
function lsGet(k){ try{ return localStorage.getItem(skey(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null? localStorage.removeItem(skey(k)) : localStorage.setItem(skey(k),v); }catch(e){} }
function pushActiveHere(){
  const ep = lsGet(PUSH_ENDPOINT_KEY);
  return !!ep && state.pushSubs.some(s=>s.endpoint===ep && s.name===state.name);
}
function urlB64ToUint8(b64){
  const raw = atob((b64 + '='.repeat((4-b64.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function registerPushSub(sub){
  const j = sub.toJSON();
  state.pushSubs = state.pushSubs.filter(x=>x.endpoint!==j.endpoint);
  state.pushSubs.push({endpoint:j.endpoint, keys:j.keys, name:state.name, lang:state.lang, ts:nowStr()});
  lsSet(PUSH_ENDPOINT_KEY, j.endpoint);
  await saveShared();
}
async function enablePush(){
  if(window.DEMO_MODE===true) return;
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ state.pushMsg = t('pushDenied'); render(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8(VAPID_PUBLIC_KEY)});
    await registerPushSub(sub);
    state.pushMsg = '';
  }catch(e){ console.error('Push einschalten fehlgeschlagen', e); state.pushMsg = t('pushFailed'); }
  render();
}
// Nach Anmeldung/Sprachwechsel: Handy hat schon erlaubt -> Abo still auf
// aktuelle Person/Sprache umschreiben (kein erneutes Nachfragen).
async function syncPushSub(){
  if(window.DEMO_MODE===true) return;
  if(!pushSupported() || !state.loggedIn || Notification.permission!=='granted') return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub) return;
    const cur = state.pushSubs.find(x=>x.endpoint===sub.endpoint);
    if(cur && cur.name===state.name && cur.lang===state.lang) return;
    await registerPushSub(sub);
    render();
  }catch(e){}
}
// Beim Abmelden: Handy nicht mehr dieser Person zuordnen
async function unlinkPushSub(){
  const ep = lsGet(PUSH_ENDPOINT_KEY);
  if(!ep) return;
  const before = state.pushSubs.length;
  state.pushSubs = state.pushSubs.filter(x=>x.endpoint!==ep);
  if(state.pushSubs.length!==before) await saveShared();
}
function pushCardHTML(){
  if(window.DEMO_MODE===true) return '';
  if(!state.loggedIn || lsGet(PUSH_LATER_KEY)) return '';
  const btns = (enable)=>`<div class="push-actions">
    ${enable? `<button class="chip-btn primary" data-action="push-enable">${t('pushEnableBtn')}</button>`:''}
    <button class="chip-btn" data-action="push-later">${t('pushLaterBtn')}</button></div>`;
  if(isIOS() && !isStandalone()){
    return `<div class="push-card"><b>🔔 ${t('pushCardTitle')}</b><div>${t('pushIosHint')}</div>${btns(false)}</div>`;
  }
  if(!pushSupported()) return '';
  if(Notification.permission==='granted' && pushActiveHere()) return '';
  if(Notification.permission==='denied') return state.pushMsg? `<div class="push-card"><div>${state.pushMsg}</div>${btns(false)}</div>` : '';
  return `<div class="push-card"><b>🔔 ${t('pushCardTitle')}</b><div>${t('pushCardText')}</div>
    ${state.pushMsg? `<div class="warn">${state.pushMsg}</div>`:''}${btns(true)}</div>`;
}
function tlv(lang, key, vars){
  let s = stripEmo(tl(lang, key));
  if(vars) Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}
function isoToDE(iso){ const [y,m,d] = iso.split('-'); return `${d}.${m}.${y}`; }
// target = {roles:[...], names:[...]}; Texte werden für alle 5 Sprachen
// mitgeschickt, die Funktion nimmt pro Handy die passende.
function notify(target, titleKey, bodyKey, vars){
  if(!supabaseClient || !supabaseClient.functions) return;
  const msgs = {};
  LANGS.forEach(l=>{ msgs[l.code] = {title:tlv(l.code,titleKey,vars), body:tlv(l.code,bodyKey,vars)}; });
  supabaseClient.functions.invoke('send-push', {body:{roles:target.roles||[], names:target.names||[], exclude:state.name||null, msgs, url:'./geruest-bestell-app.html'}})
    .then(({data})=>{
      if(data && Array.isArray(data.gone) && data.gone.length){
        state.pushSubs = state.pushSubs.filter(x=>!data.gone.includes(x.endpoint));
        saveShared();
      }
    })
    .catch(e=>console.warn('Push-Versand nicht möglich', e));
}

// Suche: mehrere Wörter (alle müssen passen), egal ob groß/klein, mit oder
// ohne Umlaut (geländer/gelander), Längen als "2,00", "2.00", "200" oder "2m".
function normSearch(str){
  return String(str||'').toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/,/g,'.');
}
function matchSearch(it, q){
  const name = normSearch(itemName(it));
  const hay = name + ' ' + name.replace(/(\d)\.(\d)/g,'$1$2') + ' ' + normSearch(it.id).replace(/_/g,' ') + ' ' + normSearch(catName({id:it.cat}));
  return normSearch(q).split(/\s+/).filter(Boolean)
    .map(tok=>/^\d+m$/.test(tok) ? tok.slice(0,-1)+'.0' : tok.replace(/^(\d+\.\d+)m$/,'$1'))
    .every(tok=>hay.includes(tok));
}

// ---- Bestellliste: Teile-Arten mit Varianten ---------------------------
// Auf der Baustelle kennt man die Teile-ART und wählt dann die Länge/
// Variante ("Konsole – welche: 30 oder 70?"). Darum: großes Suchfeld oben,
// dann je Teile-Art EINE Zeile; Antippen klappt genau diese Art auf (state.
// openArt), eine andere schließt die vorige. PART_GROUPS fasst mehrere
// Teile-Arten (part_<key>-Namensschlüssel) zu einer Anzeige-Zeile zusammen
// (Name T.group_<gruppe>) – nur Anzeige, Artikel-IDs bleiben unverändert.
const PART_GROUPS = { konsole: ['konsole30','konsole70','konsole100'] };
const PART_GROUP_OF = Object.fromEntries(Object.entries(PART_GROUPS).flatMap(([g, keys])=>keys.map(k=>[k, g])));

// Teile-Arten des aktuellen Systems (Reihenfolge wie im Excel), Gruppen an
// der Stelle ihres ersten Mitglieds: [{key, label, icon, parts:[{cat, label, items}]}]
function artEntries(systemItems, counts){
  const out = [], groupIdx = {};
  systemCategories().forEach(cat=>{
    const items = systemItems.filter(it=>it.cat===cat.id).sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));
    if(!items.length) return;
    const part = {cat:cat.id, label:catName(cat), items};
    const g = PART_GROUP_OF[PART_NAMEKEY[cat.id]];
    if(g){
      if(groupIdx[g]==null){ groupIdx[g] = out.length; out.push({key:'g:'+g, label:t('group_'+g), icon:items[0].icon, parts:[]}); }
      out[groupIdx[g]].parts.push(part);
    } else {
      out.push({key:cat.id, label:part.label, icon:items[0].icon, parts:[part]});
    }
  });
  return out;
}

function artRowHTML(a){
  const items = a.parts.flatMap(p=>p.items);
  if(items.length===1){
    const only = items[0], on = (state.cart[only.id]||0)>0;
    return `<div class="art single${on?' has-cart':''}">${variantRowHTML(only, true, ICONS[a.icon]||'', true)}</div>`;
  }
  const inCart = items.reduce((s,it)=>s+(state.cart[it.id]||0), 0);
  const open = state.openArt===a.key;
  const numeric = items.every(it=>typeof it.v==='number');
  const meta = inCart ? `<b>${t('artInCart',{n:inCart})}</b>`
    : (items.length>1 ? t(numeric? 'artLengths':'artVariants', {n:items.length}) : '');
  let body = '';
  if(open){
    body = `<div class="art-body">${a.parts.map(p=>{
      // Unterüberschrift nur, wenn eine Gruppe mehrere Arten hat und diese Art mehrere Varianten
      const sub = a.parts.length>1 && p.items.length>1;
      return (sub? `<div class="art-sub">${p.label}</div>` : '') +
        p.items.map(it=>variantRowHTML(it, a.parts.length>1 && !sub && it.v==null)).join('');
    }).join('')}</div>`;
  }
  return `<div class="art${open?' open':''}${inCart?' has-cart':''}">
    <button type="button" class="art-row" data-action="art-toggle" data-art="${a.key}" aria-expanded="${open}">
      <span class="t-icon">${ICONS[a.icon]||''}</span>
      <span class="art-name">${a.label}</span>
      <span class="art-meta" data-idle="${items.length>1 ? t(numeric? 'artLengths':'artVariants', {n:items.length}) : ''}">${meta}</span>
      <span class="art-chev" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
    </button>
    ${body}
  </div>`;
}

// ---- Dringlichkeit / Wunschtermin -----------------------------------
// Die Baustelle wählt im Bestellschein-Entwurf, wann sie die Teile
// braucht: normal / dringend / morgen früh / Wunschtermin. Gespeichert als
// order.wunsch ('dringend'|'morgen'|'datum') + order.bis (ISO-Datum).
// Lager/Fahrer/Chef sehen offene Bestellungen danach sortiert
// (sortOrdersForWork): dringend zuerst, dann nach Datum, Rest nach Nummer.
const WUNSCH_OPTS = [['normal','wunschNormal'],['dringend','wunschDringend'],['morgen','wunschMorgen'],['datum','wunschDatum']];
function wunschBadgeHTML(o){
  if(o.status==='Geliefert') return '';
  if(o.wunsch==='dringend') return `<span class="wunsch-badge w-urgent">${t('badgeDringend')}</span>`;
  if(!o.bis) return '';
  const today = todayISO();
  if(o.bis < today) return `<span class="wunsch-badge w-urgent">${t('badgeUeberfaellig',{d:formatDateDE(o.bis)})}</span>`;
  if(o.bis === today) return `<span class="wunsch-badge w-today">${t('badgeHeute')}</span>`;
  return `<span class="wunsch-badge">${t('badgeBis',{d:formatDateDE(o.bis)})}</span>`;
}
function sortOrdersForWork(list){
  const rank = o => o.status==='Geliefert' ? 3 : o.wunsch==='dringend' ? 0 : o.bis ? 1 : 2;
  return [...list].sort((a,b)=>{
    const ra = rank(a), rb = rank(b);
    if(ra!==rb) return ra-rb;
    if(ra===1 && a.bis!==b.bis) return a.bis < b.bis ? -1 : 1;
    if(ra===3) return b.id-a.id;   // Geliefertes: neueste zuerst, ganz unten
    return a.id-b.id;
  });
}

// ---- Abholungen / Rücklieferungen -----------------------------------
// Material, das von einer Baustelle zurück ins Lager soll -- übriges
// Material ("lieber etwas zu viel liefern als zu wenig") oder der ganze
// Abbau. state.pickups = [{id, projekt, baustelle, coords, person, items[],
// abbau, notiz, wunsch, bis, status, fahrer, time}], Zähler pickupCounter.
// Ablauf (PU_FLOW, Werte bleiben deutsch gespeichert): Gemeldet ->
// Unterwegs (Fahrer "Ich hole es ab") -> Abgeholt ("Aufgeladen") -> Im
// Lager ("Im Lager abgeladen": Teile zurück in den Bestand, nicht mehr
// "vor Ort"). Bis "Im Lager" jederzeit änderbar (Editor pickupEditorHTML,
// state.puDraft): Mengen vorbefüllt aus dem, was am Bauvorhaben vor Ort
// ist (deliveredAt), weitere Teile über die Suche.
const PU_FLOW = ['Gemeldet','Unterwegs','Abgeholt','Im Lager'];
const PU_KEY = {'Gemeldet':'puGemeldet', 'Unterwegs':'puUnterwegs', 'Abgeholt':'puAbgeholt', 'Im Lager':'puImLager'};
const PU_NEXT = {'Gemeldet':{roles:['fahrer'], next:'Unterwegs', key:'puBtnHin'},
                 'Unterwegs':{roles:['fahrer'], next:'Abgeholt', key:'puBtnGeladen'},
                 'Abgeholt':{roles:['fahrer','lager'], next:'Im Lager', key:'puBtnLager'}};
// Was ist am Bauvorhaben noch vor Ort: geliefert minus schon zurück im Lager
function deliveredAt(pid){
  const m = {};
  state.orders.filter(o=>o.projekt===pid && o.status==='Geliefert').forEach(o=>o.items.forEach(i=>{ m[i.id] = (m[i.id]||0) + i.qty; }));
  state.pickups.filter(p=>p.projekt===pid && p.status==='Im Lager').forEach(p=>(p.items||[]).forEach(i=>{ m[i.id] = (m[i.id]||0) - i.qty; }));
  Object.keys(m).forEach(k=>{ if(m[k] <= 0) delete m[k]; });
  return m;
}
function openPickups(){ return state.pickups.filter(p=>p.status!=='Im Lager'); }
function sortPickups(list){
  return sortOrdersForWork(list.map(p=>({...p, status: p.status==='Im Lager' ? 'Geliefert' : p.status}))).map(x=>state.pickups.find(p=>p.id===x.id) || x);
}

    items: pu ? Object.fromEntries((pu.items||[]).map(i=>[i.id, i.qty])) : {},

async function savePickup(){
  const d = state.puDraft;
  const pid = d.projekt && d.projekt!=='_frei' ? parseInt(d.projekt,10) : null;
  const p = pid ? state.projects.find(x=>x.id===pid) : null;
  const items = puItemsFromDraft(d);
  if(!p && !d.ort.trim()){ state.puWarn = t('puWarnOrt'); render(); return; }
  if(!items.length && !d.abbau){ state.puWarn = t('puWarnEmpty'); render(); return; }
  const dateEl = document.getElementById('puDate');
  const bis = d.wunsch==='morgen' ? addDaysISO(todayISO(), 1) : d.wunsch==='datum' ? ((dateEl && dateEl.value) || d.bis || null) : null;
  const base = {projekt: pid, baustelle: p ? `${p.name}, ${p.adresse}` : d.ort.trim(), coords: p ? (p.coords||null) : null,
    items, abbau: d.abbau, notiz: d.notiz.trim()};
  let pu;
  if(d.id){
    pu = state.pickups.find(x=>x.id===d.id);
    if(!pu){ state.puDraft = null; render(); return; }
    Object.assign(pu, base, {changedBy: state.name, changedAt: nowStr()});
  } else {
    pu = {id: state.pickupCounter++, ...base, person: state.name, status:'Gemeldet', time: nowStr()};
    state.pickups.push(pu);
  }
  if(d.wunsch!=='normal' && (d.wunsch!=='datum' || bis)){ pu.wunsch = d.wunsch; if(bis) pu.bis = bis; else delete pu.bis; }
  else { delete pu.wunsch; delete pu.bis; }
  state.puDraft = null;
  await saveShared();
  render();
  showToast(d.id ? t('puUpdated',{id:pu.id}) : t('puSaved',{id:pu.id}));
  if(!d.id) notify({roles:['fahrer','lager','chef']}, 'nPuNewT', 'nPuNewB', {id:pu.id, ort:pu.baustelle, person:pu.person});
}

// ---- Packliste (Lager) ---------------------------------------------
// Solange eine Bestellung "In Bearbeitung" ist, hakt das Lager jede
// Position ab: "Eingepackt" oder "Fehlt" (mit Anzahl, die fehlt).
// order.pick = {[Positions-Index]: {s:'ok'|'fehlt', n:fehlende Stück}}.
// Bei "Bereit melden" wird die Bestellung auf das Eingepackte gekürzt,
// nur das vom Bestand abgezogen und für das Fehlende automatisch eine
// Nachlieferung angelegt (neue Bestellung, nachVon = alte Nummer; die
// alte bekommt fehlt[] + nachId). Der Besteller bekommt eine Nachricht.
function pickState(o, i){ return (o.pick||{})[i] || null; }
function pickMissN(o, i){
  const p = pickState(o, i);
  if(!p || p.s!=='fehlt') return 0;
  const q = o.items[i].qty;
  return Math.min(q, Math.max(1, parseInt(p.n,10) || q));
}
function pickDecided(o){ return o.items.filter((_,i)=>pickState(o,i)).length; }
function pickListHTML(o){
  const done = pickDecided(o), open = o.items.length - done;
  const miss = o.items.filter((_,i)=>pickMissN(o,i)>0).length;
  return `<div class="pick-hint">${t('pickHint')}</div>
  <div class="pick-list">${o.items.map((it,i)=>{
    const r = resolvedItem(it), p = pickState(o,i);
    return `<div class="pick-row ${p? 'pk-'+p.s : ''}">
      <button class="pick-tap" data-action="pick-row" data-order="${o.id}" data-idx="${i}" role="checkbox" aria-checked="${!!(p&&p.s==='ok')}">
        <span class="pick-box">${ic('check')}</span>
        <span class="pick-name">${it.qty} ${r.unit} — ${r.name}</span>
      </button>
      <button class="pick-btn miss ${p&&p.s==='fehlt'?'on':''}" data-action="pick" data-order="${o.id}" data-idx="${i}" data-s="fehlt">${t('pickMissBtn')}</button>
      ${p && p.s==='fehlt'? `<label class="pick-miss">${t('pickMissQty')} <input type="number" min="1" max="${it.qty}" inputmode="numeric" id="pickMiss-${o.id}-${i}" data-order="${o.id}" data-idx="${i}" value="${pickMissN(o,i)}"> ${r.unit}</label>`:''}
    </div>`;
  }).join('')}</div>
  ${open>0? `<button class="pick-all-btn" data-action="pick-all" data-order="${o.id}">${t('pickAllBtn')}</button>`:''}
  <div class="pick-progress">${t('pickProgress',{a:done, n:o.items.length})}${miss? ` · <b>${t('pickMissingCount',{n:miss})}</b>`:''}</div>
  ${open>0? `<div class="pick-open">${t('pickOpenN',{n:open})}</div>`
    : (o.status==='In Bearbeitung'? `<button class="advance-btn pick-ready" data-action="advance" data-order="${o.id}">${stepLabel(o.status)}</button>`:'')}
  <div id="pickWarn-${o.id}"></div>`;
}
function itemsListHTML(items){
  return `<ul class="order-items">${items.map(i=>{const r=resolvedItem(i); return `<li>${i.qty} ${r.unit} — ${r.name}</li>`;}).join('')}</ul>`;
}

function orderCardHTML(o, role, extra){
  const step = NEXT_STEP[o.status];
  const lagerPick = role==='lager' && (o.status==='Neu' || o.status==='In Bearbeitung');
  const showBtn = role && step && step.role===role && !lagerPick;
  const statusClass = 'st-'+slug(o.status);
  const wTxt = weightText(o.items);
  const mapsUrl = o.coords
    ? `https://www.google.com/maps?q=${o.coords.lat},${o.coords.lon}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.baustelle)}`;
  const tourable = role==='fahrer' && (o.status==='Bereit zur Abholung' || o.status==='Beladen');
  const ticked = tourable && (state.tourSel||[]).includes(o.id);
  return `<div class="order-card ${statusClass}">
    <div class="order-head">
      ${tourable? `<button class="tour-tick ${ticked?'on':''}" data-action="tour-toggle" data-order="${o.id}" role="checkbox" aria-checked="${ticked}" aria-label="${t('tourPickAria')}"><i></i></button>`:''}
      <div class="order-head-main"><div class="no">#${o.id}</div><div class="site">${o.baustelle}</div></div>
      <div class="status-badge ${statusClass}">${statusLabel(o.status)}</div>
    </div>
    ${wunschBadgeHTML(o) || o.nachVon? `<div class="wunsch-row">${wunschBadgeHTML(o)}${o.nachVon? `<span class="wunsch-badge w-nach">${t('nachVonBadge',{id:o.nachVon})}</span>`:''}</div>`:''}
    <div class="order-time order-meta">${t('bestelltVonInline')} ${o.person} · ${o.time}${wTxt? ' · ⚖️ '+wTxt : ''}${stepTimesText(o)? ' · '+stepTimesText(o) : ''}</div>
    ${lagerPick ? pickListHTML(o) : itemsListHTML(o.items)}
    ${o.fehlt && o.fehlt.length? `<div class="fehlt-box"><b>${t('fehltHeading',{id:o.nachId})}</b>${itemsListHTML(o.fehlt)}</div>`:''}
    ${showBtn && role==='fahrer' && o.status==='Bereit zur Abholung'
      ? `<div class="advance-row"><button class="advance-btn" data-action="load-go" data-order="${o.id}">${t('loadGoBtn')}</button><button class="advance-btn advance-alt" data-action="advance" data-order="${o.id}">${t('onlyLoadBtn')}</button></div>`
      : showBtn? `<button class="advance-btn" data-action="advance" data-order="${o.id}">${stepLabel(o.status)}</button>` : ''}
    <div class="btn-row-secondary">
      <a class="mini-btn" href="${mapsUrl}" target="_blank" rel="noopener">📍 ${t('mapsShort')}</a>
      <button class="mini-btn" data-action="print-order" data-order="${o.id}">🖨️ ${t('printShort')}</button>
    </div>
    ${o.status==='Geliefert'? `<div class="done-label">${t('geliefertLabel')}</div>` : ''}
    ${extra||''}
  </div>`;
}

function inventoryRowHTML(it, editable){
  const qty = state.inventory[it.id] ?? 0;
  let qtyClass='', tag='';
  if(qty<0){ qtyClass='stock-missing'; tag=`${t('stockMissingLabel')} ${-qty} ${unitLabel(it.unit)}`; }
  else if(qty>0 && qty<10){ qtyClass='stock-low'; tag=t('stockLow'); }
  return `<div class="inv-row">
    <div class="inv-icon">${ICONS[it.icon]}</div>
    <div class="inv-main">
      <div class="inv-name">${itemName(it)}</div>
      <div class="inv-qty ${qtyClass}">${qty} ${unitLabel(it.unit)} ${tag? `<span class="tag">${tag}</span>`:''}</div>
    </div>
    ${editable? `<div class="inv-actions">
      <button data-action="inv" data-id="${it.id}" data-delta="-1">−</button>
      <button data-action="inv" data-id="${it.id}" data-delta="1">+</button>
      <button class="inv-restock" data-action="inv" data-id="${it.id}" data-delta="10">+10</button>
    </div>` : ''}
  </div>`;
}
function inventoryTableHTML(editable){
  const tabs = SYSTEMS.length>1? `<div class="seg-control">${SYSTEMS.map(s=>`<button class="${state.systemSel===s.id?'active':''}" data-action="system-tab" data-sys="${s.id}">${t(s.nameKey)}</button>`).join('')}</div>`:'';
  return tabs + systemCategories().map(cat=>{
    const items = CATALOG.filter(it=>it.cat===cat.id && inSystem(it));
    if(!items.length) return '';
    return `<h4 class="inv-cat">${catName(cat)}</h4><div class="inv-list">${items.map(it=>inventoryRowHTML(it, editable)).join('')}</div>`;
  }).join('');
}

    {id:'bestellungen', key:'tabBestellungen', ico:'package', badge: state.orders.filter(o=>o.status==='Neu').length + state.pickups.filter(p=>p.status==='Abgeholt').length},

         ${openPickups().length? `<h3 style="font-size:15px;margin:22px 0 8px 0;">${t('puLagerHeading')} (${openPickups().length})</h3>${pickupListHTML(openPickups(), 'lager')}`:''}

// Geplante Lieferungen: Chef legt Bauvorhaben + Datum + Teile im Voraus
// fest (state.plannedDeliveries), getrennt von den dringenden/laufenden
// Bestellungen. Erscheint als eigene, nach Datum sortierte Liste bei
// Lager und Fahrer (rein lesend), beim Chef zusätzlich mit Lösch-Knopf.
function plannedDeliveryCardHTML(pd, editable){
  const proj = state.projects.find(p=>p.id===pd.projekt);
  const projLabel = proj ? `BV ${proj.id} – ${proj.name}` : '';
  const itemsHtml = pd.items.map(i=>{
    const r = resolvedItem(i);
    return `<li>${i.qty} ${r.unit} — ${r.name}</li>`;
  }).join('');
  return `<div class="order-card">
    <div class="order-head">
      <div><div class="no">${formatDateDE(pd.date)}</div><div class="site">${projLabel}</div></div>
    </div>
    <ul class="order-items">${itemsHtml}</ul>
    ${weightLineHTML(pd.items)}
    <div class="order-time">${t('plGeplantVonPrefix')} ${pd.person}</div>
    ${editable? `<button class="refresh-btn" data-action="delete-planned" data-id="${pd.id}" style="margin-top:10px;">${t('plDeleteBtn')}</button>`:''}
  </div>`;
}

function geplantListHTML(editable){
  const sorted = [...state.plannedDeliveries].sort((a,b)=> a.date<b.date? -1 : a.date>b.date? 1 : a.id-b.id);
  if(!sorted.length) return `<div class="empty-state">${t('plEmpty')}</div>`;
  return `<div class="card-grid">${sorted.map(pd=>plannedDeliveryCardHTML(pd, editable)).join('')}</div>`;
}

// Fahrer-Status: jeder Fahrer stellt für sich selbst ein, wo er gerade
// ist (nicht ein gemeinsamer LKW-Status, da mehrere Fahrer gleichzeitig
// unterwegs sein können). Gespeichert in state.driverStatus, keyed per
// Mitarbeitername: {status:'lager'|'unterwegs', time:'...'}.
const DRIVER_STATUSES = ['lager','unterwegs'];
function driverStatusMeta(s){
  const map = {
    lager:{key:'driverStatusLager', cls:'st-Geliefert'},
    unterwegs:{key:'driverStatusUnterwegs', cls:'st-Unterwegs'},
  };
  return map[s] || null;
}
// Bei "Unterwegs" tippt der Fahrer an, WOHIN (ziel = Bauvorhaben-ID).
// Der Chef kann einen Fahrer auch selbst zu einem Bauvorhaben schicken
// (Detail-Ansicht des Bauvorhabens) -- dann steht in "by" der Chef-Name.
function myStatusWidgetHTML(){
  const cur = state.driverStatus[state.name];
  const aktive = state.projects.filter(p=>p.aktiv);
  const unterwegs = cur && cur.status==='unterwegs';
  const collapsed = unterwegs && !!cur.ziel && !state.zielOpen && aktive.some(p=>p.id===cur.ziel);
  return `<div class="order-card my-status" style="margin-bottom:16px;">
    <div class="ms-label" style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;">${t('myStatusLabel')}</div>
    <div class="seg-control" style="margin-bottom:0;">
      ${DRIVER_STATUSES.map(s=>{
        const m = driverStatusMeta(s);
        const lbl = s==='lager' ? `<span class="st-full">${t(m.key)}</span><span class="st-short">${t('driverStatusLagerShort')}</span>` : t(m.key);
        return `<button class="${cur&&cur.status===s?'active':''}" data-action="set-driver-status" data-status="${s}">${lbl}</button>`;
      }).join('')}
    </div>
    ${unterwegs && cur.by? `<div class="sent-note">${t('driverSentBy',{name:cur.by})}</div>`:''}
    ${unterwegs? `<div class="ziel-label" style="font-size:13px;font-weight:700;color:var(--muted);margin-top:12px;">${t('driverZielLabel')}</div>
      ${aktive.length? `<div class="ziel-chips">${aktive.filter(p=>!collapsed || cur.ziel===p.id).map(p=>{
        const hex = projektColorMeta(p.farbe).hex;
        return `<button class="ziel-chip ${cur.ziel===p.id?'active':''}" data-action="set-driver-ziel" data-id="${p.id}"><i style="${hex?`background:${hex};`:''}"></i>BV ${p.id} – ${p.name}</button>`;
      }).join('')}${collapsed? `<button class="ziel-chip" data-action="ziel-change">${t('zielChange')}</button>`:''}</div>` : `<div class="order-time" style="margin-top:6px;">${t('pvEmptyActive')}</div>`}`:''}
    ${unterwegs && cur.ziel ? navButtonHTML(cur.ziel) : ''}
    ${cur? `<div class="order-time ms-meta" style="margin-top:8px;">${t('statusUpdatedPrefix')} ${cur.time}${cur.auto? ' · 🔄 '+t('autoTag'):''}</div>`:''}
    ${state.lager && state.lager.coords && state.geoStatus==='on'? `<div class="order-time ms-hint" style="margin-top:4px;">${t('autoHint')}</div>`:''}
  </div>`;
}
// Startet Google Maps mit Navigation zum Ziel-Bauvorhaben (Start = eigener
// Standort, das macht Google Maps selbst).
function navButtonHTML(ziel){
  const p = state.projects.find(x=>x.id===ziel);

}
function driverStatusSectionHTML(){

}
function driverStatusListHTML(){

    ${entries.map(([name,v])=>{

        <span class="status-badge ${m?m.cls:''}">${m?t(m.key):v.status}</span>

}

  const tab = state.fahrerTab;

// ---- Fahrer-Kalender: wo wann was ist ---------------------------------
// Führt LKW-Termine (state.lkwEntries, mit Uhrzeit) und geplante
// Lieferungen (state.plannedDeliveries) je Tag zusammen, jeweils mit
// Bauvorhaben (Status-Farbe, Adresse, Maps-Link). Oben eine Wochenleiste
// (Mo–So) mit Punkten je Termin, darunter der gewählte Tag
// (state.fahrerCalDay, ISO-Datum, Standard heute).
function addDaysISO(iso, n){
  const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function weekStartISO(iso){
  const wd = new Date(iso+'T12:00:00').getDay();  // 0 = Sonntag
  return addDaysISO(iso, wd===0 ? -6 : 1-wd);
}
function calEventsOn(iso){
  const ev = [];
  state.lkwEntries.filter(e=>e.date===iso).forEach(e=>ev.push({kind:'termin', time:e.time||'', projekt:e.projekt, notiz:e.notiz||''}));
  state.plannedDeliveries.filter(pd=>pd.date===iso).forEach(pd=>ev.push({kind:'lieferung', time:'', projekt:pd.projekt, items:pd.items}));
  state.projects.filter(p=>p.fertigAm===iso).forEach(p=>ev.push({kind:'fertig', time:'', projekt:p.id}));
  state.pickups.filter(p=>p.bis===iso && p.status!=='Im Lager').forEach(p=>ev.push({kind:'abholung', time:'', projekt:p.projekt, items:p.items||[], notiz:[p.abbau? '🏗️ '+t('puAbbauLabel') : '', p.notiz||''].filter(Boolean).join(' · ')}));
  // Termine mit Uhrzeit zuerst (nach Zeit), dann Lieferungen ohne Uhrzeit
  return ev.sort((a,b)=> (a.time? 0:1)-(b.time? 0:1) || a.time.localeCompare(b.time));
}
function calEventHTML(ev){
  const p = state.projects.find(x=>x.id===ev.projekt);
  const hex = p ? projektColorMeta(p.farbe).hex : null;
  const mapsUrl = !p ? '' : p.coords
    ? `https://www.google.com/maps?q=${p.coords.lat},${p.coords.lon}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.adresse)}`;
  const items = (ev.kind==='lieferung' || ev.kind==='abholung') ? ev.items.map(i=>{const r=resolvedItem(i); return `<li>${i.qty} ${r.unit} — ${r.name}</li>`;}).join('') : '';
  return `<div class="order-card proj-card ev-card" style="${hex?`--pc:${hex};`:''}">
    <div class="ev-head">
      <div class="ev-time">${ev.time || t('fkAllDay')}</div>
      <span class="ev-kind ${ev.kind}">${ev.kind==='termin' ? t('fkTermin') : ev.kind==='fertig' ? '🏁 '+t('fkFertig') : ev.kind==='abholung' ? t('fkAbholung') : t('fkLieferung')}</span>
    </div>
    <div class="no" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;">${p? `BV ${p.id} – ${p.name}` : '–'}</div>
    ${p? `<div class="order-time" style="margin:2px 0 0 0;">${p.adresse}</div>`:''}
    ${ev.notiz? `<div class="ev-notiz">${ev.notiz}</div>`:''}
    ${items? `<ul class="order-items">${items}</ul>${weightLineHTML(ev.items)}`:''}
    ${mapsUrl? `<a class="maps-btn" href="${mapsUrl}" target="_blank" rel="noopener">${t('mapsLink')}</a>`:''}
  </div>`;
}
function fahrerKalenderHTML(){
  const today = todayISO();
  const sel = state.fahrerCalDay || today;
  const start = weekStartISO(sel);
  const days = [0,1,2,3,4,5,6].map(i=>addDaysISO(start,i));
  const wd = WEEKDAYS[state.lang]||WEEKDAYS.de;
  const strip = days.map(d=>{
    const ev = calEventsOn(d);
    const dots = ev.slice(0,4).map(e=>{
      const p = state.projects.find(x=>x.id===e.projekt);
      const hex = p ? projektColorMeta(p.farbe).hex : null;
      return `<i style="background:${hex||'var(--muted)'}"></i>`;
    }).join('');
    return `<button class="day-cell ${d===sel?'active':''} ${d===today?'today':''}" data-action="fk-day" data-day="${d}">
      <span class="day-wd">${wd[new Date(d+'T12:00:00').getDay()]}</span>
      <span class="day-no">${Number(d.slice(8,10))}</span>
      <span class="day-dots">${dots}</span>
    </button>`;
  }).join('');
  const events = calEventsOn(sel);
  let empty = '';
  if(!events.length){
    const next = [...state.lkwEntries.map(e=>e.date), ...state.plannedDeliveries.map(pd=>pd.date), ...state.projects.map(p=>p.fertigAm).filter(Boolean)].filter(d=>d>sel).sort()[0];
    empty = `<div class="empty-state" style="padding:26px 10px;">${t('fkDayEmpty')}
      ${next? `<div style="margin-top:12px;"><button class="chip-btn" data-action="fk-day" data-day="${next}">${t('fkNext')} ${formatDateDE(next)} ›</button></div>`:''}</div>`;
  }
  return `<p class="view-sub">${t('fkSub')}</p>
  <div class="week-nav">
    <button class="chip-btn" data-action="fk-day" data-day="${addDaysISO(sel,-7)}" aria-label="${t('fkPrevWeek')}">‹</button>
    <div class="week-label">${formatDateDE(days[0]).split(', ')[1].slice(0,6)} – ${formatDateDE(days[6]).split(', ')[1]}</div>
    <button class="chip-btn" data-action="fk-day" data-day="${addDaysISO(sel,7)}" aria-label="${t('fkNextWeek')}">›</button>
    ${sel!==today? `<button class="chip-btn primary" data-action="fk-day" data-day="${today}">${t('fkToday')}</button>`:''}
  </div>
  <div class="week-strip">${strip}</div>
  <h3 class="section-h">${formatDateDE(sel)}</h3>
  ${events.length? `<div class="card-grid">${events.map(calEventHTML).join('')}</div>` : empty}`;
}

    ${waiting.length? `<div class="waiting-note">${t('waitingNote',{n:waiting.length})}</div>`:''}
    ${pus.length? `<h3 id="sec-fahrer-pu" style="font-size:15px;margin:22px 0 8px 0;">${t('puFahrerHeading')} (${pus.length})</h3>${pickupListHTML(pus, 'fahrer')}`:''}

  ${geplantListHTML(false)}`;

// Status-Farbe pro Bauvorhaben (nur vom Chef änderbar, Fahrer sieht sie
// nur): grün = "da muss was hin" (Lieferung nötig), hellblau = "da muss
// was geräumt/abgeholt werden" (Abbau), schwarz = nichts zu tun.
// Die gespeicherten Werte ('schwarz' usw.) bleiben gleich, nur die
// angezeigten Töne sind auf das SG-Design abgestimmt; "nichts zu tun"
// ist bewusst ein ruhiges Grau (Schwarz war im Dunkelmodus unsichtbar).
const PROJECT_COLORS = ['gruen','hellblau','schwarz'];
function projektColorMeta(c){
  const map = {
    gruen:{hex:'#1E9E5A', key:'pvColorGreen'},
    hellblau:{hex:'#3AA0E6', key:'pvColorBlue'},
    schwarz:{hex:'#7A8896', key:'pvColorBlack'},
  };
  return map[c] || {hex:null, key:'pvColorNone'};
}
function projektLabel(id){
  const p = state.projects.find(x=>x.id===id);
  return p ? `BV ${p.id} – ${p.name}` : '';
}
function todayISO(){
  const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function nowStr(){
  return new Date().toLocaleString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function nextPlanned(){
  const today = todayISO();
  return [...state.plannedDeliveries].filter(pd=>pd.date>=today).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)[0] || null;
}
function driverNames(){
  const names = state.employees.filter(e=>e.roles.includes('fahrer')).map(e=>e.name);
  Object.keys(state.driverStatus).forEach(n=>{ if(!names.includes(n) && findEmployee(n)) names.push(n); });
  return names;
}

// ---- Baupläne pro Bauvorhaben ---------------------------------------
// Dateien (PDF/Fotos) liegen im Supabase-Storage-Bucket PLAN_BUCKET unter
// bv<ID>/<zufall>-<name>, die Liste je Bauvorhaben in p.plaene =
// [{id, name, path, type, size, date, by}] im großen Datensatz. Hochladen
// und Löschen nur der Chef (BV-Detail), ansehen alle: Fahrer/Lager auf der
// BV-Karte, Baustelle unter der BV-Auswahl beim Bestellen. Der Bucket ist
// "public" (Link = Zugriff, zufälliger Dateiname) -- gleiches Schutzniveau
// wie der Rest der App. Einrichtung: SQL in CLAUDE.md ("Baupläne").
const PLAN_BUCKET = 'bauplaene';
const PLAN_MAX_MB = 50;
// Der Bucket ist (nach supabase/security.sql) privat: die App holt sich
// für alle Pläne zeitlich begrenzte Links (6 h) und erneuert sie rechtzeitig.
const planUrlCache = {};   // path -> {url, exp}
let planUrlBusy = false;
function planUrl(pl){ const c = planUrlCache[pl.path]; return c ? c.url : '#'; }
async function refreshPlanUrls(){
  if(planUrlBusy || !state.authed || !supabaseClient || !supabaseClient.storage) return;
  const soon = Date.now() + 30*60*1000;
  const paths = [];
  state.projects.forEach(p=>(p.plaene||[]).forEach(pl=>{ const c = planUrlCache[pl.path]; if(!c || c.exp < soon) paths.push(pl.path); }));
  if(!paths.length) return;
  planUrlBusy = true;
  try{
    const { data, error } = await supabaseClient.storage.from(PLAN_BUCKET).createSignedUrls(paths, 6*3600);
    if(!error && Array.isArray(data)){
      let any = false;
      data.forEach(d=>{ if(d && d.signedUrl && d.path){ planUrlCache[d.path] = {url:d.signedUrl, exp:Date.now()+6*3600*1000}; any = true; } });
      if(any){ const ae = document.activeElement; if(!(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))) render(); }
    }
  }catch(e){ console.warn('Plan-Links nicht ladbar', e); }
  planUrlBusy = false;
}
function formatSize(b){
  if(!b) return '';
  const mb = b/1024/1024;
  const txt = mb >= 1 ? mb.toFixed(1)+' MB' : Math.max(1, Math.round(b/1024))+' KB';
  return state.lang==='en' ? txt : txt.replace('.', ',');
}
function plaeneHTML(p, editable){
  const list = p.plaene || [];
  if(!list.length && !editable) return '';
  return `<div class="plaene">
    <div class="plaene-head">📐 ${t('plaeneHeading')} (${list.length})</div>
    ${list.length? `<div class="plaene-list">${list.map(pl=>{
      const url = planUrl(pl);
      const isImg = (pl.type||'').startsWith('image/');
      return `<div class="plan-row">
        <a class="plan-link" href="${url}" target="_blank" rel="noopener">
          ${isImg? `<img class="plan-thumb" src="${url}" alt="" loading="lazy">` : `<span class="plan-icon">📄</span>`}
          <span class="plan-txt"><span class="plan-name">${escapeHtml(pl.name)}</span><span class="plan-meta">${[formatSize(pl.size), pl.date].filter(Boolean).join(' · ')}</span></span>
        </a>
        ${editable? `<button class="plan-del" data-action="plan-delete" data-projekt="${p.id}" data-plan="${pl.id}" aria-label="${t('planDelete')}" title="${t('planDelete')}">🗑</button>`:''}
      </div>`;
    }).join('')}</div>` : `<div class="order-time" style="margin:4px 0 0 0;">${t('plaeneEmpty')}</div>`}
    ${editable? `<label class="plan-upload ${state.planUploading===p.id?'busy':''}">${state.planUploading===p.id? t('planUploading') : t('planUploadBtn')}<input type="file" id="planFile-${p.id}" data-projekt="${p.id}" accept="application/pdf,image/*" multiple hidden></label>
      <div class="plan-hint">${t('planHint',{mb:PLAN_MAX_MB})}</div>
      ${state.planWarnFor===p.id && state.planWarn? `<div class="warn">${state.planWarn}</div>`:''}`:''}
  </div>`;
}
async function uploadPlans(pid, files){
  state.planWarn = ''; state.planWarnFor = pid; state.planUploading = pid; render();
  for(const f of files){
    if(f.size > PLAN_MAX_MB*1024*1024){ state.planWarn = t('planTooBig',{name:f.name, mb:PLAN_MAX_MB}); continue; }
    const safe = f.name.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80) || 'plan';
    const path = `bv${pid}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}-${safe}`;
    let error = null;
    try{ ({ error } = await supabaseClient.storage.from(PLAN_BUCKET).upload(path, f, {contentType: f.type || 'application/octet-stream', upsert:false})); }
    catch(e){ error = e; }
    if(error){
      console.error('Plan-Upload fehlgeschlagen', error);
      state.planWarn = /bucket|not found/i.test(String(error.message||error)) ? t('planNoBucket') : t('planUploadFail');
      continue;
    }
    const cur = state.projects.find(x=>x.id===pid);
    if(!cur) continue;
    cur.plaene = [...(cur.plaene||[]), {id: Date.now()*1000 + Math.floor(Math.random()*1000), name:f.name, path, type:f.type||'', size:f.size,
      date: new Date().toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}), by: state.name}];
    await saveShared();
  }
  state.planUploading = null;
  render();
  refreshPlanUrls();
}

// ---- Karte der Bauvorhaben (München + Umgebung) ------------------------
// Leaflet + OpenStreetMap, erst beim ersten Öffnen nachgeladen. Die App
// zeichnet alle 4 s neu (innerHTML) -- damit Karte, Zoom und offenes
// Popup das überleben, gibt es EIN dauerhaftes Karten-Element, das nach
// jedem render() wieder in den Platzhalter #bvMapSlot gehängt wird.
// Bauvorhaben ohne Koordinaten werden einmalig über die Adresse gesucht
// (Nominatim, max. 1 Anfrage/s) und die Koordinaten im Bauvorhaben
// gespeichert (p.coords) -- davon profitiert auch der Maps-Link.
const MAP_CENTER = [48.137, 11.575];
// München + Umland (ca. 80 km: Augsburg, Ingolstadt, Landshut, Mühldorf,
// Rosenheim, Garmisch), Format Nominatim: links,oben,rechts,unten
const MUC_VIEWBOX = '10.6,48.85,12.65,47.4';
let leafletLoading = null, bvMap = null, bvMapEl = null, bvLayer = null, bvMapSig = '', bvMapIds = '';
const geocodeTried = new Set();
let geocodeRunning = false;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletLoading) return leafletLoading;
  leafletLoading = new Promise((resolve, reject)=>{
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
    js.onload = resolve; js.onerror = ()=>{ leafletLoading = null; reject(); };
    document.head.appendChild(js);
  });
  return leafletLoading;
}
async function mountProjectMap(){
  const slot = document.getElementById('bvMapSlot');
  if(!slot) return;
  if(!bvMapEl){ bvMapEl = document.createElement('div'); bvMapEl.className = 'bv-map'; }
  slot.appendChild(bvMapEl);
  try{ await loadLeaflet(); }
  catch(e){ slot.innerHTML = `<div class="order-time" style="padding:12px;">${t('mapLoadError')}</div>`; return; }
  if(!document.body.contains(bvMapEl)) return;
  if(!bvMap){
    bvMap = L.map(bvMapEl, {scrollWheelZoom:false}).setView(MAP_CENTER, 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'© OpenStreetMap'}).addTo(bvMap);
    bvLayer = L.layerGroup().addTo(bvMap);
  } else {
    bvMap.invalidateSize();
  }
  updateMapMarkers();
  geocodeMissing();
}
function updateMapMarkers(){
  if(!bvMap) return;
  const aktive = state.projects.filter(p=>p.aktiv && p.coords);
  const lc = state.lager && state.lager.coords;
  const sig = state.lang+'|'+JSON.stringify([state.lager, aktive.map(p=>[p.id,p.name,p.adresse,p.farbe,p.coords,p.fertigAm])]);
  if(sig!==bvMapSig){
  bvMapSig = sig;
  bvLayer.clearLayers();
  if(lc){
    L.marker([lc.lat, lc.lon], {icon:L.divIcon({className:'truck-pin lager-pin', html:ic('warehouse'), iconSize:[34,34], iconAnchor:[17,17]})})
      .bindTooltip(t('lagerMapLabel'), {permanent:true, direction:'top', offset:[0,-16], className:'bv-tip'})

      .addTo(bvLayer);
  }
  aktive.forEach(p=>{
    const m = projektColorMeta(p.farbe);
    const ll = [p.coords.lat, p.coords.lon];
    const maps = `https://www.google.com/maps?q=${p.coords.lat},${p.coords.lon}`;

      .bindTooltip(`BV ${p.id}`, {permanent:true, direction:'top', offset:[0,-10], className:'bv-tip'})
      .bindPopup(`<b>BV ${p.id} – ${escapeHtml(p.name)}</b><br>${escapeHtml(p.adresse)}<br>
        <span style="color:${m.hex||'#64748B'};font-weight:700;">● ${t(m.key)}</span>
        ${p.fertigAm? `<br>${ic('flag')} ${t('pvFertigGeplant')} ${formatDateDE(p.fertigAm)}`:''}
        <br><a href="${maps}" target="_blank" rel="noopener">${t('mapsLink')}</a>`)
      .addTo(bvLayer);
  });
  }
  // LKW-Standorte (nur in der Chef-Rolle, sonst leer)
  const trucks = updateTruckMarkers();
  const pts = aktive.map(p=>[p.coords.lat, p.coords.lon]).concat(trucks.map(x=>x[1]), lc? [[lc.lat, lc.lon]] : []);
  // Ausschnitt nur neu einpassen, wenn Bauvorhaben/LKWs dazukommen oder
  // wegfallen -- sonst bleibt die gewählte Ansicht erhalten.
  const ids = aktive.map(p=>p.id).join(',')+'|'+trucks.map(x=>x[0]).join(',')+'|'+(lc? lc.lat+','+lc.lon : '');
  if(pts.length && ids!==bvMapIds){
    bvMap.fitBounds(pts, {padding:[40,40], maxZoom:13});
    bvMapIds = ids;
  }
}
async function geocodeMissing(){
  if(geocodeRunning) return;
  const todo = state.projects.filter(p=>p.aktiv && !p.coords && p.adresse && !geocodeTried.has(p.id));
  if(!todo.length) return;
  geocodeRunning = true;
  for(const p of todo){
    geocodeTried.add(p.id);
    try{
      // Zuerst nur im Raum München suchen (sonst landet z. B. eine Adresse
      // ohne Ortsangabe in einer gleichnamigen Straße anderswo), erst wenn
      // dort nichts gefunden wird, in ganz Deutschland.
      const base = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=de&q=${encodeURIComponent(p.adresse)}`;
      let res = await (await fetch(base+`&viewbox=${MUC_VIEWBOX}&bounded=1`, {headers:{'Accept-Language':'de'}})).json();
      if(!res || !res[0]){
        await new Promise(r=>setTimeout(r, 1100));
        res = await (await fetch(base, {headers:{'Accept-Language':'de'}})).json();
      }
      if(res && res[0]){
        const cur = state.projects.find(x=>x.id===p.id);
        if(cur && !cur.coords){ cur.coords = {lat:parseFloat(res[0].lat), lon:parseFloat(res[0].lon)}; await saveShared(); updateMapMarkers(); }
      }
    }catch(e){ console.error('Adresse nicht gefunden', p.adresse, e); }
    await new Promise(r=>setTimeout(r, 1100));
  }
  geocodeRunning = false;
}

// ---- LKW-Standorte (nur der Chef sieht sie) ---------------------------
// Solange ein Fahrer angemeldet ist und die App offen (im Vordergrund)
// hat, schickt sie etwa alle 30 s seine Position. Gespeichert wird NUR die
// letzte Position, je Fahrer in einer eigenen Zeile von app_state
// (key = POS_PREFIX + Name) -- so überschreiben sich die häufigen
// Standort-Meldungen nicht mit Bestellungen im großen Datensatz. Klappt
// das nicht (z. B. Tabellen-Regeln erlauben keine neue Zeile), landet sie
// ersatzweise in driverPos im großen Datensatz. Beim Abmelden/Rollen-
// wechsel wird sie gelöscht. Geladen wird sie nur in der Chef-Rolle.
const POS_PREFIX = 'shopfloor-pos:';
const POS_EVERY_MS = 30000;          // höchstens alle 30 s senden
const POS_LIVE_MS = 2*60*1000;       // bis 2 Min. alt = "live"
const POS_MAX_AGE_MS = 12*60*60*1000; // älter als 12 h -> nicht mehr anzeigen
let geoWatch = null, geoName = null, geoLast = null, geoLastSent = 0, geoDenied = false;
let posLayer = null, posMarkers = {}, posLoadedOnce = false;

function geoShouldShare(){
  return state.loggedIn && state.role==='fahrer' && !!state.name && !geoDenied && document.visibilityState!=='hidden';
}
function syncGeo(){
  if(geoWatch!==null && (!state.loggedIn || state.role!=='fahrer' || state.name!==geoName)){
    stopGeo(true);  // abgemeldet/andere Rolle (auch durch enforceSession)
  }
  if(!geoShouldShare()){
    if(geoWatch!==null){ navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
    return;
  }
  if(geoWatch!==null) return;
  if(!('geolocation' in navigator)){ state.geoStatus = 'unavailable'; updateGeoBadge(); return; }
  geoName = state.name;
  if(state.geoStatus!=='on') state.geoStatus = 'wait';
  geoWatch = navigator.geolocation.watchPosition(onGeo, onGeoErr, {enableHighAccuracy:true, maximumAge:15000, timeout:60000});
  updateGeoBadge();
}
function onGeo(p){
  geoLast = {lat:+p.coords.latitude.toFixed(5), lon:+p.coords.longitude.toFixed(5), acc:Math.round(p.coords.accuracy||0), fix:Date.now()};
  if(state.geoStatus!=='on'){ state.geoStatus = 'on'; updateGeoBadge(); }
  if(Date.now()-geoLastSent >= POS_EVERY_MS) sendPos();
  autoDriverStatus(geoLast);
}
function onGeoErr(e){
  if(e && e.code===1){  // nicht erlaubt
    geoDenied = true; state.geoStatus = 'denied';
    if(geoWatch!==null){ navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
    updateGeoBadge();
  }
  // Zeitüberschreitung/kein Signal: watchPosition versucht es selbst weiter
}
async function sendPos(){
  if(!geoLast || !geoName || Date.now()-geoLast.fix > 5*60*1000) return;
  geoLastSent = Date.now();
  await writePos(geoName, {lat:geoLast.lat, lon:geoLast.lon, acc:geoLast.acc, ts:Date.now()});
}
async function writePos(name, v){
  if(!supabaseClient) return;
  try{
    const { error } = await supabaseClient.from('app_state').upsert({key:POS_PREFIX+name, value: v || {off:true, ts:Date.now()}});
    if(error) throw error;
  }catch(e){
    console.warn('Standort-Zeile nicht speicherbar, nutze gemeinsamen Datensatz', e);
    await loadShared();  // frisch laden, damit nichts Neueres überschrieben wird
    if(v) state.driverPos[name] = v; else delete state.driverPos[name];
    await saveShared();
  }
}
// ---- Fahrer-Status automatisch (Am Lager / Unterwegs) -------------------
// Hat der Chef den Lager-Standort eingetragen (state.lager.coords), stellt
// das Fahrer-Handy (App offen, Standort geteilt) den Status selbst um:
// innerhalb LAGER_IN_M -> "Am Lager", weiter weg als LAGER_OUT_M ->
// "Unterwegs" (Abstand dazwischen gegen Hin- und Herspringen). Umgestellt
// wird nur beim WECHSEL der Zone -- stellt der Fahrer oder Chef von Hand
// um, bleibt das, bis er die Zone wirklich wechselt. Beim ersten Standort
// nach dem Öffnen wird ein gerade (< 15 Min.) von Hand gesetzter Status
// nicht überschrieben. Ein vom Chef/Fahrer gewähltes Ziel bleibt erhalten,
// wenn der Status schon "Unterwegs" ist.
const LAGER_IN_M = 250, LAGER_OUT_M = 450;
let geoZone = null, autoBusy = false;
async function autoDriverStatus(pos){
  const lc = state.lager && state.lager.coords;
  if(!lc || !geoName || autoBusy || (pos.acc && pos.acc > 300)) return;
  const d = distM([pos.lat, pos.lon], [lc.lat, lc.lon]);
  const zone = d <= LAGER_IN_M ? 'in' : d >= LAGER_OUT_M ? 'out' : null;
  if(!zone || zone===geoZone) return;
  const first = geoZone===null;
  geoZone = zone;
  const want = zone==='in' ? 'lager' : 'unterwegs';
  const cur = state.driverStatus[geoName];
  if(cur && cur.status===want) return;
  if(first && cur && cur.ts && Date.now()-cur.ts < 15*60*1000) return;
  autoBusy = true;
  try{
    await loadShared();  // frisch laden, damit nichts Neueres überschrieben wird
    const c2 = state.driverStatus[geoName];
    if(!geoName || (c2 && c2.status===want)) return;
    state.driverStatus[geoName] = {status:want, ziel:null, by:null, time:nowStr(), ts:Date.now(), auto:true};
    await saveShared();
    const ae = document.activeElement;
    if(state.loggedIn && !(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))) render();

// ---- Routen auf der Chef-Karte ----------------------------------------
// Für jeden Fahrer, der "Unterwegs" zu einem Bauvorhaben (mit Koordinaten)
// ist und seinen Standort teilt, zeichnet die Karte die Straßen-Route von
// seiner Position zum Bauvorhaben, mit Fahrzeit + km. Quelle: freier
// OSRM-Routendienst (OpenStreetMap, kein Schlüssel nötig; Google-Routen
// direkt in der Karte bräuchten ein kostenpflichtiges Google-Konto).
// Neu berechnet nur, wenn sich der LKW > 150 m bewegt hat (höchstens alle
// 20 s je Fahrer). Klappt der Dienst nicht, bleibt eine gestrichelte
// Luftlinie. Im Popup zusätzlich "Route in Google Maps".
const ROUTE_URL = 'https://router.project-osrm.org/route/v1/driving/';
let routeLayer = null;
const routeCache = {};  // Name -> {ziel, line, from, routedFrom, info:{min,km}, at, fetching}
function routeTarget(n){
  const ds = state.driverStatus[n];
  if(!ds || ds.status!=='unterwegs' || !ds.ziel) return null;
  const p = state.projects.find(x=>x.id===ds.ziel);
  return p && p.coords ? p : null;
}
function distM(a, b){
  const R = 6371000, toR = x=>x*Math.PI/180;
  const dLat = toR(b[0]-a[0]), dLon = toR(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function routeInfoText(info){
  const km = info.km < 10 ? info.km.toFixed(1) : String(Math.round(info.km));
  return t('routeEta', {min:info.min, km: state.lang==='en' ? km : km.replace('.', ',')});
}
function updateRoutes(list){
  if(!routeLayer) routeLayer = L.layerGroup().addTo(bvMap);
  const active = new Set();
  list.forEach(([n,v])=>{
    const p = routeTarget(n);
    if(!p) return;
    active.add(n);
    const from = [v.lat, v.lon], to = [p.coords.lat, p.coords.lon];
    let c = routeCache[n];
    if(c && c.ziel!==p.id){ routeLayer.removeLayer(c.line); c = null; }
    if(!c){
      c = routeCache[n] = {ziel:p.id, from, routedFrom:null, info:null, at:0, fetching:false,
        line: L.polyline([from, to], {color:'#0069B3', weight:5, opacity:0.8, dashArray:'6 9'}).addTo(routeLayer)};
    }
    c.from = from;
    if(!c.routedFrom) c.line.setLatLngs([from, to]);  // noch keine Straßen-Route: Luftlinie
    const due = Date.now()-c.at > 20000;
    if(!c.fetching && due && (!c.routedFrom || distM(c.routedFrom, from) > 150)) fetchRoute(n, c, from, to);
  });
  Object.keys(routeCache).forEach(n=>{ if(!active.has(n)){ routeLayer.removeLayer(routeCache[n].line); delete routeCache[n]; } });
}
async function fetchRoute(n, c, from, to){
  c.fetching = true; c.at = Date.now();
  try{
    const r = await fetch(`${ROUTE_URL}${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`);
    const j = await r.json();
    if(routeCache[n]!==c || !j || j.code!=='Ok' || !j.routes || !j.routes[0]) return;
    const rt = j.routes[0];
    c.line.setLatLngs(rt.geometry.coordinates.map(([lon,lat])=>[lat,lon]));
    c.line.setStyle({dashArray:null});
    c.info = {min:Math.max(1, Math.round(rt.duration/60)), km:rt.distance/1000};
    c.routedFrom = from;
    const m = posMarkers[n], v = state.positions[n];
    if(m && v) m.setPopupContent(truckPopupHTML(n, v));
    document.querySelectorAll('.pos-chip').forEach(b=>{ if(b.dataset.name===n) b.innerHTML = posChipText(n, v); });
  }catch(e){ console.warn('Route nicht berechenbar', e); }
  finally{ c.fetching = false; }
}
function posChipText(n, v){
  const p = routeTarget(n), c = routeCache[n];
  return `🚚 ${escapeHtml(n)} · ${posAgoText(v.ts)}${p? ` · → BV ${p.id}${c && c.info? ` (${routeInfoText(c.info)})`:''}`:''}`;
}
// Marker je Fahrer bleiben bestehen und werden nur verschoben/beschriftet,
// damit ein offenes Popup das 4-s-Neuzeichnen übersteht.
function updateTruckMarkers(){
  if(!posLayer) posLayer = L.layerGroup().addTo(bvMap);
  const list = state.role==='chef' ? livePositions() : [];
  const keep = new Set(list.map(([n])=>n));
  Object.keys(posMarkers).forEach(n=>{ if(!keep.has(n)){ posLayer.removeLayer(posMarkers[n]); delete posMarkers[n]; } });
  list.forEach(([n,v])=>{
    const ll = [v.lat, v.lon];
    const live = Date.now()-v.ts < POS_LIVE_MS;
    const tip = `${ic('truck')} ${escapeHtml(n)} · ${posAgoText(v.ts)}`;
    let m = posMarkers[n];
    if(!m){
      m = L.marker(ll, {icon:L.divIcon({className:'truck-pin', html:ic('truck'), iconSize:[34,34], iconAnchor:[17,17]}), zIndexOffset:1000})
        .bindTooltip(tip, {permanent:true, direction:'right', offset:[14,0], className:'bv-tip truck-tip'})
        .bindPopup(truckPopupHTML(n, v))
        .addTo(posLayer);
      posMarkers[n] = m;
    } else {
      m.setLatLng(ll); m.setTooltipContent(tip); m.setPopupContent(truckPopupHTML(n, v));
    }
    m.setOpacity(live ? 1 : 0.55);
  });
  updateRoutes(list);
  return list.map(([n,v])=>[n, [v.lat, v.lon]]);
}

let toastTimer = null, toastLeft = 0, toastStart = 0;
function showToast(msg){

function startToastTimer(){
  clearTimeout(toastTimer); toastStart = Date.now();

// Weiches Scrollen nur, wenn am Gerät keine reduzierte Bewegung eingestellt ist
const REDUCE_MOTION = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : {matches:false};
function scrollBehavior(){ return REDUCE_MOTION.matches ? 'auto' : 'smooth'; }

// Fenster (Teile-Popup, Bestellschein-Entwurf, Abholung, Bestätigung) beim
// ÖFFNEN kurz einblenden. Nicht per CSS-Animation, weil render() das Fenster
// bei jeder Änderung darin (+/−, Chips) neu baut – dann würde es jedes Mal
// neu hereingleiten. Gemerkt wird, welches Fenster offen war (data-action
// des Hintergrunds); nur bei einem Wechsel wird animiert. Schließen: sofort.
let overlayOpenKeys = [];
function animateOverlayOnOpen(){
  const ovs = [...document.querySelectorAll('#app > .overlay')];
  ovs.forEach(ov=>{
    if(overlayOpenKeys.includes(ov.dataset.action) || !ov.animate) return;
    const reduce = REDUCE_MOTION.matches;
    ov.animate([{opacity:0},{opacity:1}], {duration:200, easing:'ease-out'});
    const pop = ov.querySelector('.item-popup');
    const sheet = pop || ov.querySelector('.drawer');
    if(sheet){
      const frames = reduce ? [{opacity:0},{opacity:1}]
        : pop ? [{opacity:0, transform:'scale(0.96)'},{opacity:1, transform:'scale(1)'}]
              : [{transform:'translateY(100%)'},{transform:'translateY(0)'}];
      sheet.animate(frames, pop ? {duration:180, easing:'cubic-bezier(0.23,1,0.32,1)'}
                                : {duration:280, easing:'cubic-bezier(0.32,0.72,0,1)'});
    }
  });
  overlayOpenKeys = ovs.map(ov=>ov.dataset.action);
}

function jumpTo(id){
  requestAnimationFrame(()=>{
    const el = document.getElementById(id);
    if(!el){ window.scrollTo({top:0, behavior:scrollBehavior()}); return; }
    const hd = document.querySelector('header.chrome');
    const top = el.getBoundingClientRect().top + window.scrollY - (hd? hd.offsetHeight : 0) - 12;
    window.scrollTo({top: Math.max(0, top), behavior:scrollBehavior()});
    el.classList.remove('jump-flash'); void el.offsetWidth; el.classList.add('jump-flash');
  });
}

        <h3 style="margin-top:18px;font-size:14px;">${formatDateDE(dt)}</h3>
        ${grouped[dt].map(e=>{
          const proj = state.projects.find(p=>p.id===e.projekt);

          <div class="order-card">
            <div class="order-head">
              <div><div class="no">${e.time}</div><div class="site">${proj? `BV ${proj.id} – ${proj.name}` : ''}</div></div>

            ${state.calUnlocked? `<div style="display:flex;gap:8px;margin-top:8px;">

          </div>
        `;
        }).join('')}
      `).join('') : `<div class="empty-state">${t('lkwCalEmpty')}</div>`}
    </main>
  </div>`;

function ic(name, cls){
  const body = SYM_ICONS[name]; if(!body) return '';
  return `<svg class="ic ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
}
const EMO = {
  '📍':'map-pin', '🗺':'map', '🚚':'truck', '🏭':'warehouse', '📅':'calendar-days', '🗓':'calendar-range',
  '🔒':'lock', '🔐':'lock-keyhole', '🔑':'key-round', '⚠':'triangle-alert', '📶':'wifi-off', '🧭':'navigation',
  '✏':'pencil', '🔄':'refresh-cw', '↻':'refresh-cw', '🖨':'printer', '👍':'circle-check', '🔁':'repeat',
  '⬆':'upload', '⭐':'star', '🏗':'building-2', '🏁':'flag', '🔔':'bell', '📐':'drafting-compass',
  '⚖':'weight', '🌐':'globe', '✓':'check', '✗':'x', '📦':'package', '📋':'clipboard-list', '📄':'file-text',
  '🗑':'trash-2', '🏠':'house', '👥':'users', '↩':'undo-2', '🔴':['circle-alert','ic-red'], '☰':'menu',
};
const EMO_RE = new RegExp('(' + Object.keys(EMO).join('|') + ')\\uFE0F?', 'gu');
function emoIcon(ch){ const v = EMO[ch]; return Array.isArray(v) ? ic(v[0], v[1]) : ic(v); }
// Emojis aus Texten entfernen (Push-Nachrichten, Auswahllisten)
function stripEmo(str){ return String(str).replace(EMO_RE, '').replace(/^\s+/, '').replace(/\s{2,}/g, ' '); }
// Alle Textstellen unter root: Emoji -> Symbol. Attribute bleiben unberührt.
function iconize(root){
  if(!root) return;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const hits = [];
  for(let n; (n = tw.nextNode());){ EMO_RE.lastIndex = 0; if(EMO_RE.test(n.nodeValue)) hits.push(n); }
  hits.forEach(n=>{
    const par = n.parentNode; if(!par) return;
    if(/^(OPTION|TEXTAREA|SCRIPT|STYLE|TITLE)$/.test(par.nodeName)){ n.nodeValue = stripEmo(n.nodeValue); return; }
    const parts = n.nodeValue.split(EMO_RE);
    const frag = document.createDocumentFragment();
    parts.forEach((part, i)=>{
      if(i % 2){ const tpl = document.createElement('template'); tpl.innerHTML = emoIcon(part); frag.appendChild(tpl.content); }
      else if(part) frag.appendChild(document.createTextNode(part));
    });
    par.replaceChild(frag, n);
  });
}

  renderView();

function openOrderReview(){
  if(cartCount()===0) return;
  let ort='', coords=null, projektId=null;
  const sel = document.getElementById('projektSelect');
  if(sel && sel.value!=='_frei'){
    const p = state.projects.find(x=>String(x.id)===sel.value);
    if(p){ ort = p.name+', '+p.adresse; coords = p.coords || null; projektId = p.id; }
  }
  if(!projektId){
    const ortInput = document.getElementById('baustelleOrtInput');
    ort = (ortInput? ortInput.value : state.baustelleOrt).trim();
    coords = state.baustelleCoords || null;
    if(!ort){
      const w = document.getElementById('ortWarnArea');
      if(w) w.innerHTML = `<div class="warn">${t('warnOrt')}</div>`;
      return;
    }
  }
  state.orderReview = {ort, coords, projektId};
  render();
}

async function submitOrderFinal(){
  if(!state.orderReview) return;
  const {ort, coords, projektId} = state.orderReview;
  const wunsch = state.orderReview.wunsch || 'normal';
  const wd = document.getElementById('wunschDate');
  let bis = wunsch==='morgen' ? addDaysISO(todayISO(), 1) : wunsch==='datum' ? ((wd && wd.value) || state.orderReview.bis || null) : null;
  const items = Object.entries(state.cart).filter(([id,q])=>q>0).map(([id,q])=>{
    const it = CATALOG.find(c=>c.id===id);
    return {id:it.id, name:it.name, unit:it.unit, qty:q, kg:it.kg};
  });
  if(items.length===0){ state.orderReview=null; render(); return; }

  const order = {
    id: state.orderCounter++,
    baustelle: ort,
    coords,
    projekt: projektId,
    person: state.name,
    items,
    status:'Neu',
    time: new Date().toLocaleString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),
  };
  if(wunsch!=='normal' && (wunsch!=='datum' || bis)) order.wunsch = wunsch;
  if(bis && order.wunsch) order.bis = bis;
  state.orders.push(order);
  state.cart = {};
  state.confirmOrder = order;
  state.orderReview = null;
  if(!projektId) state.baustelleOrt = ort;
  await saveShared();
  render();
  notify({roles:['lager','chef']}, order.wunsch==='dringend' ? 'nUrgentT' : 'nNewOrderT', 'nNewOrderB', {id:order.id, ort:order.baustelle, person:order.person});
}

document.getElementById('app').addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el){
    if((state.menuOpen || state.langMenuOpen) && !e.target.closest('.menu-wrap')){
      state.menuOpen=false; state.langMenuOpen=false; render();
    }
    return;
  }
  const action = el.dataset.action;

  // Anmeldung Stufe 1: Name + eigenes Passwort prüfen, dann je nach
  // Anzahl der zugewiesenen Rollen direkt rein oder Rolle wählen lassen.
  if(action==='login'){
    if(state.loginBusy) return;
    const nameSel = document.getElementById('loginName');
    const pwInput = document.getElementById('loginPw');
    const person = loginPeople().find(p=>String(p.id)===(nameSel? nameSel.value : ''));
    if(!person){ state.loginWarn=t('warnSelectName'); render(); return; }
    const pw = pwInput? pwInput.value.trim() : '';
    state.name = person.name;
    if(!pw){ state.loginWarn=t('warnWrongPw'); render(); return; }
    state.loginBusy = true; state.loginWarn=''; render();
    let error = null;
    try{ ({ error } = await supabaseClient.auth.signInWithPassword({email:authEmail(person.id), password:PW_PREFIX+pw})); }
    catch(e){ error = e; }
    state.loginBusy = false;
    if(error){
      state.loginWarn = /invalid|credentials|password/i.test(String(error.message||'')) ? t('warnWrongPw') : t('warnLoginNet');
      render(); return;
    }
    state.authed = true;
