<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerüst-Bestellung</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0069B3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gerüst-Bestellung">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#F2F4F6; --card:#FFFFFF; --ink:#17242D; --muted:#64748B; --line:#E2E8F0; --line-strong:#CBD5E1;
    --accent:#0069B3; --accent-dark:#00538D; --accent-soft:#E1F0FA;
    /* Feste Marken-Füllfarbe für Knöpfe mit weißer Schrift -- bleibt in
       beiden Modi kräftig genug, damit der Text lesbar bleibt (--accent
       wird im Dunkelmodus bewusst heller, siehe unten). */
    --accent-solid:#0069B3;
    --surface-2:#F1F4F6; --icon-tile:#FFF9C4; --zebra:#F6F8FA;
    --disabled-bg:#CBD5E1; --disabled-fg:#F8FAFC;
    --amber:#F59E0B; --blue:#2563EB; --green:#16A34A; --red:#DC2626;
    --shadow:0 6px 18px rgba(23,36,45,0.07);
    /* Alias-Namen aus früheren Design-Ständen, die noch in Inline-Styles
       vorkommen -- zeigen bewusst auf die Grundfarben, damit sie sich im
       Dunkelmodus automatisch mit anpassen. */
    --steel:var(--muted); --concrete:var(--line); --concrete-2:var(--line-strong);
    --orange:var(--accent); --orange-dark:var(--accent-dark); --yellow:#F59E0B;
    --white:#FFFFFF; --asphalt:var(--ink);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0C161F; --card:#122130; --ink:#EAF1F6; --muted:#93A5B2; --line:#233242; --line-strong:#324457;
      --accent:#5CAEEA; --accent-dark:#8FCBFA; --accent-soft:rgba(92,174,234,0.14);
      --surface-2:#18262F; --icon-tile:rgba(255,238,0,0.12); --zebra:#0F1D29;
      --disabled-bg:#233242; --disabled-fg:#5B6B79;
      --red:#F87171; --green:#4ADE80;
      --shadow:0 1px 2px rgba(0,0,0,0.35),0 10px 26px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .login-logo{display:block;margin:0 auto 14px auto;width:110px;border-radius:10px;}

  /* Menü (3 Striche) + Logo, sichtbar auch ohne Anmeldung */
  .top-nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
  .top-nav.on-dark{background:transparent;}
  .top-nav.on-light{background:var(--card);border-bottom:1px solid var(--line);}
  .top-nav-logo{height:28px;width:auto;border-radius:6px;}
  .menu-wrap{position:relative;}
  .menu-btn{background:rgba(255,255,255,0.18);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:19px;cursor:pointer;line-height:1;}
  .top-nav.on-light .menu-btn{background:var(--surface-2);color:var(--ink);}
  .menu-dropdown{position:absolute;top:46px;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:220px;overflow:hidden;z-index:41;}
  .menu-dropdown button{display:block;width:100%;text-align:left;background:none;border:none;padding:13px 14px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;}
  .menu-dropdown button:active{background:var(--accent-soft);}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0069B3 0%,#00538D 60%,#003A63 100%);padding:76px 20px 20px 20px;}
  .login-card{background:var(--card);border-radius:20px;border-top:6px solid #FFEE00;padding:30px 26px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .login-card h1{font-size:22px;margin:0 0 4px 0;text-align:center;}
  .login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;}
  .role-grid{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .role-btn{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--ink);text-align:left;}
  .role-btn svg{width:24px;height:24px;flex:none;color:var(--accent);}
  .role-btn small{display:block;font-family:'Inter';font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;}
  .role-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
  .warn{color:var(--red);font-size:12.5px;margin-top:8px;}

  header.chrome{background:var(--card);color:var(--ink);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #FFEE00;position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{height:34px;width:auto;flex:none;border-radius:6px;}
  .brand h1{font-size:17px;margin:0;color:var(--ink);}
  .brand span{font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);letter-spacing:0;}
  .who{text-align:right;font-size:11.5px;color:var(--muted);}
  .who b{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .who a{color:var(--accent);text-decoration:none;font-size:11px;cursor:pointer;}

  main{flex:1;padding:20px 16px 110px 16px;max-width:720px;margin:0 auto;width:100%;}
  .view-title{margin:4px 0 2px 0;font-size:24px;}
  .view-sub{margin:0 0 18px 0;color:var(--muted);font-size:13.5px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:var(--card);color:var(--ink);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .loc-btn{display:block;width:100%;background:var(--accent-soft);border:none;color:var(--accent-dark);border-radius:12px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;font-family:'Inter',sans-serif;}
  .maps-btn{display:block;text-align:center;background:var(--accent-soft);border:none;color:var(--accent-dark);border-radius:10px;padding:9px;font-size:12.5px;font-weight:600;text-decoration:none;margin-top:10px;}
  .addr-sug{background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;}
  .addr-sug div{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .addr-sug div:last-child{border-bottom:none;}
  .addr-sug div:active{background:var(--accent-soft);}
  .katalog-search{width:100%;border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14px;margin:0 0 12px 0;background:var(--card);color:var(--ink);font-family:inherit;}
  .katalog-search:focus{outline:none;border-color:var(--accent);}

  /* Bestellliste als Tabelle (kein Warenkorb) -- Name antippen+halten
     zeigt ein Detail-Popup, praktisch sobald echte Teile-Fotos da sind. */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:10px;margin-bottom:6px;}
  table.order-table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);}
  .order-table thead th{text-align:left;font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1.5px solid var(--line-strong);background:var(--zebra);}
  .order-table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .order-table tbody tr:last-child td{border-bottom:none;}
  .order-table tbody tr.row-alt{background:var(--zebra);}
  .order-table tbody tr.cat-row td{background:var(--accent-soft);color:var(--accent-dark);font-weight:700;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;padding:7px 12px;cursor:pointer;-webkit-user-select:none;user-select:none;}
  .order-table tbody tr.cat-row:active td{background:var(--accent-soft);filter:brightness(0.95);}
  .cat-chevron{display:inline-block;width:14px;}
  .cat-count{color:var(--accent-dark);opacity:0.65;font-weight:600;text-transform:none;letter-spacing:0;}
  .t-name{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  .t-name:active{background:var(--accent-soft);}
  .t-icon{width:22px;height:22px;color:var(--accent);flex:none;}
  .t-unit{color:var(--muted);font-size:12.5px;}
  .qty-ctl{display:flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden;flex:none;background:var(--card);}
  .qty-ctl button{background:none;border:none;width:30px;height:34px;font-size:16px;line-height:1;cursor:pointer;color:var(--muted);}
  .qty-ctl button:active{background:var(--accent-soft);color:var(--accent-dark);}
  .qty-ctl .qty-val{width:32px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong);}

  /* Detail-Popup pro Teil (langes Drücken auf den Namen) */
  .overlay-center{align-items:center;}
  .item-popup{background:var(--card);border-radius:20px;padding:24px;max-width:300px;width:88%;margin:auto;text-align:center;}
  .item-popup-photo{aspect-ratio:4/3;border:1.5px dashed var(--line-strong);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accent);background:var(--zebra);margin-bottom:14px;}
  .item-popup-photo svg{width:40px;height:40px;}
  .item-popup-photo span{font-size:11px;color:var(--muted);letter-spacing:0.03em;}
  .item-popup-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;}
  .item-popup-unit{font-size:12.5px;color:var(--muted);margin:2px 0 14px 0;}
  .item-popup .qty-ctl{margin:0 auto;}

  /* Bestellung prüfen (Bestellschein-Vorschau vor dem Abschicken) */
  .review-head{padding:4px 4px 14px 4px;border-bottom:2px dashed var(--line-strong);margin-bottom:14px;}
  .review-head .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
  .review-head h3{font-size:19px;margin-top:4px;}
  .review-meta{font-size:13px;color:var(--muted);margin:0 4px 14px 4px;}
  .review-meta b{color:var(--ink);}
  .review-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:18px;}
  .review-table th{text-align:left;font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);padding:8px 4px;border-bottom:1.5px solid var(--line-strong);}
  .review-table th.num,.review-table td.num{text-align:right;}
  .review-table td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}

  .order-footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -6px 20px rgba(23,36,45,0.08);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);z-index:15;max-width:720px;margin:0 auto;border-radius:16px 16px 0 0;}
  .submit-btn{background:#FFEE00;color:#0B2A42;border:none;padding:12px 22px;border-radius:999px;font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:700;cursor:pointer;}
  .submit-btn:disabled{background:var(--disabled-bg);color:var(--disabled-fg);cursor:not-allowed;}

  /* Bestätigungs-Ticket */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;}
  .drawer{background:var(--card);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:20px;max-height:82vh;overflow-y:auto;}
  .ticket{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:0;max-width:340px;margin:auto;position:relative;overflow:hidden;}
  .ticket-top{padding:20px 20px 14px 20px;border-bottom:2px dashed var(--line);}
  .ticket-body{padding:14px 20px 20px 20px;}
  .stamp{position:absolute;top:14px;right:16px;border:3px solid var(--accent);color:var(--accent);border-radius:50%;width:74px;height:74px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:700;text-align:center;transform:rotate(-10deg);line-height:1.15;}
  .ticket-order-no{font-size:28px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .ticket-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;}
  .ticket-row span:first-child{color:var(--muted);}

  /* Bestellkarten (Lager/Fahrer/Chef) */
  .order-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;}
  .order-card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:#94A3B8;}
  .order-card.st-Neu::before{background:#94A3B8;}
  .order-card.st-InBearbeitung::before{background:var(--amber);}
  .order-card.st-BereitzurAbholung::before{background:var(--accent);}
  .order-card.st-Beladen::before{background:#7C3AED;}
  .order-card.st-Unterwegs::before{background:var(--blue);}
  .order-card.st-Geliefert::before{background:var(--green);}
  .order-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .order-head .no{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;}
  .order-head .site{font-size:12.5px;color:var(--muted);}
  .status-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .status-badge.st-Neu{background:#EEF2F6;color:#475569;}
  .status-badge.st-InBearbeitung{background:#FEF3C7;color:#92400E;}
  .status-badge.st-BereitzurAbholung{background:var(--accent-soft);color:var(--accent-dark);}
  .status-badge.st-Beladen{background:#EDE9FE;color:#5B21B6;}
  .status-badge.st-Unterwegs{background:#DBEAFE;color:#1D4ED8;}
  .status-badge.st-Geliefert{background:#DCFCE7;color:#166534;}
  .order-items{font-size:13px;color:var(--ink);margin:8px 0;line-height:1.55;}
  .order-items li{margin-left:18px;}
  .order-time{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  .advance-btn{width:100%;background:#FFEE00;color:#0B2A42;border:none;padding:12px;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:10px;}
  .advance-btn:active{background:var(--accent-solid);color:#fff;}
  .done-label{font-size:12.5px;color:var(--green);font-weight:700;margin-top:8px;}
  .empty-state{text-align:center;color:var(--muted);padding:44px 10px;font-size:13.5px;}
  .waiting-note{font-size:12px;color:#92400E;background:#FEF3C7;padding:10px 12px;border-radius:12px;margin-bottom:12px;}
  .mine-section{margin-top:28px;border-top:2px dashed var(--line);padding-top:18px;}
  .mine-section h3{font-size:15px;margin:0 0 10px 0;}
  .refresh-row{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .refresh-btn{background:var(--card);border:1.5px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:11.5px;cursor:pointer;}
  .loading{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px;}

  /* Segmented control (Lager) */
  .seg-control{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin:12px 0 16px 0;}
  .seg-control button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);}
  .seg-control button.active{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(23,36,45,0.12);}

  /* Inventur */
  .inv-list{display:flex;flex-direction:column;gap:10px;}
  .inv-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);}
  .inv-icon{width:40px;height:40px;background:var(--icon-tile);border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
  .inv-icon svg{width:22px;height:22px;}
  .inv-main{flex:1;}
  .inv-name{font-size:14px;font-weight:600;}
  .inv-qty{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .inv-qty.stock-low{color:#B45309;font-weight:700;}
  .inv-qty.stock-missing{color:var(--red);font-weight:700;}
  .inv-qty .tag{margin-left:6px;background:var(--surface-2);border-radius:999px;padding:2px 8px;font-size:10.5px;}
  .inv-actions{display:flex;gap:5px;flex:none;}
  .inv-actions button{background:var(--surface-2);color:var(--ink);border:none;border-radius:9px;width:32px;height:32px;font-size:15px;font-weight:700;cursor:pointer;}
  .inv-actions button:active{background:var(--accent-solid);color:#fff;}
  .inv-restock{width:auto !important;padding:0 10px !important;font-size:11.5px !important;font-family:'Inter',sans-serif !important;}

  /* Chef */
  .stat-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .stat-chip{background:var(--card);border-radius:14px;padding:10px 14px;text-align:center;min-width:74px;box-shadow:var(--shadow);}
  .stat-chip b{display:block;font-family:'Space Grotesk',sans-serif;font-size:20px;}
  .stat-chip span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}

  /* PC / breite Bildschirme */
  @media (min-width: 900px){
    main{max-width:900px;}
    .order-footer{max-width:900px;}
    .inv-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
  }

  /* Projekt-Farben: Status-Punkt + Auswahl-Kacheln auf den Bauvorhaben-
     Karten. Immer ein sichtbarer Rand, damit z.B. "schwarz" auch im
     Dunkelmodus nicht mit dem Hintergrund verschmilzt. */
  .proj-color-badge{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--muted);}
  .proj-color-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-strong);background:transparent;flex-shrink:0;}
  .proj-color-picker{display:flex;gap:8px;margin-top:8px;}
  .proj-color-swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);cursor:pointer;padding:0;}
  .proj-color-swatch.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink);}
  .proj-color-swatch.proj-color-none{background:transparent;position:relative;}
  .proj-color-swatch.proj-color-none::after{content:'';position:absolute;left:3px;right:3px;top:50%;height:2px;background:var(--line-strong);transform:rotate(45deg);}

  /* Personal: Rollen-Chips (mehrere pro Person an-/abwählbar) */
  .role-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .role-chip{border:1.5px solid var(--line-strong);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .role-chip.active{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff;}

  /* Fahrer-Status: jeder Fahrer setzt seinen eigenen Status, Chef/Lager
     sehen die Liste aller gesetzten Status. */
  .driver-status-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .driver-status-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
  .driver-status-name{font-weight:700;font-size:13.5px;}

  /* Lieferschein-Druck: immer weißer Hintergrund/schwarze Schrift,
     unabhängig vom Dunkelmodus -- feste Farben statt Variablen. */
  .print-btn{background:none;border:1.5px solid var(--line-strong);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:11.5px;cursor:pointer;margin-top:8px;}
  #printArea{display:none;}
  #printArea .ls-logo{height:42px;margin-bottom:10px;}

function findEmployee(name){ return state.employees.find(e=>e.name===name); }
function employeeRoles(name){
  const e = findEmployee(name);
  return e ? ROLES.filter(r=>e.roles.includes(r)) : [];
}

// Angemeldet bleiben: Die Anmeldung wird auf dem Handy gespeichert und
// gilt bis zum Ende des Tages – morgens einmal anmelden reicht.
const SESSION_KEY = 'geruest-session';
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({name:state.name, role:state.role, day:new Date().toDateString()})); }catch(e){}
}
function restoreSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if(s && s.day===new Date().toDateString() && s.name && s.role){
      state.name = s.name; state.authName = s.name; state.role = s.role; state.loggedIn = true;
    }
  }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
// Nach jedem Laden prüfen, ob die gespeicherte Anmeldung noch gültig ist
// (Chef könnte den Mitarbeiter entfernt oder ihm die Rolle entzogen haben).
function enforceSession(){
  if(!state.loggedIn) return;
  if(!employeeRoles(state.name).includes(state.role)){
    state.loggedIn=false; state.role=null; state.authName=null; state.askChefPw=false;
    clearSession();
  }
}

function t(key, vars){
  let s = (T[state.lang] && T[state.lang][key]) ?? T.de[key] ?? key;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.replace(new RegExp('\\{'+k+'\\}','g'), vars[k]); });
  return s;
}
function catName(cat){ return t('cat_'+cat.id); }
function itemName(it){ return t('item_'+it.id); }
function unitLabel(u){ return u==='Stk' ? t('unitStk') : u; }
// Bestellte Positionen sind mit deutschem Namen/Einheit gespeichert
// (Roh-Datensatz, sprachunabhängig) -- zur Anzeige immer über die
// aktuelle Sprache auflösen, mit Rückfall auf den gespeicherten Text
// falls das Teil später aus dem Katalog entfernt wurde.
function resolvedItem(i){
  const cat = CATALOG.find(c=>c.id===i.id);
  return cat ? {name:itemName(cat), unit:unitLabel(cat.unit)} : {name:i.name, unit:i.unit};
}
function statusLabel(status){ return t('status'+slug(status)); }
function stepLabel(status){ return t('step'+slug(status)); }

// Für den Lieferschein: Stückzahl in ganze Pakete + Rest umrechnen
// (z.B. 32 Stk bei 10 Stk/Paket -> "3 Pakete und 2 Stk"), statt einer
// unpraktischen Kommazahl wie "3,2 Pakete". Teile ohne pkg-Feld liefern
// null (werden ganz normal nur in Stück angezeigt).
function formatPackages(qty, it){
  if(!it || !it.pkg || qty<=0) return null;
  const pkgCount = Math.floor(qty/it.pkg);
  const rest = qty % it.pkg;
  if(pkgCount===0) return null;
  const pkgWord = pkgCount===1 ? t('pkgOne') : t('pkgMany');
  return rest>0
    ? `${pkgCount} ${pkgWord} ${t('pkgAnd')} ${rest} ${unitLabel(it.unit)}`
    : `${pkgCount} ${pkgWord}`;
}

async function loadShared(){
  if(!supabaseClient){
    document.getElementById('app').innerHTML =
      `<div class="loading">${t('offlineError')}</div>`;
    throw new Error('Supabase-Bibliothek nicht geladen');
  }
  try{
    const { data, error } = await supabaseClient
      .from('app_state')
      .select('value')
      .eq('key', STORAGE_KEY)
      .maybeSingle();
    if(error) throw error;
    if(data && data.value){
      state.orders = data.value.orders || [];
      state.orderCounter = data.value.counter || 1001;
      state.inventory = data.value.inventory || {...DEFAULT_INVENTORY};
      state.projects = data.value.projects || [];
      state.projektCounter = data.value.projektCounter || 101;
      state.calendarEntries = data.value.calendarEntries || [];
      state.calCounter = data.value.calCounter || 1;
      state.driverStatus = data.value.driverStatus || {};
      state.plannedDeliveries = data.value.plannedDeliveries || [];
      state.planCounter = data.value.planCounter || 1;
      state.lkwEntries = data.value.lkwEntries || [];
      state.lkwCounter = data.value.lkwCounter || 1;
      if(Array.isArray(data.value.employees) && data.value.employees.length){
        state.employees = data.value.employees;
        state.empCounter = data.value.empCounter || (Math.max(...state.employees.map(e=>e.id))+1);
      } else {
        // Älterer Datensatz ohne Mitarbeiterliste: einmalig mit der
        // Start-Befüllung anlegen, damit sich überhaupt jemand anmelden kann.
        state.employees = DEFAULT_EMPLOYEES.map(e=>({...e, roles:[...e.roles]}));
        state.empCounter = DEFAULT_EMPLOYEES.length+1;
        await saveShared();
      }
    } else {
      state.inventory = {...DEFAULT_INVENTORY};
      state.employees = DEFAULT_EMPLOYEES.map(e=>({...e, roles:[...e.roles]}));
      state.empCounter = DEFAULT_EMPLOYEES.length+1;
      await saveShared();
    }
  }catch(e){
    console.error('Laden fehlgeschlagen', e);
    state.inventory = {...DEFAULT_INVENTORY};
    if(!state.employees.length) state.employees = DEFAULT_EMPLOYEES.map(e=>({...e, roles:[...e.roles]}));
  }
  enforceSession();
}
async function saveShared(){
  try{
    const { error } = await supabaseClient
      .from('app_state')
      .upsert({
        key: STORAGE_KEY,
        value: {orders:state.orders, counter:state.orderCounter, inventory:state.inventory,
                projects:state.projects, projektCounter:state.projektCounter,
                calendarEntries:state.calendarEntries, calCounter:state.calCounter,
                driverStatus:state.driverStatus,
                plannedDeliveries:state.plannedDeliveries, planCounter:state.planCounter,
                lkwEntries:state.lkwEntries, lkwCounter:state.lkwCounter,
                employees:state.employees, empCounter:state.empCounter},
      });
    if(error) throw error;
  }catch(e){ console.error('Speichern fehlgeschlagen', e); }
}

// In eine Rolle einsteigen; Chef verlangt ZUSÄTZLICH das Chef-Passwort.
function enterRole(role){
  if(!employeeRoles(state.authName).includes(role)){ state.loginWarn=t('warnNoRoles'); render(); return; }
  if(role==='chef'){ state.askChefPw=true; state.loginWarn=''; render(); return; }
  state.role = role; state.loggedIn = true; state.loginWarn='';
  saveSession();
  render();
}

// Kategorien starten eingeklappt (Liste soll kurz wirken), "Häufig
// bestellt" startet aufgeklappt. Eine Kategorie mit Teilen im
// aktuellen Warenkorb bleibt immer sichtbar, auch wenn zugeklappt,
// damit man die eigene Auswahl nicht aus den Augen verliert.
function isCatCollapsed(id){
  if(Object.prototype.hasOwnProperty.call(state.collapsedCats, id)) return state.collapsedCats[id];
  return id !== '_fav';
}

function catSectionHTML(id, label, items){
  const hasCartItems = items.some(it=>(state.cart[it.id]||0)>0);
  const open = !isCatCollapsed(id) || hasCartItems;
  let rowIdx = 0;
  const rows = open ? items.map(it=>{ rowIdx++; return catalogRowHTML(it, rowIdx%2===0); }).join('') : '';
  return `<tr class="cat-row" data-action="cat-toggle" data-cat="${id}">
    <td colspan="3"><span class="cat-chevron">${open?'▾':'▸'}</span>${label} <span class="cat-count">(${items.length})</span></td>
  </tr>${rows}`;
}

function catalogHTML(){
  const mine = state.orders.filter(o=>o.person===state.name).sort((a,b)=>b.id-a.id).slice(0,5);
  const count = cartCount();
  const aktive = state.projects.filter(p=>p.aktiv);
  const freiGewaehlt = !aktive.length || state.selProjekt==='_frei';
  const counts = itemOrderCounts();
  const search = state.catalogSearch.trim().toLowerCase();
  const systemItems = SYSTEMS.length>1 ? CATALOG.filter(it=>it.system===state.systemSel) : CATALOG;

  let rows = '';
  let rowIdx = 0;
  if(search){
    const matches = systemItems
      .filter(it=>itemName(it).toLowerCase().includes(search))
      .sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));
    rows = matches.length
      ? matches.map(it=>{ rowIdx++; return catalogRowHTML(it, rowIdx%2===0); }).join('')
      : `<tr><td colspan="3" class="empty-state">${t('searchNoResults')}</td></tr>`;
  } else {
    const favIds = Object.keys(counts)
      .filter(id=>systemItems.some(it=>it.id===id))
      .sort((a,b)=>counts[b]-counts[a])
      .slice(0,5);
    if(favIds.length){
      const favItems = favIds.map(id=>systemItems.find(x=>x.id===id));
      rows += catSectionHTML('_fav', t('favTitle'), favItems);
    }
    CATEGORIES.forEach(cat=>{
      const items = systemItems.filter(it=>it.cat===cat.id).sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));
      if(!items.length) return;
      rows += catSectionHTML(cat.id, catName(cat), items);
    });
  }

  return `<h2 class="view-title">${t('catalogTitle')}</h2>
  <p class="view-sub">${t('catalogSub')}</p>
  ${aktive.length? `<div class="field">
    <label>${t('projektLabel')}</label>
    <select id="projektSelect">
      ${aktive.map(p=>`<option value="${p.id}" ${String(state.selProjekt)===String(p.id)?'selected':''}>BV ${p.id} – ${p.name}</option>`).join('')}
      <option value="_frei" ${state.selProjekt==='_frei'?'selected':''}>${t('projektFreeOption')}</option>
    </select>
  </div>`:''}
  ${freiGewaehlt? `<div class="field">
    <label>${t('ortLabel')}</label>
    <input id="baustelleOrtInput" placeholder="${t('ortPlaceholder')}" value="${state.baustelleOrt}" autocomplete="off">
    <div id="addrSuggestions"></div>
  </div>
  <button class="loc-btn" data-action="use-location">${t('locBtn')}</button>`:''}
  <div id="ortWarnArea"></div>
  ${SYSTEMS.length>1? `<div class="seg-control">${SYSTEMS.map(s=>`<button class="${state.systemSel===s.id?'active':''}" data-action="system-tab" data-sys="${s.id}">${t(s.nameKey)}</button>`).join('')}</div>`:''}
  <input class="katalog-search" id="catalogSearch" placeholder="${t('searchPlaceholder')}" value="${state.catalogSearch.replace(/"/g,'&quot;')}" autocomplete="off">
  <div class="tbl-wrap"><table class="order-table">
    <thead><tr><th>${t('thTeil')}</th><th>${t('thEinheit')}</th><th style="text-align:right;">${t('thMenge')}</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
  <div class="mine-section">
    <h3>${t('mineTitle')}</h3>
    ${mine.length? mine.map(o=>orderCardHTML(o,null)).join('') : `<div class="empty-state" style="padding:20px 0;">${t('mineEmpty')}</div>`}
  </div>
  <div class="order-footer">
    <span>${count? t('footerCount',{n:count}) : t('footerEmpty')}</span>
    <button class="submit-btn" data-action="open-order-review" ${count? '':'disabled'}>${t('reviewBtn')}</button>

// Geplante Lieferungen: Chef legt Bauvorhaben + Datum + Teile im Voraus
// fest (state.plannedDeliveries), getrennt von den dringenden/laufenden
// Bestellungen. Erscheint als eigene, nach Datum sortierte Liste bei
// Lager und Fahrer (rein lesend), beim Chef zusätzlich mit Lösch-Knopf.
function plannedDeliveryCardHTML(pd, editable){
  const proj = state.projects.find(p=>p.id===pd.projekt);
  const projLabel = proj ? `BV ${proj.id} – ${proj.name}` : '';
  const itemsHtml = pd.items.map(i=>{
    const r = resolvedItem(i);
    return `<li>${i.qty} ${r.unit} — ${r.name}</li>`;
  }).join('');
  return `<div class="order-card">
    <div class="order-head">
      <div><div class="no">${formatDateDE(pd.date)}</div><div class="site">${projLabel}</div></div>
    </div>
    <ul class="order-items">${itemsHtml}</ul>
    <div class="order-time">${t('plGeplantVonPrefix')} ${pd.person}</div>
    ${editable? `<button class="refresh-btn" data-action="delete-planned" data-id="${pd.id}" style="margin-top:10px;">${t('plDeleteBtn')}</button>`:''}
  </div>`;
}

function geplantListHTML(editable){
  const sorted = [...state.plannedDeliveries].sort((a,b)=> a.date<b.date? -1 : a.date>b.date? 1 : a.id-b.id);
  if(!sorted.length) return `<div class="empty-state">${t('plEmpty')}</div>`;
  return sorted.map(pd=>plannedDeliveryCardHTML(pd, editable)).join('');
}

// Status-Farbe pro Bauvorhaben (nur vom Chef änderbar, Fahrer sieht sie
// nur): grün = "da muss was hin" (Lieferung nötig), hellblau = "da muss
// was geräumt/abgeholt werden" (Abbau), schwarz = nichts zu tun.
const PROJECT_COLORS = ['gruen','hellblau','schwarz'];
function projektColorMeta(c){
  const map = {
    gruen:{hex:'#16A34A', key:'pvColorGreen'},
    hellblau:{hex:'#38BDF8', key:'pvColorBlue'},
    schwarz:{hex:'#111827', key:'pvColorBlack'},
  };
  return map[c] || {hex:null, key:'pvColorNone'};
}

function projektCardHTML(p, editable){
  const orders = state.orders.filter(o=>o.projekt===p.id).sort((a,b)=>a.id-b.id);
  const geliefert = {}, offen = {};
  orders.forEach(o=>{
    const ziel = o.status==='Geliefert' ? geliefert : offen;
    o.items.forEach(it=>{ ziel[it.id] = (ziel[it.id]||0) + it.qty; });
  });
  const line = (id,q)=>{
    const cat = CATALOG.find(c=>c.id===id);
    return `<li>${q} ${cat? unitLabel(cat.unit):''} — ${cat? itemName(cat):id}</li>`;
  };
  const mapsUrl = p.coords
    ? `https://www.google.com/maps?q=${p.coords.lat},${p.coords.lon}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.adresse)}`;
  const curMeta = projektColorMeta(p.farbe);
  const colorBadge = `<div class="proj-color-badge">
    <span class="proj-color-dot" style="${curMeta.hex?`background:${curMeta.hex};`:''}"></span>
    <span>${t(curMeta.key)}</span>
  </div>`;
  const colorPicker = editable ? `<div class="proj-color-picker">
    ${PROJECT_COLORS.map(c=>{
      const m = projektColorMeta(c);
      return `<button class="proj-color-swatch ${p.farbe===c?'active':''}" style="background:${m.hex};" data-action="set-projekt-color" data-id="${p.id}" data-color="${c}" title="${t(m.key)}" aria-label="${t(m.key)}"></button>`;
    }).join('')}
    <button class="proj-color-swatch proj-color-none ${!p.farbe?'active':''}" data-action="set-projekt-color" data-id="${p.id}" data-color="" title="${t('pvColorNone')}" aria-label="${t('pvColorNone')}"></button>
  </div>` : '';
  return `<div class="order-card ${p.aktiv?'st-Unterwegs':'st-Geliefert'}">
    <div class="order-head">
      <div><div class="no">BV ${p.id} – ${p.name}</div><div class="site">${p.adresse}</div></div>

function openOrderReview(){
  if(cartCount()===0) return;
  let ort='', coords=null, projektId=null;
  const sel = document.getElementById('projektSelect');
  if(sel && sel.value!=='_frei'){
    const p = state.projects.find(x=>String(x.id)===sel.value);
    if(p){ ort = p.name+', '+p.adresse; coords = p.coords || null; projektId = p.id; }
  }
  if(!projektId){
    const ortInput = document.getElementById('baustelleOrtInput');
    ort = (ortInput? ortInput.value : state.baustelleOrt).trim();
    coords = state.baustelleCoords || null;
    if(!ort){
      const w = document.getElementById('ortWarnArea');
      if(w) w.innerHTML = `<div class="warn">${t('warnOrt')}</div>`;
      return;
    }
  }
  state.orderReview = {ort, coords, projektId};
  render();
}

async function submitOrderFinal(){
  if(!state.orderReview) return;
  const {ort, coords, projektId} = state.orderReview;
  const items = Object.entries(state.cart).filter(([id,q])=>q>0).map(([id,q])=>{
    const it = CATALOG.find(c=>c.id===id);
    return {id:it.id, name:it.name, unit:it.unit, qty:q};
  });
  if(items.length===0){ state.orderReview=null; render(); return; }

  const order = {
    id: state.orderCounter++,
    baustelle: ort,
    coords,
    projekt: projektId,
    person: state.name,
    items,
    status:'Neu',
    time: new Date().toLocaleString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),
  };
  state.orders.push(order);
  state.cart = {};
  state.confirmOrder = order;
  state.orderReview = null;
  if(!projektId) state.baustelleOrt = ort;
  await saveShared();
  render();
}

document.getElementById('app').addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el){
    if((state.menuOpen || state.langMenuOpen) && !e.target.closest('.menu-wrap')){
      state.menuOpen=false; state.langMenuOpen=false; render();
    }
    return;
  }
  const action = el.dataset.action;

  // Anmeldung Stufe 1: Name + eigenes Passwort prüfen, dann je nach
  // Anzahl der zugewiesenen Rollen direkt rein oder Rolle wählen lassen.
  if(action==='login'){
    const nameSel = document.getElementById('loginName');
    const pwInput = document.getElementById('loginPw');
    const name = nameSel? nameSel.value : '';
    const emp = findEmployee(name);
    if(!emp){ state.loginWarn=t('warnSelectName'); render(); return; }
    if(!pwInput || pwInput.value!==emp.pw){ state.name = name; state.loginWarn=t('warnWrongPw'); render(); return; }
    const roles = employeeRoles(name);
    if(!roles.length){ state.name = name; state.loginWarn=t('warnNoRoles'); render(); return; }
    state.name = name; state.authName = name; state.loginWarn='';
    if(roles.length===1) enterRole(roles[0]); else render();
  }
  if(action==='pick-role'){ enterRole(el.dataset.role); }
  if(action==='login-back'){ state.authName=null; state.loginWarn=''; render(); }
  if(action==='chef-pw-ok'){
    const pw = document.getElementById('chefPwInput');
    if(pw && pw.value===CHEF_PASSWORD){
      state.askChefPw=false; state.loginWarn=''; state.role='chef'; state.loggedIn=true;
      saveSession();
    } else {
      state.loginWarn=t('warnWrongPw');
    }
    render();
  }
  if(action==='chef-pw-back'){
    state.askChefPw=false; state.loginWarn='';
    // Nur eine Rolle (Chef) -> zurück zur Passwort-Eingabe, sonst zur Rollenwahl
    if(employeeRoles(state.authName).length<=1) state.authName=null;
    render();
  }
  if(action==='switch-role'){ state.loggedIn=false; state.role=null; state.askChefPw=false; state.loginWarn=''; clearSession(); render(); }
  if(action==='logout'){ state.loggedIn=false; state.role=null; state.authName=null; state.askChefPw=false; clearSession(); render(); }

  // Personal (nur Chef): Mitarbeiter anlegen/entfernen, Rollen, Passwörter
  if(action==='pers-draft-role'){
    const r = el.dataset.role;
    state.persDraftRoles = state.persDraftRoles.includes(r) ? state.persDraftRoles.filter(x=>x!==r) : [...state.persDraftRoles, r];
    render();
  }
  if(action==='emp-add'){
    const n = document.getElementById('persName'), p = document.getElementById('persPw');
    const name = (n? n.value : '').trim(), pw = (p? p.value : '').trim();
    if(!name || !pw){ state.persWarn=t('persWarnFields'); render(); return; }
    if(findEmployee(name)){ state.persWarn=t('persWarnDuplicate'); render(); return; }
    state.employees.push({id: state.empCounter++, name, pw, roles:[...state.persDraftRoles]});
    state.persDraftRoles=[]; state.persDraftName=''; state.persDraftPw=''; state.persWarn='';
    await saveShared();
    render();
  }
  if(action==='emp-toggle-role'){
    const emp = state.employees.find(e=>String(e.id)===el.dataset.id);
    const r = el.dataset.role;
    if(!emp) return;
    if(emp.roles.includes(r)){
      if(r==='chef' && state.employees.filter(e=>e.roles.includes('chef')).length<=1){ state.persWarn=t('persWarnLastChef'); render(); return; }
      emp.roles = emp.roles.filter(x=>x!==r);
    } else {
      emp.roles = [...emp.roles, r];
    }
    state.persWarn='';
    await saveShared();
    render();
  }
  if(action==='emp-set-pw'){
    const emp = state.employees.find(e=>String(e.id)===el.dataset.id);
    const inp = document.getElementById('empPw-'+el.dataset.id);
    const pw = (inp? inp.value : '').trim();
    if(!emp || !pw){ state.persWarn=t('persWarnFields'); render(); return; }
    emp.pw = pw; state.persWarn='';
    await saveShared();
    render();
  }
  if(action==='emp-remove'){
    const emp = state.employees.find(e=>String(e.id)===el.dataset.id);
    if(!emp) return;
    if(emp.roles.includes('chef') && state.employees.filter(e=>e.roles.includes('chef')).length<=1){ state.persWarn=t('persWarnLastChef'); render(); return; }
    state.employees = state.employees.filter(e=>e.id!==emp.id);
    state.persWarn='';
    await saveShared();
    render();
  }
  if(action==='qty'){
    const id = el.dataset.id, delta = parseInt(el.dataset.delta,10);
    const cur = state.cart[id]||0;
    state.cart[id] = Math.max(0, cur+delta);
    render();
  }
  if(action==='open-order-review'){ openOrderReview(); }
  if(action==='close-order-review' || (action==='close-order-review-bg' && e.target===el)){ state.orderReview=null; render(); }
  if(action==='submit-order-final'){ await submitOrderFinal(); }
  if(action==='close-item-popup' || (action==='close-item-popup-bg' && e.target===el)){ state.itemPopup=null; render(); }
  if(action==='close-confirm' || (action==='close-confirm-bg' && e.target===el)){ state.confirmOrder=null; render(); }
  if(action==='advance'){
    const id = parseInt(el.dataset.order,10);
    const order = state.orders.find(o=>o.id===id);
    const step = NEXT_STEP[order.status];
    if(step){
      if(step.next==='Bereit zur Abholung'){
        order.items.forEach(it=>{ state.inventory[it.id] = (state.inventory[it.id] ?? 0) - it.qty; });
      }
      order.status = step.next;
      await saveShared();
    }
    render();
  }
  if(action==='use-location'){
    const warn = (msg)=>{ const w=document.getElementById('ortWarnArea'); if(w) w.innerHTML = `<div class="warn">${msg}</div>`; };
    if(!navigator.geolocation){ warn(t('locNoSupport')); return; }
    el.textContent = t('locFetching');
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      state.baustelleCoords = {lat, lon};
      state.lastGPS = {lat, lon};
      let text = lat.toFixed(5)+', '+lon.toFixed(5);
      try{
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
        const j = await r.json();
        if(j && j.address){
          const a = j.address;
          const street = [a.road, a.house_number].filter(Boolean).join(' ');
          const city = [a.postcode, a.city || a.town || a.village].filter(Boolean).join(' ');
          text = [street, city].filter(Boolean).join(', ') || j.display_name || text;
        }
      }catch(e){ /* Adresse nicht auflösbar – Koordinaten reichen für die Karte */ }
      state.baustelleOrt = text;
      render();
    }, ()=>{
      warn(t('locFailed'));
      el.textContent = t('locBtn');
    }, {enableHighAccuracy:true, timeout:10000});
  }
  if(action==='lager-tab'){ state.lagerTab = el.dataset.tab; render(); }
  if(action==='system-tab'){ state.systemSel = el.dataset.sys; render(); }
  if(action==='cat-toggle'){
    const id = el.dataset.cat;
    state.collapsedCats[id] = !isCatCollapsed(id);
    render();
  }
  if(action==='print-order'){ printOrder(parseInt(el.dataset.order,10)); }
  if(action==='chef-tab'){ state.chefTab = el.dataset.tab; render(); }
  if(action==='add-projekt'){
    const n = document.getElementById('pvName'), a = document.getElementById('pvAdresse');
    const name = (n? n.value : '').trim(), adresse = (a? a.value : '').trim();
    const w = document.getElementById('pvWarn');
    if(!name || !adresse){ if(w) w.innerHTML = `<div class="warn">${t('pvWarnFields')}</div>`; return; }
    state.projects.push({id: state.projektCounter++, name, adresse, coords:null, aktiv:true, farbe:null});
    await saveShared();
    render();
  }
  if(action==='projekt-toggle'){
    const p = state.projects.find(x=>String(x.id)===el.dataset.id);
    if(p){ p.aktiv = !p.aktiv; await saveShared(); }
    render();
  }
  if(action==='set-projekt-color'){
    const p = state.projects.find(x=>String(x.id)===el.dataset.id);
    if(p){ p.farbe = el.dataset.color || null; await saveShared(); }
    render();
  }
  if(action==='fahrer-tab'){ state.fahrerTab = el.dataset.tab; render(); }
  if(action==='set-driver-status'){
    state.driverStatus[state.name] = {
      status: el.dataset.status,
      time: new Date().toLocaleString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),
    };
    await saveShared();
    render();
  }
  if(action==='add-planned-delivery'){
    const projSel = document.getElementById('planProjektSelect');
    const dateInput = document.getElementById('planDateInput');
    const projektId = projSel && projSel.value ? parseInt(projSel.value,10) : null;
    const date = dateInput ? dateInput.value : '';
    if(!projektId || !date){
      state.planWarn = t('plWarnFields');
      render();
      return;
    }
    const items = Object.entries(state.cart).filter(([id,q])=>q>0).map(([id,q])=>{
      const it = CATALOG.find(c=>c.id===id);
      return {id:it.id, name:it.name, unit:it.unit, qty:q};
    });
    if(items.length===0) return;
    state.plannedDeliveries.push({id: state.planCounter++, projekt: projektId, date, items, person: state.name});
    state.cart = {};
    state.planDraft = {projekt:'', date:''};
    state.planWarn = '';
    await saveShared();
    render();
  }
  if(action==='delete-planned'){
    const id = parseInt(el.dataset.id,10);
    state.plannedDeliveries = state.plannedDeliveries.filter(pd=>pd.id!==id);
    await saveShared();
    render();
  }
  if(action==='pick-addr'){
    state.baustelleOrt = el.dataset.text;
    state.baustelleCoords = {lat: parseFloat(el.dataset.lat), lon: parseFloat(el.dataset.lon)};
    render();
  }
  if(action==='inv'){
    const id = el.dataset.id, delta = parseInt(el.dataset.delta,10);
    state.inventory[id] = (state.inventory[id] ?? 0) + delta;
    await saveShared();
    render();
  }
  if(action==='refresh'){ await loadShared(); render(); }

  if(action==='menu-toggle'){ state.menuOpen = !state.menuOpen; state.langMenuOpen=false; render(); }
  if(action==='lang-toggle'){ state.langMenuOpen = !state.langMenuOpen; state.menuOpen=false; render(); }
  if(action==='set-lang'){
    state.lang = el.dataset.lang; saveLang(state.lang); state.langMenuOpen=false; render();
  }
  if(action==='go-calendar'){
    state.view='calendar'; state.menuOpen=false; state.calWarn='';
    await loadShared();
    render();
  }
  if(action==='go-lkwkalender'){
    state.view='lkwkalender'; state.menuOpen=false; state.lkwWarn='';
    await loadShared();
    render();
  }
  if(action==='go-app'){ state.view='app'; state.menuOpen=false; render(); }

  if(action==='cal-unlock-ask'){ state.calAskPw=true; render(); }
  if(action==='cal-unlock-cancel'){ state.calAskPw=false; render(); }
  if(action==='cal-unlock-ok'){
    const pw = document.getElementById('calPwInput');
    if(pw && pw.value===CHEF_PASSWORD){
      state.calUnlocked=true; state.calAskPw=false;
    } else {
      const w = document.getElementById('calPwWarn');
      if(w) w.innerHTML = `<div class="warn">${t('warnWrongPw')}</div>`;
    }
    render();
  }
  if(action==='cal-lock'){ state.calUnlocked=false; state.calEditId=null; state.calDraft=null; render(); }
  if(action==='cal-cancel-edit'){ state.calEditId=null; state.calDraft=null; state.calWarn=''; render(); }
  if(action==='cal-edit'){
    const entry = state.calendarEntries.find(x=>String(x.id)===el.dataset.id);
    if(entry){ state.calEditId=entry.id; state.calDraft={...entry}; state.calWarn=''; render(); }
  }
  if(action==='cal-delete'){
    state.calendarEntries = state.calendarEntries.filter(x=>String(x.id)!==el.dataset.id);
    await saveShared();
    render();
  }
  if(action==='cal-save'){
    const date = document.getElementById('calDate').value;
    const person = document.getElementById('calPerson').value;
    const ort = document.getElementById('calOrt').value.trim();
    const notiz = document.getElementById('calNotiz').value.trim();
    if(!date || !person || !ort){ state.calWarn=t('calWarnFields'); render(); return; }
    if(state.calEditId){
      const entry = state.calendarEntries.find(x=>x.id===state.calEditId);
      if(entry){ entry.date=date; entry.person=person; entry.ort=ort; entry.notiz=notiz; }
      state.calEditId=null;
    } else {
      state.calendarEntries.push({id: state.calCounter++, date, person, ort, notiz});
    }
    state.calDraft=null; state.calWarn='';
    await saveShared();
    render();
  }

  if(action==='lkw-cancel-edit'){ state.lkwEditId=null; state.lkwDraft=null; state.lkwWarn=''; render(); }
  if(action==='lkw-edit'){
    const entry = state.lkwEntries.find(x=>String(x.id)===el.dataset.id);
    if(entry){ state.lkwEditId=entry.id; state.lkwDraft={...entry}; state.lkwWarn=''; render(); }
  }
  if(action==='lkw-delete'){
    state.lkwEntries = state.lkwEntries.filter(x=>String(x.id)!==el.dataset.id);
    await saveShared();
    render();
  }
  if(action==='lkw-save'){
    const date = document.getElementById('lkwDate').value;
    const time = document.getElementById('lkwTime').value;
    const projektSel = document.getElementById('lkwProjekt');
    const projekt = projektSel && projektSel.value ? parseInt(projektSel.value,10) : null;
    const notiz = document.getElementById('lkwNotiz').value.trim();
    if(!date || !time || !projekt){ state.lkwWarn=t('lkwWarnFields'); render(); return; }
    if(state.lkwEditId){
      const entry = state.lkwEntries.find(x=>x.id===state.lkwEditId);
      if(entry){ entry.date=date; entry.time=time; entry.projekt=projekt; entry.notiz=notiz; }
      state.lkwEditId=null;
    } else {
      state.lkwEntries.push({id: state.lkwCounter++, date, time, projekt, notiz});
    }
    state.lkwDraft=null; state.lkwWarn='';
    await saveShared();
    render();
  }
});

// Adress-Vorschläge aus der Umgebung (freie OpenStreetMap-Suche).
// Wird gebremst abgefragt (max. ~1 Anfrage pro Sekunde erlaubt).
let addrTimer = null;
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fetchAddrSuggestions(q){
  clearTimeout(addrTimer);
  const box = document.getElementById('addrSuggestions');
  if(q.trim().length < 3){ if(box) box.innerHTML=''; return; }
  addrTimer = setTimeout(async ()=>{
    try{
      let url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=de&q=${encodeURIComponent(q)}`;
      if(state.lastGPS){
        const g = state.lastGPS;
        url += `&viewbox=${g.lon-0.15},${g.lat+0.15},${g.lon+0.15},${g.lat-0.15}`;
      }
      const r = await fetch(url);
      const list = await r.json();
      const b = document.getElementById('addrSuggestions');
      if(!b) return;
      if(!Array.isArray(list) || !list.length){ b.innerHTML=''; return; }
      b.innerHTML = `<div class="addr-sug">${list.map(x=>{
        const t = escapeHtml(x.display_name.split(',').slice(0,3).join(','));
        return `<div data-action="pick-addr" data-lat="${x.lat}" data-lon="${x.lon}" data-text="${t}">📍 ${t}</div>`;
      }).join('')}</div>`;
    }catch(e){ /* Vorschläge sind nur Komfort – Fehler still ignorieren */ }
  }, 700);
}

document.getElementById('app').addEventListener('input', (e)=>{
  if(e.target.id==='baustelleOrtInput'){
    state.baustelleOrt = e.target.value;
    state.baustelleCoords = null;
    fetchAddrSuggestions(e.target.value);
  }
  if(e.target.id==='projektSelect'){
    state.selProjekt = e.target.value;
    render();
  }
  if(e.target.id==='persName'){ state.persDraftName = e.target.value; }
  if(e.target.id==='persPw'){ state.persDraftPw = e.target.value; }
  if(e.target.id==='planProjektSelect'){ state.planDraft.projekt = e.target.value; }
  if(e.target.id==='planDateInput'){ state.planDraft.date = e.target.value; }
  if(e.target.id==='catalogSearch'){
    state.catalogSearch = e.target.value;
    render();
    const s = document.getElementById('catalogSearch');
    if(s){ s.focus(); s.selectionStart = s.selectionEnd = s.value.length; }
  }
});

// Name antippen und halten öffnet das Detail-Popup (Foto/Menge) --
// nützlich sobald echte Teile-Fotos zur Sicherheit dabei sind.
let lpTimer=null, lpStartX=0, lpStartY=0, lpId=null;
function clearLongPress(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } lpId=null; }
document.getElementById('app').addEventListener('pointerdown', (e)=>{
  const cell = e.target.closest('[data-longpress]');
  if(!cell) return;
  lpId = cell.dataset.longpress;
  lpStartX = e.clientX; lpStartY = e.clientY;
  lpTimer = setTimeout(()=>{
    lpTimer = null;
    state.itemPopup = lpId;
    render();
  }, 480);
});
document.getElementById('app').addEventListener('pointermove', (e)=>{
  if(!lpTimer) return;
  if(Math.abs(e.clientX-lpStartX)>10 || Math.abs(e.clientY-lpStartY)>10) clearLongPress();
});
document.getElementById('app').addEventListener('pointerup', clearLongPress);
document.getElementById('app').addEventListener('pointercancel', clearLongPress);
document.getElementById('app').addEventListener('contextmenu', (e)=>{
  if(e.target.closest('[data-longpress]')) e.preventDefault();
});

setInterval(async ()=>{
  if((!state.loggedIn && state.view!=='calendar' && state.view!=='lkwkalender') || state.confirmOrder || state.orderReview || state.itemPopup) return;
  // Nicht mitten ins Tippen hinein neu zeichnen
  const ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='SELECT' || ae.tagName==='TEXTAREA')) return;
  await loadShared();
  render();
}, 4000);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

(async function init(){
  state.lang = loadLang();
  restoreSession();
  await loadShared();
  state.loading = false;
  render();
})();
</script>
