<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerüst-Bestellung</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0069B3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gerüst-Bestellung">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#F2F4F6; --card:#FFFFFF; --ink:#17242D; --muted:#64748B; --line:#E2E8F0; --line-strong:#CBD5E1;
    --accent:#0069B3; --accent-dark:#00538D; --accent-soft:#E1F0FA;
    /* Feste Marken-Füllfarbe für Knöpfe mit weißer Schrift -- bleibt in
       beiden Modi kräftig genug, damit der Text lesbar bleibt (--accent
       wird im Dunkelmodus bewusst heller, siehe unten). */
    --accent-solid:#0069B3;
    --surface-2:#F1F4F6; --icon-tile:#FFF9C4; --zebra:#F6F8FA;
    --disabled-bg:#CBD5E1; --disabled-fg:#F8FAFC;
    --amber:#F59E0B; --blue:#2563EB; --green:#16A34A; --red:#DC2626;
    --shadow:0 6px 18px rgba(23,36,45,0.07);
    /* Alias-Namen aus früheren Design-Ständen, die noch in Inline-Styles
       vorkommen -- zeigen bewusst auf die Grundfarben, damit sie sich im
       Dunkelmodus automatisch mit anpassen. */
    --steel:var(--muted); --concrete:var(--line); --concrete-2:var(--line-strong);
    --orange:var(--accent); --orange-dark:var(--accent-dark); --yellow:#F59E0B;
    --white:#FFFFFF; --asphalt:var(--ink);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0C161F; --card:#122130; --ink:#EAF1F6; --muted:#93A5B2; --line:#233242; --line-strong:#324457;
      --accent:#5CAEEA; --accent-dark:#8FCBFA; --accent-soft:rgba(92,174,234,0.14);
      --surface-2:#18262F; --icon-tile:rgba(255,238,0,0.12); --zebra:#0F1D29;
      --disabled-bg:#233242; --disabled-fg:#5B6B79;
      --red:#F87171; --green:#4ADE80;
      --shadow:0 1px 2px rgba(0,0,0,0.35),0 10px 26px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .login-logo{display:block;margin:0 auto 14px auto;width:110px;border-radius:10px;}

  /* Menü (3 Striche) + Logo, sichtbar auch ohne Anmeldung */
  .top-nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
  .top-nav.on-dark{background:transparent;}
  .top-nav.on-light{background:var(--card);border-bottom:1px solid var(--line);}
  .top-nav-logo{height:28px;width:auto;border-radius:6px;}
  .menu-wrap{position:relative;}
  .menu-btn{background:rgba(255,255,255,0.18);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:19px;cursor:pointer;line-height:1;}
  .top-nav.on-light .menu-btn{background:var(--surface-2);color:var(--ink);}
  .menu-dropdown{position:absolute;top:46px;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:220px;overflow:hidden;z-index:41;}
  .menu-dropdown button{display:block;width:100%;text-align:left;background:none;border:none;padding:13px 14px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;}
  .menu-dropdown button:active{background:var(--accent-soft);}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0069B3 0%,#00538D 60%,#003A63 100%);padding:76px 20px 20px 20px;}
  .login-card{background:var(--card);border-radius:20px;border-top:6px solid #FFEE00;padding:30px 26px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .login-card h1{font-size:22px;margin:0 0 4px 0;text-align:center;}
  .login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;}
  .role-grid{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .role-btn{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--ink);text-align:left;}
  .role-btn svg{width:24px;height:24px;flex:none;color:var(--accent);}
  .role-btn small{display:block;font-family:'Inter';font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;}
  .role-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
  .warn{color:var(--red);font-size:12.5px;margin-top:8px;}

  header.chrome{background:var(--card);color:var(--ink);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #FFEE00;position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{height:34px;width:auto;flex:none;border-radius:6px;}
  .brand h1{font-size:17px;margin:0;color:var(--ink);}
  .brand span{font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);letter-spacing:0;}
  .who{text-align:right;font-size:11.5px;color:var(--muted);}
  .who b{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .who a{color:var(--accent);text-decoration:none;font-size:11px;cursor:pointer;}

  main{flex:1;padding:20px 16px 110px 16px;max-width:720px;margin:0 auto;width:100%;}
  .view-title{margin:4px 0 2px 0;font-size:24px;}
  .view-sub{margin:0 0 18px 0;color:var(--muted);font-size:13.5px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:var(--card);color:var(--ink);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .loc-btn{display:block;width:100%;background:var(--accent-soft);border:none;color:var(--accent-dark);border-radius:12px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;font-family:'Inter',sans-serif;}
  .maps-btn{display:block;text-align:center;background:var(--accent-soft);border:none;color:var(--accent-dark);border-radius:10px;padding:9px;font-size:12.5px;font-weight:600;text-decoration:none;margin-top:10px;}
  .addr-sug{background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;}
  .addr-sug div{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .addr-sug div:last-child{border-bottom:none;}
  .addr-sug div:active{background:var(--accent-soft);}
  .katalog-search{width:100%;border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;font-size:14px;margin:0 0 12px 0;background:var(--card);color:var(--ink);font-family:inherit;}
  .katalog-search:focus{outline:none;border-color:var(--accent);}

  /* Bestellliste als Tabelle (kein Warenkorb) -- Name antippen+halten
     zeigt ein Detail-Popup, praktisch sobald echte Teile-Fotos da sind. */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:10px;margin-bottom:6px;}
  table.order-table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);}
  .order-table thead th{text-align:left;font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1.5px solid var(--line-strong);background:var(--zebra);}
  .order-table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .order-table tbody tr:last-child td{border-bottom:none;}
  .order-table tbody tr.row-alt{background:var(--zebra);}
  .order-table tbody tr.cat-row td{background:var(--accent-soft);color:var(--accent-dark);font-weight:700;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;padding:7px 12px;cursor:pointer;-webkit-user-select:none;user-select:none;}
  .order-table tbody tr.cat-row:active td{background:var(--accent-soft);filter:brightness(0.95);}
  .cat-chevron{display:inline-block;width:14px;}
  .cat-count{color:var(--accent-dark);opacity:0.65;font-weight:600;text-transform:none;letter-spacing:0;}
  .t-name{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  .t-name:active{background:var(--accent-soft);}
  .t-icon{width:22px;height:22px;color:var(--accent);flex:none;}
  .t-unit{color:var(--muted);font-size:12.5px;}
  .t-kg{font-size:10.5px;color:var(--muted);opacity:0.85;white-space:nowrap;}
  .order-weight{font-size:12.5px;color:var(--ink);background:var(--surface-2);border-radius:10px;padding:7px 10px;margin:6px 0 2px 0;}
  .order-weight b{font-family:'Space Grotesk',sans-serif;}
  .inv-cat{font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--accent-dark);margin:18px 0 8px 0;}
  .qty-ctl{display:flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden;flex:none;background:var(--card);}
  .qty-ctl button{background:none;border:none;width:30px;height:34px;font-size:16px;line-height:1;cursor:pointer;color:var(--muted);}
  .qty-ctl button:active{background:var(--accent-soft);color:var(--accent-dark);}
  .qty-ctl .qty-val{width:32px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong);}

  /* Detail-Popup pro Teil (langes Drücken auf den Namen) */
  .overlay-center{align-items:center;}
  .item-popup{background:var(--card);border-radius:20px;padding:24px;max-width:300px;width:88%;margin:auto;text-align:center;}
  .item-popup-photo{aspect-ratio:4/3;border:1.5px dashed var(--line-strong);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accent);background:var(--zebra);margin-bottom:14px;}
  .item-popup-photo svg{width:40px;height:40px;}
  .item-popup-photo span{font-size:11px;color:var(--muted);letter-spacing:0.03em;}
  .item-popup-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;}
  .item-popup-unit{font-size:12.5px;color:var(--muted);margin:2px 0 14px 0;}
  .item-popup .qty-ctl{margin:0 auto;}

  /* Bestellung prüfen (Bestellschein-Vorschau vor dem Abschicken) */
  .review-head{padding:4px 4px 14px 4px;border-bottom:2px dashed var(--line-strong);margin-bottom:14px;}
  .review-head .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
  .review-head h3{font-size:19px;margin-top:4px;}
  .review-meta{font-size:13px;color:var(--muted);margin:0 4px 14px 4px;}
  .review-meta b{color:var(--ink);}
  .review-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:18px;}
  .review-table th{text-align:left;font-size:10px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);padding:8px 4px;border-bottom:1.5px solid var(--line-strong);}
  .review-table th.num,.review-table td.num{text-align:right;}
  .review-table td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}

  .order-footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -6px 20px rgba(23,36,45,0.08);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);z-index:15;max-width:720px;margin:0 auto;border-radius:16px 16px 0 0;}
  .submit-btn{background:#FFEE00;color:#0B2A42;border:none;padding:12px 22px;border-radius:999px;font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:700;cursor:pointer;}
  .submit-btn:disabled{background:var(--disabled-bg);color:var(--disabled-fg);cursor:not-allowed;}

  /* Bestätigungs-Ticket */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;}
  .drawer{background:var(--card);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:20px;max-height:82vh;overflow-y:auto;}
  .ticket{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:0;max-width:340px;margin:auto;position:relative;overflow:hidden;}
  .ticket-top{padding:20px 20px 14px 20px;border-bottom:2px dashed var(--line);}
  .ticket-body{padding:14px 20px 20px 20px;}
  .stamp{position:absolute;top:14px;right:16px;border:3px solid var(--accent);color:var(--accent);border-radius:50%;width:74px;height:74px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:700;text-align:center;transform:rotate(-10deg);line-height:1.15;}
  .ticket-order-no{font-size:28px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .ticket-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;}
  .ticket-row span:first-child{color:var(--muted);}

  /* Bestellkarten (Lager/Fahrer/Chef) */
  .order-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;}
  .order-card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:#94A3B8;}
  .order-card.st-Neu::before{background:#94A3B8;}
  .order-card.st-InBearbeitung::before{background:var(--amber);}
  .order-card.st-BereitzurAbholung::before{background:var(--accent);}
  .order-card.st-Beladen::before{background:#7C3AED;}
  .order-card.st-Unterwegs::before{background:var(--blue);}
  .order-card.st-Geliefert::before{background:var(--green);}
  .order-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .order-head .no{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;}
  .order-head .site{font-size:12.5px;color:var(--muted);}
  .status-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .status-badge.st-Neu{background:#EEF2F6;color:#475569;}
  .status-badge.st-InBearbeitung{background:#FEF3C7;color:#92400E;}
  .status-badge.st-BereitzurAbholung{background:var(--accent-soft);color:var(--accent-dark);}
  .status-badge.st-Beladen{background:#EDE9FE;color:#5B21B6;}
  .status-badge.st-Unterwegs{background:#DBEAFE;color:#1D4ED8;}
  .status-badge.st-Geliefert{background:#DCFCE7;color:#166534;}
  .order-items{font-size:13px;color:var(--ink);margin:8px 0;line-height:1.55;}
  .order-items li{margin-left:18px;}
  .order-time{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  .advance-btn{width:100%;background:#FFEE00;color:#0B2A42;border:none;padding:12px;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:10px;}
  .advance-btn:active{background:var(--accent-solid);color:#fff;}
  .done-label{font-size:12.5px;color:var(--green);font-weight:700;margin-top:8px;}
  .empty-state{text-align:center;color:var(--muted);padding:44px 10px;font-size:13.5px;}
  .waiting-note{font-size:12px;color:#92400E;background:#FEF3C7;padding:10px 12px;border-radius:12px;margin-bottom:12px;}
  .mine-section{margin-top:28px;border-top:2px dashed var(--line);padding-top:18px;}
  .mine-section h3{font-size:15px;margin:0 0 10px 0;}
  .refresh-row{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .refresh-btn{background:var(--card);border:1.5px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:11.5px;cursor:pointer;}
  .loading{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px;}

  /* Segmented control (Lager) */
  .seg-control{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin:12px 0 16px 0;}
  .seg-control button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);}
  .seg-control button.active{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(23,36,45,0.12);}

  /* Inventur */
  .inv-list{display:flex;flex-direction:column;gap:10px;}
  .inv-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);}
  .inv-icon{width:40px;height:40px;background:var(--icon-tile);border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
  .inv-icon svg{width:22px;height:22px;}
  .inv-main{flex:1;}
  .inv-name{font-size:14px;font-weight:600;}
  .inv-qty{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .inv-qty.stock-low{color:#B45309;font-weight:700;}
  .inv-qty.stock-missing{color:var(--red);font-weight:700;}
  .inv-qty .tag{margin-left:6px;background:var(--surface-2);border-radius:999px;padding:2px 8px;font-size:10.5px;}
  .inv-actions{display:flex;gap:5px;flex:none;}
  .inv-actions button{background:var(--surface-2);color:var(--ink);border:none;border-radius:9px;width:32px;height:32px;font-size:15px;font-weight:700;cursor:pointer;}
  .inv-actions button:active{background:var(--accent-solid);color:#fff;}
  .inv-restock{width:auto !important;padding:0 10px !important;font-size:11.5px !important;font-family:'Inter',sans-serif !important;}

  /* Chef */
  .stat-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .stat-chip{background:var(--card);border-radius:14px;padding:10px 14px;text-align:center;min-width:74px;box-shadow:var(--shadow);}
  .stat-chip b{display:block;font-family:'Space Grotesk',sans-serif;font-size:20px;}
  .stat-chip span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}

  /* Kartenlisten: am Handy eine Spalte, am PC mehrere nebeneinander */
  .card-grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start;margin-bottom:12px;}
  .card-grid > .order-card{margin-bottom:0;}

  /* Widgets: kurze Info-Kacheln oben (Idee wie iPhone-Widgets) */
  .widget-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px 0;}
  .widget{--wc:var(--muted);display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--card);border:none;border-radius:20px;padding:14px 14px 13px 14px;box-shadow:var(--shadow);font-family:'Inter',sans-serif;color:var(--ink);min-height:104px;position:relative;overflow:hidden;}
  button.widget{cursor:pointer;}
  button.widget:active{transform:scale(0.98);}
  .widget::after{content:'';position:absolute;inset:0;background:var(--wc);opacity:0.07;pointer-events:none;}
  .w-top{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:0.01em;}
  .w-dot{width:9px;height:9px;border-radius:50%;background:var(--wc);flex:none;}
  .w-value{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;line-height:1.1;margin-top:8px;color:var(--wc);}
  .w-value.small{font-size:17px;margin-top:10px;color:var(--ink);}
  .w-detail{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .widget-grid.three{grid-template-columns:repeat(3,1fr);gap:8px;}
  .widget-grid.three .widget{min-height:86px;padding:11px 10px;border-radius:16px;}
  .widget-grid.three .w-value{font-size:24px;margin-top:6px;}
  .widget-grid.three .w-top{font-size:10.5px;align-items:flex-start;}
  .widget-grid.three .w-dot{margin-top:3px;}
  .widget-grid.three .w-detail{font-size:10.5px;}
  .w-green{--wc:#1E9E5A;} .w-blue{--wc:var(--blue);} .w-sky{--wc:#3AA0E6;} .w-amber{--wc:var(--amber);}

  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({name:state.name, role:state.role})); }catch(e){}

  try{

function t(key, vars){
  let s = (T[state.lang] && T[state.lang][key]) ?? T.de[key] ?? key;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.replace(new RegExp('\\{'+k+'\\}','g'), vars[k]); });
  return s;
}
function catName(cat){ return t('part_'+(PART_NAMEKEY[cat.id]||cat.id)); }
function itemName(it){ return itemNameLang(it, state.lang); }
function unitLabel(u){ return u==='Stk' ? t('unitStk') : u; }
// Bestellte Positionen sind mit deutschem Namen/Einheit gespeichert
// (Roh-Datensatz, sprachunabhängig) -- zur Anzeige immer über die
// aktuelle Sprache auflösen, mit Rückfall auf den gespeicherten Text
// falls das Teil später aus dem Katalog entfernt wurde.
function resolvedItem(i){
  const cat = CATALOG.find(c=>c.id===i.id);
  return cat ? {name:itemName(cat), unit:unitLabel(cat.unit)} : {name:i.name, unit:i.unit};
}
function statusLabel(status){ return t('status'+slug(status)); }
function stepLabel(status){ return t('step'+slug(status)); }

// Für den Lieferschein: Stückzahl in ganze Pakete + Rest umrechnen
// (z.B. 32 Stk bei 10 Stk/Paket -> "3 Pakete und 2 Stk"), statt einer
// unpraktischen Kommazahl wie "3,2 Pakete". Teile ohne pkg-Feld liefern
// null (werden ganz normal nur in Stück angezeigt).
function formatPackages(qty, it){
  if(!it || !it.pkg || qty<=0) return null;
  const pkgCount = Math.floor(qty/it.pkg);
  const rest = qty % it.pkg;
  if(pkgCount===0) return null;
  const pkgWord = pkgCount===1 ? t('pkgOne') : t('pkgMany');
  return rest>0
    ? `${pkgCount} ${pkgWord} ${t('pkgAnd')} ${rest} ${unitLabel(it.unit)}`
    : `${pkgCount} ${pkgWord}`;
}

// Gerüst-Systeme = Reiter beim Bestellen/Planen/Inventur. "system" ist
// das Rahmen-System (SL 70 / SL 100), im Excel "Materialauszug System".

function partItemId(type, v){
  if(v==null) return type;
  if(typeof v==='number') return type+'_'+Math.round(v*100);
  if(Array.isArray(v)) return type+'_'+Math.round(v[0]*100)+v[1];
  return type+'_'+v;
}
const LOCALES = {de:'de-DE', pl:'pl-PL', sk:'sk-SK', hr:'hr-HR', en:'en-GB'};
function tl(lang, key){ return (T[lang] && T[lang][key]) ?? T.de[key] ?? key; }
function fmtLen(m, lang){ return m.toLocaleString(LOCALES[lang]||'de-DE', {minimumFractionDigits:2, maximumFractionDigits:2})+' m'; }
function variantLabel(v, lang){
  if(v==null) return '';
  if(typeof v==='number') return fmtLen(v, lang);
  if(Array.isArray(v)) return fmtLen(v[0], lang)+' '+tl(lang,'var_'+v[1]);
  return tl(lang,'var_'+v);
}
function itemNameLang(it, lang){
  const vl = variantLabel(it.v, lang);
  return tl(lang,'part_'+it.nameKey) + (vl? ' '+vl : '');
}

// ---- Gewicht (wichtig für den LKW) -----------------------------------
function itemKg(i){
  const c = CATALOG.find(x=>x.id===i.id);
  if(c && c.kg!=null) return c.kg;
  return (typeof i.kg==='number') ? i.kg : null;
}
function weightOf(items){
  let kg = 0, missing = 0;
  items.forEach(i=>{ const w = itemKg(i); if(w==null) missing++; else kg += w*i.qty; });
  return {kg, missing};
}
function formatKg(kg){
  const loc = LOCALES[state.lang]||'de-DE';
  return kg>=1000
    ? (kg/1000).toLocaleString(loc, {minimumFractionDigits:2, maximumFractionDigits:2})+' t'
    : Math.round(kg).toLocaleString(loc)+' kg';
}
function weightText(items){
  const w = weightOf(items);
  if(!w.kg) return '';  // gar kein Gewicht bekannt (z. B. alte Beispiel-Teile) -> nichts anzeigen
  return `${t('weightApprox')} ${formatKg(w.kg)}` + (w.missing? ` (${t('weightMissing',{n:w.missing})})` : '');
}
function weightLineHTML(items){
  const txt = weightText(items);
  return txt? `<div class="order-weight">⚖️ ${t('weightLabel')}: <b>${txt}</b></div>` : '';
}

// ======================================================================
// Speicher: Abgleich mit Supabase (app_state / STORAGE_KEY)
// ----------------------------------------------------------------------
// Statt den ganzen Datensatz blind zu überschreiben, merkt sich die App
// den zuletzt vom Server gelesenen Stand (syncBase). Beim Speichern holt
// sie den AKTUELLEN Server-Stand und trägt nur die EIGENEN Änderungen
// (Unterschied syncBase -> eigener Stand) darauf ein (merge3). Dadurch:
//  - gehen gleichzeitige Änderungen anderer nicht verloren (Bestellung
//    hier, Status dort; Lagerbestand wird als +/- verrechnet),
//  - kann ein fehlgeschlagenes Laden nichts mehr überschreiben (ohne
//    bekannten Server-Stand wird gar nicht gespeichert),
//  - funktioniert die App bei schlechtem Netz weiter: Änderungen bleiben
//    auf dem Handy gemerkt (auch nach Schließen, localStorage PENDING_KEY)
//    und werden automatisch gesendet, sobald wieder Netz da ist. Der
//    letzte Server-Stand liegt zusätzlich in CACHE_KEY, damit die App auch
//    ohne Netz startet.
// Schreiben nur, wenn sich der Server seit dem Lesen nicht geändert hat
// (Versionszähler value.rev), sonst neu lesen + neu zusammenführen.
// ======================================================================

function clone(x){ return x===undefined ? undefined : JSON.parse(JSON.stringify(x)); }
// Vergleich unabhängig von der Reihenfolge der Felder
function stableStr(x){
  if(Array.isArray(x)) return '['+x.map(stableStr).join(',')+']';
  if(x && typeof x==='object') return '{'+Object.keys(x).filter(k=>x[k]!=null).sort().map(k=>JSON.stringify(k)+':'+stableStr(x[k])).join(',')+'}';
  return JSON.stringify(x===undefined ? null : x);
}
function same(a, b){ return stableStr(a)===stableStr(b); }

  state.plannedDeliveries = v.plannedDeliveries || [];
  state.planCounter = v.planCounter || 1;
  state.lkwEntries = v.lkwEntries || [];
  state.lkwCounter = v.lkwCounter || 1;
  state.pushSubs = v.pushSubs || [];
  state.employees = Array.isArray(v.employees) ? v.employees : [];
  state.empCounter = v.empCounter || (state.employees.length ? Math.max(...state.employees.map(e=>e.id))+1 : 1);
}

// Feldweise: was lokal (gegenüber base) geändert wurde, gewinnt; sonst Server.
function mergeRecord(b, l, r){
  const out = {...r};
  new Set([...Object.keys(b||{}), ...Object.keys(l||{})]).forEach(f=>{
    if(!same((l||{})[f], (b||{})[f])){ if(l[f]===undefined) delete out[f]; else out[f] = clone(l[f]); }
  });
  return out;
}
// Listen mit Schlüssel (id bzw. endpoint): Hinzufügen/Löschen/Ändern je Eintrag.
function mergeList(b, l, r, key, counterInfo){
  b = b||[]; l = l||[]; r = r||[];
  let changes = 0;
  const bm = new Map(b.map(x=>[x[key], x])), lm = new Map(l.map(x=>[x[key], x]));
  let out = r.map(x=>clone(x));
  // gelöscht
  b.forEach(x=>{ if(!lm.has(x[key])){ changes++; out = out.filter(y=>y[key]!==x[key]); } });
  // geändert
  l.forEach(x=>{
    const bx = bm.get(x[key]);
    if(bx && !same(bx, x)){
      changes++;
      const i = out.findIndex(y=>y[key]===x[key]);
      if(i>=0) out[i] = mergeRecord(bx, x, out[i]);
      else out.push(clone(x));   // auf dem Server inzwischen gelöscht -> lokale Änderung behalten
    }
  });
  // neu
  l.forEach(x=>{
    if(bm.has(x[key])) return;
    changes++;
    const rx = out.find(y=>y[key]===x[key]);
    if(!rx){ out.push(clone(x)); return; }
    if(same(rx, x)) return;
    // gleiche Nummer von zwei Geräten gleichzeitig vergeben -> neue Nummer
    const nx = clone(x);
    if(counterInfo && typeof x[key]==='number'){
      nx[key] = Math.max(...out.map(y=>typeof y[key]==='number'? y[key] : 0), ...l.map(y=>typeof y[key]==='number'? y[key] : 0)) + 1;
    }
    out.push(nx);
  });
  return {out, changes};
}
// Schlüssel-Objekte (driverStatus, driverPos): je Eintrag
function mergeMap(b, l, r, numericDelta){
  b = b||{}; l = l||{}; r = r||{};
  const out = clone(r);
  let changes = 0;
  new Set([...Object.keys(b), ...Object.keys(l)]).forEach(k=>{
    if(same(b[k], l[k])) return;
    changes++;
    if(numericDelta){
      out[k] = (Number(r[k])||0) + (Number(l[k])||0) - (Number(b[k])||0);   // Lagerbestand: +/- verrechnen
    } else if(l[k]===undefined) delete out[k];
    else if(b[k] && r[k] && typeof l[k]==='object') out[k] = mergeRecord(b[k], l[k], r[k]);
    else out[k] = clone(l[k]);
  });
  return {out, changes};
}
function merge3(base, local, remote){
  base = base||{}; local = local||{}; remote = remote||{};
  const out = clone(remote);
  delete out.rev;
  let changes = 0;
  const handled = new Set(['rev']);
  Object.entries(RECORD_ARRAYS).forEach(([k, ck])=>{
    handled.add(k); handled.add(ck);
    const m = mergeList(base[k], local[k], remote[k], 'id', true);
    out[k] = m.out; changes += m.changes;
    const maxId = Math.max(0, ...m.out.map(x=>typeof x.id==='number'? x.id : 0));
    const lc = Number(local[ck])||0, rc = Number(remote[ck])||0;
    if(lc!==(Number(base[ck])||0)) changes++;
    out[ck] = Math.max(lc, rc, maxId+1);
  });
  [['inventory', true], ['driverStatus', false], ['driverPos', false]].forEach(([k, num])=>{
    handled.add(k);
    const m = mergeMap(base[k], local[k], remote[k], num);
    out[k] = m.out; changes += m.changes;
  });
  handled.add('pushSubs');
  const ps = mergeList(base.pushSubs, local.pushSubs, remote.pushSubs, 'endpoint', false);
  out.pushSubs = ps.out; changes += ps.changes;
  new Set([...Object.keys(base), ...Object.keys(local)]).forEach(k=>{
    if(handled.has(k) || same(base[k], local[k])) return;
    changes++;
    if(local[k]===undefined) delete out[k]; else out[k] = clone(local[k]);
  });
  return {value:out, changes};
}
// Gibt es eigene, noch nicht gespeicherte Änderungen? Gleiche Logik wie
// beim Zusammenführen (leere Liste = fehlende Liste usw.).
function hasLocalChanges(){
  return !!syncBase && merge3(syncBase, stateToValue(), syncBase).changes > 0;
}
function savePending(){
  if(state.syncPending && syncBase) lsSet(PENDING_KEY, JSON.stringify({base:syncBase, local:stateToValue(), ts:Date.now()}));
  else lsSet(PENDING_KEY, null);
}
async function fetchRemote(){
  const { data, error } = await supabaseClient.from('app_state').select('value').eq('key', STORAGE_KEY).maybeSingle();
  if(error) throw error;
  return data && data.value ? data.value : null;
}
// Schreibt nur, wenn der Server noch auf Version rev steht. true = geschrieben.
async function writeIfUnchanged(value, rev){
  const q = supabaseClient.from('app_state').update({value});
  const filtered = q.eq('key', STORAGE_KEY);
  const { data, error } = await (rev==null ? filtered.is('value->>rev', null) : filtered.eq('value->>rev', String(rev))).select('key');
  if(error) throw error;
  return Array.isArray(data) && data.length>0;
}

// Ein Abgleich: Server lesen, eigene Änderungen einarbeiten, ggf. schreiben.
async function doSync(){
  if(!supabaseClient) throw new Error('Supabase-Bibliothek nicht geladen');
  for(let attempt=0; attempt<5; attempt++){
    const captured = stateToValue();
    let remote;
    try{ remote = await fetchRemote(); }
    catch(e){ state.syncOffline = true; savePending(); throw e; }
    state.syncOffline = false;
    if(!remote){
      // Allererster Start: Datensatz anlegen
      if(!syncBase && !state.employees.length){
        state.employees = DEFAULT_EMPLOYEES.map(e=>({...e, roles:[...e.roles]}));
        state.empCounter = DEFAULT_EMPLOYEES.length+1;
      }
      const v = {...stateToValue(), rev:1};
      const { error } = await supabaseClient.from('app_state').upsert({key:STORAGE_KEY, value:v});
      if(error) throw error;
      syncBase = clone(v); delete syncBase.rev;
      state.syncPending = false; savePending();
      lsSet(CACHE_KEY, JSON.stringify(syncBase));
      return;
    }
    const rev = remote.rev==null ? null : remote.rev;
    let merged, changes = 0;
    if(syncBase){ const m = merge3(syncBase, captured, remote); merged = m.value; changes = m.changes; }
    else { merged = clone(remote); delete merged.rev; }
    if(!Array.isArray(merged.employees) || !merged.employees.length){
      // Älterer Datensatz ohne Mitarbeiterliste: Start-Befüllung
      merged.employees = DEFAULT_EMPLOYEES.map(e=>({...e, roles:[...e.roles]}));
      merged.empCounter = DEFAULT_EMPLOYEES.length+1;
      changes++;
    }
    if(changes>0){
      let ok;
      try{ ok = await writeIfUnchanged({...merged, rev:(Number(rev)||0)+1}, rev); }
      catch(e){
        if(/fetch|network|Failed/i.test(String(e && (e.message||e)))){ state.syncOffline = true; state.syncPending = true; savePending(); throw e; }
        // Bedingtes Schreiben nicht möglich (z. B. Tabellen-Regeln) -> normal speichern
        console.warn('Bedingtes Speichern nicht möglich, speichere direkt', e);
        const { error } = await supabaseClient.from('app_state').upsert({key:STORAGE_KEY, value:{...merged, rev:(Number(rev)||0)+1}});
        if(error){ state.syncPending = true; savePending(); throw error; }
        ok = true;
      }
      if(!ok) continue;   // jemand anderes hat gerade gespeichert -> neu lesen + zusammenführen
    }
    // Was seit "captured" lokal noch dazukam (während wir gewartet haben), behalten
    const now = stateToValue();
    const result = same(now, captured) ? merged : merge3(captured, now, merged).value;
    syncBase = merged;
    applyValue(clone(result));   // eigene Kopie, sonst ändert die App syncBase mit
    state.syncPending = hasLocalChanges();
    savePending();
    lsSet(CACHE_KEY, JSON.stringify(syncBase));
    enforceSession();
    return;
  }
  state.syncPending = true; savePending();
  throw new Error('Speichern: zu viele gleichzeitige Änderungen, versuche es gleich nochmal');
}
function sync(){
  const run = syncChain.then(doSync, doSync);
  syncChain = run.catch(()=>{});
  return run;
}
// Beim Start: letzter bekannter Stand + gemerkte Änderungen (falls offline)
function restoreOfflineState(){
  let cache = null, pend = null;
  try{ cache = JSON.parse(lsGet(CACHE_KEY)||'null'); }catch(e){}
  try{ pend = JSON.parse(lsGet(PENDING_KEY)||'null'); }catch(e){}
  if(pend && pend.base && pend.local && Date.now()-(pend.ts||0) < 3*24*3600*1000){
    syncBase = pend.base; applyValue(clone(pend.local)); state.syncPending = true; return true;
  }
  if(cache){ syncBase = cache; applyValue(clone(cache)); return true; }
  return false;
}

  try{

    if(state.loggedIn && state.role==='chef') await loadPositions();

    if(!syncBase && !state.employees.length) state.employees = DEFAULT_EMPLOYEES.map(e=>({...e, roles:[...e.roles]}));
  }
}
async function saveShared(){
  if(!syncBase){
    // Server-Stand nie gelesen -> NICHT speichern (sonst würden echte Daten
    // mit leeren Startwerten überschrieben). Änderung bleibt lokal sichtbar.
    console.warn('Noch keine Verbindung zum Server – nicht gespeichert');
    state.syncOffline = true;
    return false;
  }
  state.syncPending = true;
  try{ await sync(); return true; }
  catch(e){ console.error('Speichern fehlgeschlagen', e); return false; }
}

// In eine Rolle einsteigen; Chef verlangt ZUSÄTZLICH das Chef-Passwort.
// ---- Push-Benachrichtigungen ---------------------------------------------
// Jedes Handy, das Benachrichtigungen erlaubt, landet mit seinem Push-
// Abo in state.pushSubs ({endpoint, keys, name, lang, ts}). Verschickt
// wird über die Supabase Edge Function "send-push" (notify()): sie sucht
// die passenden Handys (nach Rolle der Person oder nach Name) und schickt
// den Text in der Sprache, die auf dem jeweiligen Handy eingestellt ist.
// Ist die Funktion (noch) nicht eingerichtet, passiert einfach nichts.
const PUSH_ENDPOINT_KEY = 'geruest-push-endpoint', PUSH_LATER_KEY = 'geruest-push-later';
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
function pushActiveHere(){
  const ep = lsGet(PUSH_ENDPOINT_KEY);
  return !!ep && state.pushSubs.some(s=>s.endpoint===ep && s.name===state.name);
}
function urlB64ToUint8(b64){
  const raw = atob((b64 + '='.repeat((4-b64.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function registerPushSub(sub){
  const j = sub.toJSON();
  state.pushSubs = state.pushSubs.filter(x=>x.endpoint!==j.endpoint);
  state.pushSubs.push({endpoint:j.endpoint, keys:j.keys, name:state.name, lang:state.lang, ts:nowStr()});
  lsSet(PUSH_ENDPOINT_KEY, j.endpoint);
  await saveShared();
}
async function enablePush(){
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ state.pushMsg = t('pushDenied'); render(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8(VAPID_PUBLIC_KEY)});
    await registerPushSub(sub);
    state.pushMsg = '';
  }catch(e){ console.error('Push einschalten fehlgeschlagen', e); state.pushMsg = t('pushFailed'); }
  render();
}
// Nach Anmeldung/Sprachwechsel: Handy hat schon erlaubt -> Abo still auf
// aktuelle Person/Sprache umschreiben (kein erneutes Nachfragen).
async function syncPushSub(){
  if(!pushSupported() || !state.loggedIn || Notification.permission!=='granted') return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub) return;
    const cur = state.pushSubs.find(x=>x.endpoint===sub.endpoint);
    if(cur && cur.name===state.name && cur.lang===state.lang) return;
    await registerPushSub(sub);
    render();
  }catch(e){}
}
// Beim Abmelden: Handy nicht mehr dieser Person zuordnen
async function unlinkPushSub(){
  const ep = lsGet(PUSH_ENDPOINT_KEY);
  if(!ep) return;
  const before = state.pushSubs.length;
  state.pushSubs = state.pushSubs.filter(x=>x.endpoint!==ep);
  if(state.pushSubs.length!==before) await saveShared();
}

  let s = tl(lang, key);

// target = {roles:[...], names:[...]}; Texte werden für alle 5 Sprachen
// mitgeschickt, die Funktion nimmt pro Handy die passende.
function notify(target, titleKey, bodyKey, vars){
  if(!supabaseClient || !supabaseClient.functions) return;
  const msgs = {};
  LANGS.forEach(l=>{ msgs[l.code] = {title:tlv(l.code,titleKey,vars), body:tlv(l.code,bodyKey,vars)}; });
  supabaseClient.functions.invoke('send-push', {body:{roles:target.roles||[], names:target.names||[], exclude:state.name||null, msgs, url:'./geruest-bestell-app.html'}})
    .then(({data})=>{
      if(data && Array.isArray(data.gone) && data.gone.length){
        state.pushSubs = state.pushSubs.filter(x=>!data.gone.includes(x.endpoint));
        saveShared();
      }
    })
    .catch(e=>console.warn('Push-Versand nicht möglich', e));
}

function enterRole(role){

  if(role==='chef'){ state.askChefPw=true; state.loginWarn=''; render(); return; }
  state.role = role; state.loggedIn = true; state.loginWarn='';
  saveSession();
  render();
  syncPushSub();
}

// Kategorien starten eingeklappt (Liste soll kurz wirken), "Häufig
// bestellt" startet aufgeklappt. Eine Kategorie mit Teilen im
// aktuellen Warenkorb bleibt immer sichtbar, auch wenn zugeklappt,
// damit man die eigene Auswahl nicht aus den Augen verliert.
function isCatCollapsed(id){
  if(Object.prototype.hasOwnProperty.call(state.collapsedCats, id)) return state.collapsedCats[id];
  return id !== '_fav';
}

function catSectionHTML(id, label, items){
  const hasCartItems = items.some(it=>(state.cart[it.id]||0)>0);
  const open = !isCatCollapsed(id) || hasCartItems;
  let rowIdx = 0;
  const rows = open ? items.map(it=>{ rowIdx++; return catalogRowHTML(it, rowIdx%2===0); }).join('') : '';
  return `<tr class="cat-row" data-action="cat-toggle" data-cat="${id}">
    <td colspan="3"><span class="cat-chevron">${open?'▾':'▸'}</span>${label} <span class="cat-count">(${items.length})</span></td>
  </tr>${rows}`;
}

// ---- Dringlichkeit / Wunschtermin -----------------------------------
// Die Baustelle wählt im Bestellschein-Entwurf, wann sie die Teile
// braucht: normal / dringend / morgen früh / Wunschtermin. Gespeichert als
// order.wunsch ('dringend'|'morgen'|'datum') + order.bis (ISO-Datum).
// Lager/Fahrer/Chef sehen offene Bestellungen danach sortiert
// (sortOrdersForWork): dringend zuerst, dann nach Datum, Rest nach Nummer.
const WUNSCH_OPTS = [['normal','wunschNormal'],['dringend','wunschDringend'],['morgen','wunschMorgen'],['datum','wunschDatum']];
function wunschBadgeHTML(o){
  if(o.status==='Geliefert') return '';
  if(o.wunsch==='dringend') return `<span class="wunsch-badge w-urgent">${t('badgeDringend')}</span>`;
  if(!o.bis) return '';
  const today = todayISO();
  if(o.bis < today) return `<span class="wunsch-badge w-urgent">${t('badgeUeberfaellig',{d:formatDateDE(o.bis)})}</span>`;
  if(o.bis === today) return `<span class="wunsch-badge w-today">${t('badgeHeute')}</span>`;
  return `<span class="wunsch-badge">${t('badgeBis',{d:formatDateDE(o.bis)})}</span>`;
}
function sortOrdersForWork(list){
  const rank = o => o.status==='Geliefert' ? 3 : o.wunsch==='dringend' ? 0 : o.bis ? 1 : 2;
  return [...list].sort((a,b)=>{
    const ra = rank(a), rb = rank(b);
    if(ra!==rb) return ra-rb;
    if(ra===1 && a.bis!==b.bis) return a.bis < b.bis ? -1 : 1;
    if(ra===3) return b.id-a.id;   // Geliefertes: neueste zuerst, ganz unten
    return a.id-b.id;
  });
}

// ---- Packliste (Lager) ---------------------------------------------
// Solange eine Bestellung "In Bearbeitung" ist, hakt das Lager jede
// Position ab: "Eingepackt" oder "Fehlt" (mit Anzahl, die fehlt).
// order.pick = {[Positions-Index]: {s:'ok'|'fehlt', n:fehlende Stück}}.
// Bei "Bereit melden" wird die Bestellung auf das Eingepackte gekürzt,
// nur das vom Bestand abgezogen und für das Fehlende automatisch eine
// Nachlieferung angelegt (neue Bestellung, nachVon = alte Nummer; die
// alte bekommt fehlt[] + nachId). Der Besteller bekommt eine Nachricht.
function pickState(o, i){ return (o.pick||{})[i] || null; }
function pickMissN(o, i){
  const p = pickState(o, i);
  if(!p || p.s!=='fehlt') return 0;
  const q = o.items[i].qty;
  return Math.min(q, Math.max(1, parseInt(p.n,10) || q));
}
function pickListHTML(o){
  const done = o.items.filter((_,i)=>pickState(o,i)).length;
  const miss = o.items.filter((_,i)=>pickMissN(o,i)>0).length;
  return `<div class="pick-hint">${t('pickHint')}</div>
  <div class="pick-list">${o.items.map((it,i)=>{
    const r = resolvedItem(it), p = pickState(o,i);
    return `<div class="pick-row ${p? 'pk-'+p.s : ''}">
      <div class="pick-main">
        <div class="pick-name">${it.qty} ${r.unit} — ${r.name}</div>
        ${p && p.s==='fehlt'? `<label class="pick-miss">${t('pickMissQty')} <input type="number" min="1" max="${it.qty}" inputmode="numeric" id="pickMiss-${o.id}-${i}" data-order="${o.id}" data-idx="${i}" value="${pickMissN(o,i)}"> ${r.unit}</label>`:''}
      </div>
      <div class="pick-btns">
        <button class="pick-btn ok ${p&&p.s==='ok'?'on':''}" data-action="pick" data-order="${o.id}" data-idx="${i}" data-s="ok">✓ ${t('pickOkBtn')}</button>
        <button class="pick-btn miss ${p&&p.s==='fehlt'?'on':''}" data-action="pick" data-order="${o.id}" data-idx="${i}" data-s="fehlt">✗ ${t('pickMissBtn')}</button>
      </div>
    </div>`;
  }).join('')}</div>
  <div class="pick-progress">${t('pickProgress',{a:done, n:o.items.length})}${miss? ` · <b>${t('pickMissingCount',{n:miss})}</b>`:''}</div>
  <div id="pickWarn-${o.id}"></div>`;
}
function itemsListHTML(items){
  return `<ul class="order-items">${items.map(i=>{const r=resolvedItem(i); return `<li>${i.qty} ${r.unit} — ${r.name}</li>`;}).join('')}</ul>`;
}

function driverStatusMeta(s){

// ---- Fahrer-Kalender: wo wann was ist ---------------------------------
// Führt LKW-Termine (state.lkwEntries, mit Uhrzeit) und geplante
// Lieferungen (state.plannedDeliveries) je Tag zusammen, jeweils mit
// Bauvorhaben (Status-Farbe, Adresse, Maps-Link). Oben eine Wochenleiste
// (Mo–So) mit Punkten je Termin, darunter der gewählte Tag
// (state.fahrerCalDay, ISO-Datum, Standard heute).
function addDaysISO(iso, n){
  const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function weekStartISO(iso){
  const wd = new Date(iso+'T12:00:00').getDay();  // 0 = Sonntag
  return addDaysISO(iso, wd===0 ? -6 : 1-wd);
}
function calEventsOn(iso){
  const ev = [];
  state.lkwEntries.filter(e=>e.date===iso).forEach(e=>ev.push({kind:'termin', time:e.time||'', projekt:e.projekt, notiz:e.notiz||''}));
  state.plannedDeliveries.filter(pd=>pd.date===iso).forEach(pd=>ev.push({kind:'lieferung', time:'', projekt:pd.projekt, items:pd.items}));
  state.projects.filter(p=>p.fertigAm===iso).forEach(p=>ev.push({kind:'fertig', time:'', projekt:p.id}));
  // Termine mit Uhrzeit zuerst (nach Zeit), dann Lieferungen ohne Uhrzeit
  return ev.sort((a,b)=> (a.time? 0:1)-(b.time? 0:1) || a.time.localeCompare(b.time));
}
function calEventHTML(ev){
  const p = state.projects.find(x=>x.id===ev.projekt);
  const hex = p ? projektColorMeta(p.farbe).hex : null;
  const mapsUrl = !p ? '' : p.coords
    ? `https://www.google.com/maps?q=${p.coords.lat},${p.coords.lon}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.adresse)}`;
  const items = ev.kind==='lieferung' ? ev.items.map(i=>{const r=resolvedItem(i); return `<li>${i.qty} ${r.unit} — ${r.name}</li>`;}).join('') : '';
  return `<div class="order-card proj-card ev-card" style="${hex?`--pc:${hex};`:''}">
    <div class="ev-head">
      <div class="ev-time">${ev.time || t('fkAllDay')}</div>
      <span class="ev-kind ${ev.kind}">${ev.kind==='termin' ? t('fkTermin') : ev.kind==='fertig' ? '🏁 '+t('fkFertig') : t('fkLieferung')}</span>
    </div>
    <div class="no" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;">${p? `BV ${p.id} – ${p.name}` : '–'}</div>
    ${p? `<div class="order-time" style="margin:2px 0 0 0;">${p.adresse}</div>`:''}
    ${ev.notiz? `<div class="ev-notiz">${ev.notiz}</div>`:''}
    ${items? `<ul class="order-items">${items}</ul>${weightLineHTML(ev.items)}`:''}
    ${mapsUrl? `<a class="maps-btn" href="${mapsUrl}" target="_blank" rel="noopener">${t('mapsLink')}</a>`:''}
  </div>`;
}
function fahrerKalenderHTML(){
  const today = todayISO();
  const sel = state.fahrerCalDay || today;
  const start = weekStartISO(sel);
  const days = [0,1,2,3,4,5,6].map(i=>addDaysISO(start,i));
  const wd = WEEKDAYS[state.lang]||WEEKDAYS.de;
  const strip = days.map(d=>{
    const ev = calEventsOn(d);
    const dots = ev.slice(0,4).map(e=>{
      const p = state.projects.find(x=>x.id===e.projekt);
      const hex = p ? projektColorMeta(p.farbe).hex : null;
      return `<i style="background:${hex||'var(--muted)'}"></i>`;
    }).join('');
    return `<button class="day-cell ${d===sel?'active':''} ${d===today?'today':''}" data-action="fk-day" data-day="${d}">
      <span class="day-wd">${wd[new Date(d+'T12:00:00').getDay()]}</span>
      <span class="day-no">${Number(d.slice(8,10))}</span>
      <span class="day-dots">${dots}</span>
    </button>`;
  }).join('');
  const events = calEventsOn(sel);
  let empty = '';
  if(!events.length){
    const next = [...state.lkwEntries.map(e=>e.date), ...state.plannedDeliveries.map(pd=>pd.date), ...state.projects.map(p=>p.fertigAm).filter(Boolean)].filter(d=>d>sel).sort()[0];
    empty = `<div class="empty-state" style="padding:26px 10px;">${t('fkDayEmpty')}
      ${next? `<div style="margin-top:12px;"><button class="chip-btn" data-action="fk-day" data-day="${next}">${t('fkNext')} ${formatDateDE(next)} ›</button></div>`:''}</div>`;
  }
  return `<p class="view-sub">${t('fkSub')}</p>
  <div class="week-nav">
    <button class="chip-btn" data-action="fk-day" data-day="${addDaysISO(sel,-7)}" aria-label="${t('fkPrevWeek')}">‹</button>
    <div class="week-label">${formatDateDE(days[0]).split(', ')[1].slice(0,6)} – ${formatDateDE(days[6]).split(', ')[1]}</div>
    <button class="chip-btn" data-action="fk-day" data-day="${addDaysISO(sel,7)}" aria-label="${t('fkNextWeek')}">›</button>
    ${sel!==today? `<button class="chip-btn primary" data-action="fk-day" data-day="${today}">${t('fkToday')}</button>`:''}
  </div>
  <div class="week-strip">${strip}</div>
  <h3 class="section-h">${formatDateDE(sel)}</h3>
  ${events.length? `<div class="card-grid">${events.map(calEventHTML).join('')}</div>` : empty}`;
}

// Status-Farbe pro Bauvorhaben (nur vom Chef änderbar, Fahrer sieht sie
// nur): grün = "da muss was hin" (Lieferung nötig), hellblau = "da muss
// was geräumt/abgeholt werden" (Abbau), schwarz = nichts zu tun.
// Die gespeicherten Werte ('schwarz' usw.) bleiben gleich, nur die
// angezeigten Töne sind auf das SG-Design abgestimmt; "nichts zu tun"
// ist bewusst ein ruhiges Grau (Schwarz war im Dunkelmodus unsichtbar).
const PROJECT_COLORS = ['gruen','hellblau','schwarz'];
function projektColorMeta(c){
  const map = {
    gruen:{hex:'#1E9E5A', key:'pvColorGreen'},
    hellblau:{hex:'#3AA0E6', key:'pvColorBlue'},
    schwarz:{hex:'#7A8896', key:'pvColorBlack'},
  };
  return map[c] || {hex:null, key:'pvColorNone'};
}
function projektLabel(id){
  const p = state.projects.find(x=>x.id===id);
  return p ? `BV ${p.id} – ${p.name}` : '';
}
function todayISO(){
  const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function nowStr(){
  return new Date().toLocaleString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function nextPlanned(){
  const today = todayISO();
  return [...state.plannedDeliveries].filter(pd=>pd.date>=today).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)[0] || null;
}
function driverNames(){
  const names = state.employees.filter(e=>e.roles.includes('fahrer')).map(e=>e.name);
  Object.keys(state.driverStatus).forEach(n=>{ if(!names.includes(n) && findEmployee(n)) names.push(n); });
  return names;
}

function widgetTile(o){
  const tag = o.tab ? 'button' : 'div';
  const attrs = o.tab ? `data-action="widget-go" data-tab="${o.tab}"` : '';
  return `<${tag} class="widget w-${o.tone||'grey'}" ${attrs}>
    <div class="w-top"><span class="w-dot"></span>${o.label}</div>
    <div class="w-value ${o.small?'small':''}">${o.value}</div>
    ${o.detail? `<div class="w-detail">${o.detail}</div>`:''}
  </${tag}>`;
}

  const planTile = tab=>widgetTile({tone:'grey', label:t('wNaechsteGeplant'), small:true,
    value: np? formatDateDE(np.date) : t('wNichtsGeplant'), detail: np? projektLabel(np.projekt) : '', tab});
  let tiles = [];
  if(role==='baustelle'){
    const mine = orders.filter(o=>o.person===state.name).sort((a,b)=>b.id-a.id);
    if(!mine.length) return '';
    const unterwegs = mine.filter(o=>['Beladen','Unterwegs'].includes(o.status));
    const lager = mine.filter(o=>['Neu','In Bearbeitung','Bereit zur Abholung'].includes(o.status));
    const geliefert = mine.filter(o=>o.status==='Geliefert');
    tiles = [
      widgetTile({tone:'blue', label:t('wUnterwegsZuDir'), value:unterwegs.length, detail:firstLine(unterwegs)}),
      widgetTile({tone:'amber', label:t('wImLager'), value:lager.length, detail: lager.length? `#${lager[0].id} · ${statusLabel(lager[0].status)}` : ''}),
      widgetTile({tone:'green', label:t('wGeliefert'), value:geliefert.length, detail:firstLine(geliefert)}),
    ];
  }
  if(role==='fahrer'){
    const laden = by(['Bereit zur Abholung']);
    const lkw = by(['Beladen','Unterwegs']);
    const raeumen = state.projects.filter(p=>p.aktiv && p.farbe==='hellblau');
    tiles = [
      widgetTile({tone:'accent', label:t('wZuLaden'), value:laden.length, detail:[weightText(laden.flatMap(o=>o.items)), firstLine(laden)].filter(Boolean).join(' · '), tab:'lieferungen'}),
      widgetTile({tone:'blue', label:t('wAufLkw'), value:lkw.length, detail:[weightText(lkw.flatMap(o=>o.items)), firstLine(lkw)].filter(Boolean).join(' · '), tab:'lieferungen'}),
      widgetTile({tone:'sky', label:t('wZuRaeumen'), value:raeumen.length, detail:raeumen.map(p=>p.name).join(', '), tab:'bauvorhaben'}),
      planTile('kalender'),
    ];
  }
  if(role==='lager'){
    const neu = by(['Neu']), arbeit = by(['In Bearbeitung']);
    const fehlt = CATALOG.filter(it=>(state.inventory[it.id]??0)<0);
    tiles = [
      widgetTile({tone:'grey', label:t('wNeu'), value:neu.length, detail:firstLine(neu), tab:'bestellungen'}),
      widgetTile({tone:'amber', label:t('wInArbeit'), value:arbeit.length, detail:firstLine(arbeit), tab:'bestellungen'}),
      widgetTile({tone: fehlt.length?'red':'green', label:t('wFehlt'), value:fehlt.length, detail:fehlt.map(itemName).join(', '), tab:'inventur'}),
      planTile('geplant'),
    ];
  }
  if(role==='chef'){
    const offen = orders.filter(o=>o.status!=='Geliefert');
    const drivers = driverNames();
    const unterwegs = drivers.filter(n=>state.driverStatus[n] && state.driverStatus[n].status==='unterwegs');
    const aktive = state.projects.filter(p=>p.aktiv);
    const cnt = c=>aktive.filter(p=>p.farbe===c).length;
    const dots = `<div class="w-dots">${PROJECT_COLORS.map(c=>`<span><i style="background:${projektColorMeta(c).hex}"></i>${cnt(c)}</span>`).join('')}</div>`;
    tiles = [
      widgetTile({tone:'amber', label:t('wOffen'), value:offen.length,
        detail:t('wOffenDetail',{neu:by(['Neu']).length, unterwegs:by(['Beladen','Unterwegs']).length})}),
      widgetTile({tone:'blue', label:t('wFahrerUnterwegs'), value:`${unterwegs.length}/${drivers.length}`,
        detail:unterwegs.map(n=>{ const z=state.driverStatus[n].ziel; return z? `${n} → ${projektLabel(z)}` : n; }).join(', ')}),
      `<button class="widget w-green" data-action="widget-go" data-tab="bauvorhaben">
        <div class="w-top"><span class="w-dot"></span>${t('wBauvorhaben')}</div>
        <div class="w-value">${aktive.length}</div>${dots}</button>`,

  return tiles.length? `<div class="widget-grid ${tiles.length===3?'three':''}">${tiles.join('')}</div>` : '';

// ---- Karte der Bauvorhaben (München + Umgebung) ------------------------
// Leaflet + OpenStreetMap, erst beim ersten Öffnen nachgeladen. Die App
// zeichnet alle 4 s neu (innerHTML) -- damit Karte, Zoom und offenes
// Popup das überleben, gibt es EIN dauerhaftes Karten-Element, das nach
// jedem render() wieder in den Platzhalter #bvMapSlot gehängt wird.
// Bauvorhaben ohne Koordinaten werden einmalig über die Adresse gesucht
// (Nominatim, max. 1 Anfrage/s) und die Koordinaten im Bauvorhaben
// gespeichert (p.coords) -- davon profitiert auch der Maps-Link.
const MAP_CENTER = [48.137, 11.575];
// München + Umland (ca. 80 km: Augsburg, Ingolstadt, Landshut, Mühldorf,
// Rosenheim, Garmisch), Format Nominatim: links,oben,rechts,unten
const MUC_VIEWBOX = '10.6,48.85,12.65,47.4';
let leafletLoading = null, bvMap = null, bvMapEl = null, bvLayer = null, bvMapSig = '', bvMapIds = '';
const geocodeTried = new Set();
let geocodeRunning = false;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletLoading) return leafletLoading;
  leafletLoading = new Promise((resolve, reject)=>{
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
    js.onload = resolve; js.onerror = ()=>{ leafletLoading = null; reject(); };
    document.head.appendChild(js);
  });
  return leafletLoading;
}
async function mountProjectMap(){
  const slot = document.getElementById('bvMapSlot');
  if(!slot) return;
  if(!bvMapEl){ bvMapEl = document.createElement('div'); bvMapEl.className = 'bv-map'; }
  slot.appendChild(bvMapEl);
  try{ await loadLeaflet(); }
  catch(e){ slot.innerHTML = `<div class="order-time" style="padding:12px;">${t('mapLoadError')}</div>`; return; }
  if(!document.body.contains(bvMapEl)) return;
  if(!bvMap){
    bvMap = L.map(bvMapEl, {scrollWheelZoom:false}).setView(MAP_CENTER, 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'© OpenStreetMap'}).addTo(bvMap);
    bvLayer = L.layerGroup().addTo(bvMap);
  } else {
    bvMap.invalidateSize();
  }
  updateMapMarkers();
  geocodeMissing();
}
function updateMapMarkers(){
  if(!bvMap) return;
  const aktive = state.projects.filter(p=>p.aktiv && p.coords);
  const lc = state.lager && state.lager.coords;
  const sig = state.lang+'|'+JSON.stringify([state.lager, aktive.map(p=>[p.id,p.name,p.adresse,p.farbe,p.coords,p.fertigAm])]);
  if(sig!==bvMapSig){
  bvMapSig = sig;
  bvLayer.clearLayers();
  if(lc){
    L.marker([lc.lat, lc.lon], {icon:L.divIcon({className:'truck-pin lager-pin', html:'🏭', iconSize:[34,34], iconAnchor:[17,17]})})
      .bindTooltip(t('lagerMapLabel'), {permanent:true, direction:'top', offset:[0,-16], className:'bv-tip'})
      .bindPopup(`<b>🏭 ${t('lagerMapLabel')}</b>${state.lager.adresse? `<br>${escapeHtml(state.lager.adresse)}`:''}`)
      .addTo(bvLayer);
  }
  aktive.forEach(p=>{
    const m = projektColorMeta(p.farbe);
    const ll = [p.coords.lat, p.coords.lon];
    const maps = `https://www.google.com/maps?q=${p.coords.lat},${p.coords.lon}`;
    L.circleMarker(ll, {radius:11, color:'#fff', weight:3, fillColor:m.hex||'#94A3B8', fillOpacity:1})
      .bindTooltip(`BV ${p.id}`, {permanent:true, direction:'top', offset:[0,-10], className:'bv-tip'})
      .bindPopup(`<b>BV ${p.id} – ${escapeHtml(p.name)}</b><br>${escapeHtml(p.adresse)}<br>
        <span style="color:${m.hex||'#64748B'};font-weight:700;">● ${t(m.key)}</span>
        ${p.fertigAm? `<br>🏁 ${t('pvFertigGeplant')} ${formatDateDE(p.fertigAm)}`:''}
        <br><a href="${maps}" target="_blank" rel="noopener">${t('mapsLink')}</a>`)
      .addTo(bvLayer);
  });
  }
  // LKW-Standorte (nur in der Chef-Rolle, sonst leer)
  const trucks = updateTruckMarkers();
  const pts = aktive.map(p=>[p.coords.lat, p.coords.lon]).concat(trucks.map(x=>x[1]), lc? [[lc.lat, lc.lon]] : []);
  // Ausschnitt nur neu einpassen, wenn Bauvorhaben/LKWs dazukommen oder
  // wegfallen -- sonst bleibt die gewählte Ansicht erhalten.
  const ids = aktive.map(p=>p.id).join(',')+'|'+trucks.map(x=>x[0]).join(',')+'|'+(lc? lc.lat+','+lc.lon : '');
  if(pts.length && ids!==bvMapIds){
    bvMap.fitBounds(pts, {padding:[40,40], maxZoom:13});
    bvMapIds = ids;
  }
}
async function geocodeMissing(){
  if(geocodeRunning) return;
  const todo = state.projects.filter(p=>p.aktiv && !p.coords && p.adresse && !geocodeTried.has(p.id));
  if(!todo.length) return;
  geocodeRunning = true;
  for(const p of todo){
    geocodeTried.add(p.id);
    try{
      // Zuerst nur im Raum München suchen (sonst landet z. B. eine Adresse
      // ohne Ortsangabe in einer gleichnamigen Straße anderswo), erst wenn
      // dort nichts gefunden wird, in ganz Deutschland.
      const base = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=de&q=${encodeURIComponent(p.adresse)}`;
      let res = await (await fetch(base+`&viewbox=${MUC_VIEWBOX}&bounded=1`, {headers:{'Accept-Language':'de'}})).json();
      if(!res || !res[0]){
        await new Promise(r=>setTimeout(r, 1100));
        res = await (await fetch(base, {headers:{'Accept-Language':'de'}})).json();
      }
      if(res && res[0]){
        const cur = state.projects.find(x=>x.id===p.id);
        if(cur && !cur.coords){ cur.coords = {lat:parseFloat(res[0].lat), lon:parseFloat(res[0].lon)}; await saveShared(); updateMapMarkers(); }
      }
    }catch(e){ console.error('Adresse nicht gefunden', p.adresse, e); }
    await new Promise(r=>setTimeout(r, 1100));
  }
  geocodeRunning = false;
}

// ---- LKW-Standorte (nur der Chef sieht sie) ---------------------------
// Solange ein Fahrer angemeldet ist und die App offen (im Vordergrund)
// hat, schickt sie etwa alle 30 s seine Position. Gespeichert wird NUR die
// letzte Position, je Fahrer in einer eigenen Zeile von app_state
// (key = POS_PREFIX + Name) -- so überschreiben sich die häufigen
// Standort-Meldungen nicht mit Bestellungen im großen Datensatz. Klappt
// das nicht (z. B. Tabellen-Regeln erlauben keine neue Zeile), landet sie
// ersatzweise in driverPos im großen Datensatz. Beim Abmelden/Rollen-
// wechsel wird sie gelöscht. Geladen wird sie nur in der Chef-Rolle.
const POS_PREFIX = 'shopfloor-pos:';
const POS_EVERY_MS = 30000;          // höchstens alle 30 s senden
const POS_LIVE_MS = 2*60*1000;       // bis 2 Min. alt = "live"
const POS_MAX_AGE_MS = 12*60*60*1000; // älter als 12 h -> nicht mehr anzeigen
let geoWatch = null, geoName = null, geoLast = null, geoLastSent = 0, geoDenied = false;
let posLayer = null, posMarkers = {}, posLoadedOnce = false;

function geoShouldShare(){
  return state.loggedIn && state.role==='fahrer' && !!state.name && !geoDenied && document.visibilityState!=='hidden';
}
function syncGeo(){
  if(geoWatch!==null && (!state.loggedIn || state.role!=='fahrer' || state.name!==geoName)){
    stopGeo(true);  // abgemeldet/andere Rolle (auch durch enforceSession)
  }
  if(!geoShouldShare()){
    if(geoWatch!==null){ navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
    return;
  }
  if(geoWatch!==null) return;
  if(!('geolocation' in navigator)){ state.geoStatus = 'unavailable'; updateGeoBadge(); return; }
  geoName = state.name;
  if(state.geoStatus!=='on') state.geoStatus = 'wait';
  geoWatch = navigator.geolocation.watchPosition(onGeo, onGeoErr, {enableHighAccuracy:true, maximumAge:15000, timeout:60000});
  updateGeoBadge();
}
function onGeo(p){
  geoLast = {lat:+p.coords.latitude.toFixed(5), lon:+p.coords.longitude.toFixed(5), acc:Math.round(p.coords.accuracy||0), fix:Date.now()};
  if(state.geoStatus!=='on'){ state.geoStatus = 'on'; updateGeoBadge(); }
  if(Date.now()-geoLastSent >= POS_EVERY_MS) sendPos();
  autoDriverStatus(geoLast);
}
function onGeoErr(e){
  if(e && e.code===1){  // nicht erlaubt
    geoDenied = true; state.geoStatus = 'denied';
    if(geoWatch!==null){ navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
    updateGeoBadge();
  }
  // Zeitüberschreitung/kein Signal: watchPosition versucht es selbst weiter
}
async function sendPos(){
  if(!geoLast || !geoName || Date.now()-geoLast.fix > 5*60*1000) return;
  geoLastSent = Date.now();
  await writePos(geoName, {lat:geoLast.lat, lon:geoLast.lon, acc:geoLast.acc, ts:Date.now()});
}
async function writePos(name, v){
  if(!supabaseClient) return;
  try{
    const { error } = await supabaseClient.from('app_state').upsert({key:POS_PREFIX+name, value: v || {off:true, ts:Date.now()}});
    if(error) throw error;
  }catch(e){
    console.warn('Standort-Zeile nicht speicherbar, nutze gemeinsamen Datensatz', e);
    await loadShared();  // frisch laden, damit nichts Neueres überschrieben wird
    if(v) state.driverPos[name] = v; else delete state.driverPos[name];
    await saveShared();
  }
}
// ---- Fahrer-Status automatisch (Am Lager / Unterwegs) -------------------
// Hat der Chef den Lager-Standort eingetragen (state.lager.coords), stellt
// das Fahrer-Handy (App offen, Standort geteilt) den Status selbst um:
// innerhalb LAGER_IN_M -> "Am Lager", weiter weg als LAGER_OUT_M ->
// "Unterwegs" (Abstand dazwischen gegen Hin- und Herspringen). Umgestellt
// wird nur beim WECHSEL der Zone -- stellt der Fahrer oder Chef von Hand
// um, bleibt das, bis er die Zone wirklich wechselt. Beim ersten Standort
// nach dem Öffnen wird ein gerade (< 15 Min.) von Hand gesetzter Status
// nicht überschrieben. Ein vom Chef/Fahrer gewähltes Ziel bleibt erhalten,
// wenn der Status schon "Unterwegs" ist.
const LAGER_IN_M = 250, LAGER_OUT_M = 450;
let geoZone = null, autoBusy = false;
async function autoDriverStatus(pos){
  const lc = state.lager && state.lager.coords;
  if(!lc || !geoName || autoBusy || (pos.acc && pos.acc > 300)) return;
  const d = distM([pos.lat, pos.lon], [lc.lat, lc.lon]);
  const zone = d <= LAGER_IN_M ? 'in' : d >= LAGER_OUT_M ? 'out' : null;
  if(!zone || zone===geoZone) return;
  const first = geoZone===null;
  geoZone = zone;
  const want = zone==='in' ? 'lager' : 'unterwegs';
  const cur = state.driverStatus[geoName];
  if(cur && cur.status===want) return;
  if(first && cur && cur.ts && Date.now()-cur.ts < 15*60*1000) return;
  autoBusy = true;
  try{
    await loadShared();  // frisch laden, damit nichts Neueres überschrieben wird
    const c2 = state.driverStatus[geoName];
    if(!geoName || (c2 && c2.status===want)) return;
    state.driverStatus[geoName] = {status:want, ziel:null, by:null, time:nowStr(), ts:Date.now(), auto:true};
    await saveShared();
    const ae = document.activeElement;
    if(state.loggedIn && !(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))) render();
  } finally { autoBusy = false; }
}

async function loadPositions(){
  if(!supabaseClient) return;
  const pos = {};
  Object.entries(state.driverPos||{}).forEach(([n,v])=>{ if(v && v.lat!=null) pos[n] = v; });
  try{
    const { data, error } = await supabaseClient.from('app_state').select('key,value').like('key', POS_PREFIX+'%');
    if(error) throw error;
    (data||[]).forEach(r=>{
      const n = r.key.slice(POS_PREFIX.length), v = r.value;
      if(!v || v.off || v.lat==null){ if(v && pos[n] && (v.ts||0) >= (pos[n].ts||0)) delete pos[n]; return; }
      if(!pos[n] || (v.ts||0) > (pos[n].ts||0)) pos[n] = v;
    });
  }catch(e){ console.warn('Standorte nicht ladbar', e); }
  state.positions = pos;
}
function livePositions(){
  const now = Date.now();
  return Object.entries(state.positions||{})
    .filter(([,v])=> v && v.lat!=null && now-(v.ts||0) < POS_MAX_AGE_MS)
    .sort((a,b)=> a[0].localeCompare(b[0]));
}
function posAgoText(ts){

  const d = new Date(ts);
  return t('posLastSeen', {time:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`});
}

// ---- Routen auf der Chef-Karte ----------------------------------------
// Für jeden Fahrer, der "Unterwegs" zu einem Bauvorhaben (mit Koordinaten)
// ist und seinen Standort teilt, zeichnet die Karte die Straßen-Route von
// seiner Position zum Bauvorhaben, mit Fahrzeit + km. Quelle: freier
// OSRM-Routendienst (OpenStreetMap, kein Schlüssel nötig; Google-Routen
// direkt in der Karte bräuchten ein kostenpflichtiges Google-Konto).
// Neu berechnet nur, wenn sich der LKW > 150 m bewegt hat (höchstens alle
// 20 s je Fahrer). Klappt der Dienst nicht, bleibt eine gestrichelte
// Luftlinie. Im Popup zusätzlich "Route in Google Maps".
const ROUTE_URL = 'https://router.project-osrm.org/route/v1/driving/';
let routeLayer = null;
const routeCache = {};  // Name -> {ziel, line, from, routedFrom, info:{min,km}, at, fetching}
function routeTarget(n){
  const ds = state.driverStatus[n];
  if(!ds || ds.status!=='unterwegs' || !ds.ziel) return null;
  const p = state.projects.find(x=>x.id===ds.ziel);
  return p && p.coords ? p : null;
}
function distM(a, b){
  const R = 6371000, toR = x=>x*Math.PI/180;
  const dLat = toR(b[0]-a[0]), dLon = toR(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function routeInfoText(info){
  const km = info.km < 10 ? info.km.toFixed(1) : String(Math.round(info.km));
  return t('routeEta', {min:info.min, km: state.lang==='en' ? km : km.replace('.', ',')});
}
function updateRoutes(list){
  if(!routeLayer) routeLayer = L.layerGroup().addTo(bvMap);
  const active = new Set();
  list.forEach(([n,v])=>{
    const p = routeTarget(n);
    if(!p) return;
    active.add(n);
    const from = [v.lat, v.lon], to = [p.coords.lat, p.coords.lon];
    let c = routeCache[n];
    if(c && c.ziel!==p.id){ routeLayer.removeLayer(c.line); c = null; }
    if(!c){
      c = routeCache[n] = {ziel:p.id, from, routedFrom:null, info:null, at:0, fetching:false,
        line: L.polyline([from, to], {color:'#0069B3', weight:5, opacity:0.8, dashArray:'6 9'}).addTo(routeLayer)};
    }
    c.from = from;
    if(!c.routedFrom) c.line.setLatLngs([from, to]);  // noch keine Straßen-Route: Luftlinie
    const due = Date.now()-c.at > 20000;
    if(!c.fetching && due && (!c.routedFrom || distM(c.routedFrom, from) > 150)) fetchRoute(n, c, from, to);
  });
  Object.keys(routeCache).forEach(n=>{ if(!active.has(n)){ routeLayer.removeLayer(routeCache[n].line); delete routeCache[n]; } });
}
async function fetchRoute(n, c, from, to){
  c.fetching = true; c.at = Date.now();
  try{
    const r = await fetch(`${ROUTE_URL}${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`);
    const j = await r.json();
    if(routeCache[n]!==c || !j || j.code!=='Ok' || !j.routes || !j.routes[0]) return;
    const rt = j.routes[0];
    c.line.setLatLngs(rt.geometry.coordinates.map(([lon,lat])=>[lat,lon]));
    c.line.setStyle({dashArray:null});
    c.info = {min:Math.max(1, Math.round(rt.duration/60)), km:rt.distance/1000};
    c.routedFrom = from;
    const m = posMarkers[n], v = state.positions[n];
    if(m && v) m.setPopupContent(truckPopupHTML(n, v));
    document.querySelectorAll('.pos-chip').forEach(b=>{ if(b.dataset.name===n) b.innerHTML = posChipText(n, v); });
  }catch(e){ console.warn('Route nicht berechenbar', e); }
  finally{ c.fetching = false; }
}
function posChipText(n, v){
  const p = routeTarget(n), c = routeCache[n];
  return `🚚 ${escapeHtml(n)} · ${posAgoText(v.ts)}${p? ` · → BV ${p.id}${c && c.info? ` (${routeInfoText(c.info)})`:''}`:''}`;
}
// Marker je Fahrer bleiben bestehen und werden nur verschoben/beschriftet,
// damit ein offenes Popup das 4-s-Neuzeichnen übersteht.
function updateTruckMarkers(){
  if(!posLayer) posLayer = L.layerGroup().addTo(bvMap);
  const list = state.role==='chef' ? livePositions() : [];
  const keep = new Set(list.map(([n])=>n));
  Object.keys(posMarkers).forEach(n=>{ if(!keep.has(n)){ posLayer.removeLayer(posMarkers[n]); delete posMarkers[n]; } });
  list.forEach(([n,v])=>{
    const ll = [v.lat, v.lon];
    const live = Date.now()-v.ts < POS_LIVE_MS;
    const tip = `🚚 ${escapeHtml(n)} · ${posAgoText(v.ts)}`;
    let m = posMarkers[n];
    if(!m){
      m = L.marker(ll, {icon:L.divIcon({className:'truck-pin', html:'🚚', iconSize:[34,34], iconAnchor:[17,17]}), zIndexOffset:1000})
        .bindTooltip(tip, {permanent:true, direction:'right', offset:[14,0], className:'bv-tip truck-tip'})
        .bindPopup(truckPopupHTML(n, v))
        .addTo(posLayer);
      posMarkers[n] = m;
    } else {
      m.setLatLng(ll); m.setTooltipContent(tip); m.setPopupContent(truckPopupHTML(n, v));
    }
    m.setOpacity(live ? 1 : 0.55);
  });
  updateRoutes(list);
  return list.map(([n,v])=>[n, [v.lat, v.lon]]);
}
